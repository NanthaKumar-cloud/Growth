<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&amp;family=Poppins:wght@600;800;900&amp;display=swap');

      /* Camera Zoom Wrapper */
      .cam {
        transform-box: fill-box;
        transform-origin: center;
        animation: cameraZoom 7.27s ease-out forwards;
      }

      /* Base Entrance Class */
      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      /* Entrance Modifiers for Scene 3 */
      .e-bg-glow-s3 {
        animation: bgGlowPulse 2.0s ease-in-out 0.70s forwards; /* Starts at T_in, for subtle transform */
        opacity: 1; /* Already visible from previous scene's end state at t=0 */
      }
      .e-steam-s3 {
        animation: steamAdjust 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.70s forwards; /* Starts at T_in, for transform */
        opacity: 0.95; /* Visible from t=0, as per previous scene's end state */
      }
      .e-dosa {
        animation: dosaRise 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards; /* After T_in */
      }
      .e-dosa-ghee {
        animation: gheeShine 1.0s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; /* Appear after dosa */
      }
      .e-headline-s3 {
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.00s forwards; /* Narration start */
      }
      .e-support-s3 {
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.00s forwards; /* After headline */
      }

      /* Idle Loop Classes */
      .i-bob {
        animation: floatBob 3.2s ease-in-out infinite alternate;
      }
      .i-shimmer {
        animation: sparkShimmer 1.5s ease-in-out infinite alternate;
      }
      .i-pulse {
        animation: heatPulse 2.0s ease-in-out infinite alternate;
      }

      /* Keyframes */
      @keyframes cameraZoom {
        0% { transform: scale(1.0); }
        100% { transform: scale(1.04); }
      }
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(45px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      /* bgGlowPulse is adapted from previous scene's sparkExplode, now for persistent background glow */
      @keyframes bgGlowPulse {
        0% { opacity: 1; transform: scale(1.0); } /* Retain previous scene's end state at t=0 */
        50% { transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1.0); }
      }
      /* steamAdjust transforms the steam path to wrap the dosa */
      @keyframes steamAdjust {
        0% { transform: translate(300px, 180px) scale(0.8); } /* Start shifted/scaled from implied previous position */
        100% { transform: translate(0, 0) scale(1); } /* To current scene's path position */
      }
      @keyframes dosaRise {
        0% { opacity: 0; transform: translateY(180px) scale(0.6); }
        100% { opacity: 1; transform: translateY(0px) scale(1); }
      }
      @keyframes gheeShine {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatBob {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes sparkShimmer {
        0% { transform: scale(0.88); opacity: 0.7; }
        100% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes heatPulse {
        0% { opacity: 0.35; transform: scale(0.95); }
        100% { opacity: 0.75; transform: scale(1.08); }
      }
    </style>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="steam-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="burstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2A922" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#E74C3C" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F2C2E" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="steamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A922" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFF8E7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#E74C3C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F2A922" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="gheeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB7A" />
      <stop offset="100%" stop-color="#F2A922" />
    </linearGradient>

    <linearGradient id="dosaGoldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFF8E7" />
        <stop offset="20%" stop-color="#F2A922" />
        <stop offset="50%" stop-color="#E74C3C" />
        <stop offset="80%" stop-color="#F2A922" />
        <stop offset="100%" stop-color="#FFF8E7" />
    </linearGradient>

  </defs>

  <!-- CAMERA WRAPPER -->
  <g class="cam">

    <!-- FULL-BLEED BACKGROUND -->
    <rect x="0" y="0" width="1920" height="1080" fill="#0F2C2E" />

    <!-- Ambient Teal Depth Lighting (persistent from previous scene) -->
    <circle cx="1280" cy="520" r="750" fill="#1A4346" opacity="0.35" />
    <circle cx="1280" cy="520" r="480" fill="#0F2C2E" opacity="0.6" />

    <!-- GOLDEN BURST BACKGROUND GLOW (Adapted from previous scene's e-sparks) -->
    <!-- Retains `burstCore` from previous scene, removes individual spark elements from prev SVG -->
    <g transform="translate(1280, 500)">
      <g class="a e-bg-glow-s3">
        <g class="i-pulse">
          <circle cx="0" cy="0" r="380" fill="url(#burstCore)" filter="url(#glow-gold)" />
        </g>
      </g>
    </g>

    <!-- HERO VISUAL: TOWERING GOLDEN CONICAL PAPER-ROAST DOSA -->
    <g transform="translate(960, 880)">
      <g class="a e-dosa">
        <g class="i-bob">
          <!-- Dosa Cone Shape -->
          <path d="M -150 0 C -120 -200, -80 -400, 0 -680 C 80 -400, 120 -200, 150 0 Z" 
                fill="url(#dosaGoldGradient)" filter="url(#shadow)" />
          
          <!-- Crispy Lattice Texture - using a pattern of thin lines -->
          <mask id="dosaMask">
            <path d="M -150 0 C -120 -200, -80 -400, 0 -680 C 80 -400, 120 -200, 150 0 Z" fill="white" />
          </mask>
          <g mask="url(#dosaMask)">
            <path d="M -140 0 L 140 0" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -120 -50 L 120 -50" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -100 -100 L 100 -100" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -80 -150 L 80 -150" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -60 -200 L 60 -200" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -40 -250 L 40 -250" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -20 -300 L 20 -300" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -5 -350 L 5 -350" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <!-- Vertical lines for texture -->
            <path d="M -100 0 L 0 -680" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M -50 0 L 0 -680" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M 50 0 L 0 -680" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
            <path d="M 100 0 L 0 -680" stroke="#FFF8E7" stroke-width="2" opacity="0.2" />
          </g>

          <!-- Glistening Ghee Droplets -->
          <g class="a e-dosa-ghee">
            <g class="i-shimmer">
              <circle cx="80" cy="-180" r="8" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
              <circle cx="-50" cy="-250" r="6" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
              <circle cx="100" cy="-350" r="10" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
              <circle cx="-110" cy="-80" r="7" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
              <circle cx="20" cy="-500" r="5" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- THROUGH-LINE ELEMENT: GLOWING TURMERIC-GOLD STEAM RIBBON -->
    <!-- Contains the new path for Scene 3, with a transform animation to guide it into place -->
    <g class="a e-steam-s3">
      <g class="i-bob">
        <!-- Outer Glowing Steam Ribbon -->
        <path d="M 500 1080 
                 C 700 980, 800 900, 960 880 
                 C 1120 900, 1200 800, 1300 680 
                 C 1400 560, 1500 400, 1400 280 
                 C 1300 160, 1100 100, 960 180" 
              fill="none" 
              stroke="url(#steamGrad)" 
              stroke-width="44" 
              stroke-linecap="round" 
              filter="url(#steam-glow)" 
              opacity="0.9" />

        <!-- Inner Core Steam Ribbon -->
        <path d="M 500 1080 
                 C 700 980, 800 900, 960 880 
                 C 1120 900, 1200 800, 1300 680 
                 C 1400 560, 1500 400, 1400 280 
                 C 1300 160, 1100 100, 960 180" 
              fill="none" 
              stroke="#FFF8E7" 
              stroke-width="12" 
              stroke-linecap="round" 
              opacity="0.95" />
      </g>
    </g>

    <!-- ON-SCREEN TEXT (LEFT SIDE) -->

    <!-- Headline: "Welcome To The Dosa Corner" -->
    <g transform="translate(120, 300)">
      <g class="a e-headline-s3">
        <g class="i-bob">
          <!-- Backing Card for Maximum Legibility -->
          <rect x="-30" y="-95" width="680" height="230" rx="20" fill="#0F2C2E" opacity="0.80" />
          
          <text font-family="'Poppins', Arial, sans-serif" font-size="88" font-weight="900" fill="#FFF8E7" x="0" y="0" filter="url(#shadow)">
            Welcome To The
          </text>
          <text font-family="'Poppins', Arial, sans-serif" font-size="88" font-weight="900" fill="#F2A922" x="0" y="100" filter="url(#glow-gold)">
            Dosa Corner
          </text>
        </g>
      </g>
    </g>

    <!-- Supporting Text: "Golden, crispy, and cooked fresh" -->
    <g transform="translate(120, 540)">
      <g class="a e-support-s3">
        <!-- Sub-card container -->
        <rect x="-24" y="-42" width="640" height="72" rx="16" fill="#1A4346" opacity="0.88" stroke="#F2A922" stroke-width="1.5" />
        <text font-family="'Noto Sans', sans-serif" font-size="44" font-weight="700" fill="#FFF8E7" x="0" y="10">
          Golden, crispy, and cooked fresh
        </text>
      </g>
    </g>

    <!-- PERSISTENT UI ELEMENTS (NO ENTRANCE ANIMATION - Visible at t=0) -->

    <!-- Top-Left Pill Badge ("The Dosa Corner") -->
    <g transform="translate(80, 52)">
      <rect x="0" y="0" width="320" height="64" rx="20" fill="#1A4346" stroke="#F2A922" stroke-width="2" filter="url(#shadow)" />
      
      <!-- Logo Icon: Mini Golden Dosa Cone -->
      <g transform="translate(24, 16)">
        <path d="M 4 28 L 28 4 L 32 24 Z" fill="#F2A922" />
        <path d="M 8 26 L 26 8" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" />
        <circle cx="28" cy="24" r="3" fill="#FFF8E7" />
      </g>

      <!-- Brand Name Text -->
      <text font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="800" fill="#F2A922" x="72" y="40" letter-spacing="0.5">
        THE DOSA CORNER
      </text>
    </g>

    <!-- Bottom Progress Bar (Segment 3 of 7 Highlighted) -->
    <g transform="translate(0, 1066)">
      <!-- Full Track -->
      <rect x="0" y="0" width="1920" height="14" fill="#1A4346" />
      <!-- Active Segment 3 (3/7th width = ~823px) -->
      <rect x="0" y="0" width="823" height="14" rx="7" fill="#F2A922" filter="url(#glow-gold)" />
    </g>

  </g> <!-- /Camera Wrapper -->
</svg>