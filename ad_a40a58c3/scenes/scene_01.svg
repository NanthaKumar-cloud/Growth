<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&amp;family=Poppins:wght@600;800;900&amp;display=swap');

      /* Camera Zoom Wrapper */
      .cam {
        transform-box: fill-box;
        transform-origin: center;
        animation: cameraZoom 5.83s ease-out forwards;
      }

      /* Base Entrance Class */
      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      /* Entrance Modifiers */
      .e-pop {
        animation: popScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
      }
      .e-head {
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }
      .e-batter {
        animation: drawSpiral 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.7s forwards;
      }
      .e-sparks {
        animation: popSparks 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
      }
      .e-supp {
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.98s forwards;
      }
      .e-steam {
        animation: flowSteam 2.0s cubic-bezier(0.22, 1, 0.36, 1) 2.2s forwards;
      }

      /* Idle Loop Classes */
      .i-bob {
        animation: floatBob 3.2s ease-in-out infinite alternate;
      }
      .i-pulse {
        animation: heatPulse 1.8s ease-in-out infinite alternate;
      }
      .i-spark {
        animation: sparkShimmer 1.2s ease-in-out infinite alternate;
      }

      /* Keyframe Definitions */
      @keyframes cameraZoom {
        0% { transform: scale(1.0); }
        100% { transform: scale(1.04); }
      }
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(45px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes popScale {
        0% { opacity: 0; transform: scale(0.6); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes drawSpiral {
        0% { opacity: 0; stroke-dashoffset: 1600; }
        15% { opacity: 1; }
        100% { opacity: 0.95; stroke-dashoffset: 0; }
      }
      @keyframes popSparks {
        0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes flowSteam {
        0% { opacity: 0; stroke-dashoffset: 2200; }
        20% { opacity: 1; }
        100% { opacity: 0.95; stroke-dashoffset: 0; }
      }
      @keyframes floatBob {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes heatPulse {
        0% { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes sparkShimmer {
        0% { transform: scale(0.85); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
    </style>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="steam-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="tawaBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#223336" />
      <stop offset="55%" stop-color="#142224" />
      <stop offset="88%" stop-color="#0D1719" />
      <stop offset="100%" stop-color="#080E0F" />
    </radialGradient>

    <radialGradient id="heatCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#F2A922" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2A922" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFF8E7" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#E74C3C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F2A922" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="batterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5E1" />
      <stop offset="100%" stop-color="#FCE8C3" />
    </linearGradient>

    <linearGradient id="gheeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB7A" />
      <stop offset="100%" stop-color="#F2A922" />
    </linearGradient>
  </defs>

  <!-- CAMERA WRAPPER -->
  <g class="cam">

    <!-- FULL-BLEED BACKGROUND -->
    <rect width="1920" height="1080" fill="#0F2C2E" />

    <!-- Ambient Teal Depth Gradients -->
    <circle cx="1200" cy="540" r="750" fill="#1A4346" opacity="0.35" />
    <circle cx="1200" cy="540" r="500" fill="#0F2C2E" opacity="0.6" />

    <!-- HERO TAWA (Right-Center Focus) -->
    <!-- Positioned centered at X=1220, Y=540 -->
    <g transform="translate(1220, 540)">
      
      <!-- Outer Iron Handle Rivets &amp; Edge Rim -->
      <circle cx="0" cy="0" r="452" fill="none" stroke="#1A292B" stroke-width="20" filter="url(#shadow)" />
      <circle cx="0" cy="0" r="440" fill="none" stroke="#2D4649" stroke-width="6" />

      <!-- Main Iron Tawa Surface -->
      <circle cx="0" cy="0" r="438" fill="url(#tawaBase)" />

      <!-- Concentric Cast-Iron Texture Rings -->
      <circle cx="0" cy="0" r="380" fill="none" stroke="#253A3D" stroke-width="2.5" opacity="0.5" />
      <circle cx="0" cy="0" r="310" fill="none" stroke="#253A3D" stroke-width="2" opacity="0.5" />
      <circle cx="0" cy="0" r="240" fill="none" stroke="#253A3D" stroke-width="2" opacity="0.4" />
      <circle cx="0" cy="0" r="170" fill="none" stroke="#253A3D" stroke-width="1.5" opacity="0.4" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#253A3D" stroke-width="1.5" opacity="0.3" />

      <!-- Heat Core Glow Effect (Animated Idle Pulse) -->
      <g class="i-pulse">
        <circle cx="0" cy="0" r="280" fill="url(#heatCore)" />
      </g>

      <!-- Oil Sheen Reflections -->
      <path d="M -260 -180 Q -100 -320 120 -280 Q -80 -220 -260 -180 Z" fill="#FFF" opacity="0.04" />
      <path d="M 140 180 Q 280 100 320 -40 Q 240 120 140 180 Z" fill="#FFF" opacity="0.03" />

      <!-- ANIMATED BATTER SPIRAL -->
      <g class="a e-batter">
        <path d="M 0 0 
                 C 25 -30, 50 -10, 50 20 
                 C 50 70, -40 70, -70 20 
                 C -110 -50, -20 -130, 60 -120 
                 C 160 -110, 200 20, 140 130 
                 C 60 230, -110 200, -200 100 
                 C -290 -10, -240 -190, -100 -270
                 C 60 -350, 270 -260, 320 -80
                 C 370 100, 240 330, 20 370" 
              fill="none" 
              stroke="url(#batterGrad)" 
              stroke-width="34" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              stroke-dasharray="1600"
              stroke-dashoffset="1600" 
              filter="url(#shadow)" />
      </g>

      <!-- GHEE DROPLETS &amp; SIZZLE SPARKS -->
      <g class="a e-sparks">
        <g class="i-spark">
          <!-- Ghee Drops -->
          <circle cx="-140" cy="-80" r="14" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
          <circle cx="180" cy="-60" r="10" fill="url(#gheeGrad)" />
          <circle cx="90" cy="190" r="16" fill="url(#gheeGrad)" filter="url(#glow-gold)" />
          <circle cx="-220" cy="110" r="11" fill="url(#gheeGrad)" />
          <circle cx="-30" cy="-240" r="13" fill="url(#gheeGrad)" />

          <!-- Spark Starbursts (Chili Red &amp; Gold Sizzle) -->
          <!-- Spark 1 -->
          <path d="M -140 -120 L -136 -100 L -116 -96 L -136 -92 L -140 -72 L -144 -92 L -164 -96 L -144 -100 Z" fill="#FFF8E7" />
          <!-- Spark 2 -->
          <path d="M 210 120 L 213 135 L 228 138 L 213 141 L 210 156 L 207 141 L 192 138 L 207 135 Z" fill="#F2A922" />
          <!-- Spark 3 -->
          <path d="M -180 200 L -177 210 L -167 213 L -177 216 L -180 226 L -183 216 L -193 213 L -183 210 Z" fill="#E74C3C" />

          <!-- Sizzle Ring Wavelet -->
          <circle cx="90" cy="190" r="28" fill="none" stroke="#F2A922" stroke-width="2.5" opacity="0.6" />
          <circle cx="-140" cy="-80" r="24" fill="none" stroke="#FFF" stroke-width="2" opacity="0.7" />
        </g>
      </g>

    </g> <!-- /Tawa Group -->

    <!-- THROUGH-LINE ELEMENT: GLOWING TURMERIC-GOLD STEAM RIBBON -->
    <!-- Starts from tawa center, spirals &amp; sweeps dynamically to right screen edge for Scene 2 transition -->
    <g class="a e-steam">
      <g class="i-bob">
        <!-- Outer Steam Glow Ribbon -->
        <path d="M 1120 580 
                 C 1020 480, 980 320, 1100 220 
                 C 1240 100, 1480 180, 1420 360 
                 C 1360 520, 1140 620, 1260 780 
                 C 1380 940, 1680 820, 1940 620" 
              fill="none" 
              stroke="url(#steamGrad)" 
              stroke-width="42" 
              stroke-linecap="round" 
              stroke-dasharray="2200" 
              stroke-dashoffset="2200"
              filter="url(#steam-glow)" 
              opacity="0.85" />

        <!-- Inner Core Steam Ribbon -->
        <path d="M 1120 580 
                 C 1020 480, 980 320, 1100 220 
                 C 1240 100, 1480 180, 1420 360 
                 C 1360 520, 1140 620, 1260 780 
                 C 1380 940, 1680 820, 1940 620" 
              fill="none" 
              stroke="#FFF8E7" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-dasharray="2200" 
              stroke-dashoffset="2200"
              opacity="0.9" />
      </g>
    </g>

    <!-- TYPOGRAPHY / ON-SCREEN TEXT (LEFT SIDE) -->
    <!-- Clean high-contrast layout, strictly obeying size constraints &amp; margins -->

    <!-- Headline: "Hear That Golden Sizzle?" (Entrance at t=0.5s) -->
    <g transform="translate(120, 420)">
      <g class="a e-head">
        <g class="i-bob">
          <!-- Dark Contrast Backing Card for Maximum Legibility -->
          <rect x="-30" y="-95" width="670" height="230" rx="20" fill="#0F2C2E" opacity="0.75" />
          
          <text font-family="'Poppins', Arial, sans-serif" font-size="88" font-weight="900" fill="#FFF8E7" x="0" y="0" filter="url(#shadow)">
            Hear That
          </text>
          <text font-family="'Poppins', Arial, sans-serif" font-size="88" font-weight="900" fill="#F2A922" x="0" y="100" filter="url(#glow-gold)">
            Golden Sizzle?
          </text>
        </g>
      </g>
    </g>

    <!-- Supporting Text: "Fresh off the blazing cast-iron tawa" (Entrance at t=1.98s) -->
    <g transform="translate(120, 660)">
      <g class="a e-supp">
        <!-- Sub-card background -->
        <rect x="-24" y="-42" width="680" height="72" rx="16" fill="#1A4346" opacity="0.85" stroke="#F2A922" stroke-width="1.5" />
        <text font-family="'Noto Sans', sans-serif" font-size="44" font-weight="700" fill="#FFF8E7" x="0" y="10">
          Fresh off the blazing cast-iron tawa
        </text>
      </g>
    </g>

    <!-- PERSISTENT UI ELEMENTS -->

    <!-- Top-Left Pill Badge ("The Dosa Corner") -->
    <g transform="translate(80, 52)">
      <g class="a e-pop">
        <rect x="0" y="0" width="320" height="64" rx="20" fill="#1A4346" stroke="#F2A922" stroke-width="2" filter="url(#shadow)" />
        
        <!-- Logo Icon: Mini Golden Dosa Cone -->
        <g transform="translate(24, 16)">
          <path d="M 4 28 L 28 4 L 32 24 Z" fill="#F2A922" />
          <path d="M 8 26 L 26 8" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" />
          <circle cx="28" cy="24" r="3" fill="#FFF8E7" />
        </g>

        <!-- Brand Name Text -->
        <text font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="800" fill="#F2A922" x="72" y="40" letter-spacing="0.5">
          THE DOSA CORNER
        </text>
      </g>
    </g>

    <!-- Bottom Progress Bar (Segment 1 of 7 Highlighted) -->
    <g transform="translate(0, 1066)">
      <!-- Full Track -->
      <rect x="0" y="0" width="1920" height="14" fill="#1A4346" />
      <!-- Active Segment 1 (1/7th width = ~274px) -->
      <rect x="0" y="0" width="274" height="14" rx="7" fill="#F2A922" filter="url(#glow-gold)" />
    </g>

  </g> <!-- /Camera Wrapper -->
</svg>