<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .a-bg { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a-card { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, float 4s ease-in-out 1.1s infinite; }
      .a-head { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .a-sub { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards; }
      .a-acc { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards; }
      .a-pulse { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards, pulseGlow 3s ease-in-out 2.0s infinite; }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

      .font-sans { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="s5-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <linearGradient id="s5-cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F2E" />
      <stop offset="100%" stop-color="#0D131D" />
    </linearGradient>

    <linearGradient id="s5-accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="s5-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="s5-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#s5-bgGrad)" />

  <g class="a a-bg">
    <!-- Visual Rhyme: Echo Slide 1 glowing circle setup -->
    <circle cx="540" cy="400" r="350" fill="#7000FF" opacity="0.15" filter="url(#s5-glow)" />
    <circle cx="540" cy="850" r="280" fill="#00F0FF" opacity="0.1" filter="url(#s5-glow)" />
    <path d="M 0,150 L 1080,150 M 0,300 L 1080,300 M 0,450 L 1080,450 M 0,600 L 1080,600 M 0,750 L 1080,750 M 0,900 L 1080,900 M 0,1050 L 1080,1050 M 0,1200 L 1080,1200" stroke="#1E293B" stroke-width="1" opacity="0.4" />
    <path d="M 150,0 L 150,1350 M 300,0 L 300,1350 M 450,0 L 450,1350 M 600,0 L 600,1350 M 750,0 L 750,1350 M 900,0 L 900,1350" stroke="#1E293B" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Header -->
  <g class="a a-acc">
    <rect x="80" y="75" width="36" height="36" rx="8" fill="url(#s5-accentGrad)" />
    <text x="130" y="102" class="font-sans" font-size="32" font-weight="800" fill="#F0F4F8" text-anchor="start">IncuBrix</text>
    <text x="1000" y="102" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="end">05 <tspan fill="#475569">/ 05</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g class="a a-acc">
    <rect x="80" y="180" width="310" height="48" rx="24" fill="#1E293B" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="235" y="212" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="middle">// START BUILDING</text>
  </g>

  <!-- Headline -->
  <g class="a a-head">
    <text x="80" y="320" class="font-sans" font-size="82" font-weight="800" fill="#F0F4F8" text-anchor="start">Launch your Creator Engine</text>
    <text x="80" y="415" class="font-sans" font-size="82" font-weight="800" fill="#00F0FF" text-anchor="start">this weekend.</text>
  </g>

  <!-- Subheadline -->
  <g class="a a-sub">
    <text x="80" y="500" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">Start your free 14-day trial today and scale</text>
    <text x="80" y="550" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">your affiliate pipeline in minutes.</text>
  </g>

  <!-- CTA Box / Offer Visual -->
  <g class="a a-card" filter="url(#s5-shadow)">
    <rect x="80" y="620" width="920" height="340" rx="16" fill="url(#s5-cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Big Action Button -->
    <rect x="140" y="680" width="800" height="96" rx="48" fill="url(#s5-accentGrad)" />
    <text x="540" y="742" class="font-sans" font-size="36" font-weight="800" fill="#05070A" text-anchor="middle">CLAIM FREE TRIAL NOW</text>

    <!-- Domain & Handle Links -->
    <text x="540" y="835" class="font-mono" font-size="36" font-weight="700" fill="#00F0FF" text-anchor="middle">incubrix.com</text>
    <text x="540" y="890" class="font-mono" font-size="28" font-weight="500" fill="#64748B" text-anchor="middle">@incubrix on X &amp; GitHub</text>
  </g>

  <!-- SEAMLESS CONNECTING DATA STREAM -->
  <!-- Enters Left at Y=980 (from S4) -> Smoothly Sinks & Settles at Center -->
  <g class="a a-pulse">
    <path d="M 0,980 C 200,980 350,1020 540,1020 C 730,1020 900,1000 1080,1000" fill="none" stroke="url(#s5-accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <circle cx="540" cy="1020" r="10" fill="#00F0FF" filter="url(#s5-glow)" />
  </g>
</svg>