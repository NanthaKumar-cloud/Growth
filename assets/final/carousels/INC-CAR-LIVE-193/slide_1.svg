<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .a-bg { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a-card { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, float 4s ease-in-out 1.1s infinite; }
      .a-head { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .a-sub { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards; }
      .a-acc { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards; }
      .a-pulse { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards, pulseGlow 3s ease-in-out 2.0s infinite; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      .font-sans { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="s1-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <linearGradient id="s1-cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F2E" />
      <stop offset="100%" stop-color="#0D131D" />
    </linearGradient>

    <linearGradient id="s1-accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="s1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="s1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1350" fill="url(#s1-bgGrad)" />
  <g class="a a-bg">
    <circle cx="540" cy="400" r="350" fill="#7000FF" opacity="0.12" filter="url(#s1-glow)" />
    <circle cx="200" cy="900" r="250" fill="#00F0FF" opacity="0.08" filter="url(#s1-glow)" />
    <!-- Grid pattern lines -->
    <path d="M 0,150 L 1080,150 M 0,300 L 1080,300 M 0,450 L 1080,450 M 0,600 L 1080,600 M 0,750 L 1080,750 M 0,900 L 1080,900 M 0,1050 L 1080,1050 M 0,1200 L 1080,1200" stroke="#1E293B" stroke-width="1" opacity="0.4" />
    <path d="M 150,0 L 150,1350 M 300,0 L 300,1350 M 450,0 L 450,1350 M 600,0 L 600,1350 M 750,0 L 750,1350 M 900,0 L 900,1350" stroke="#1E293B" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Navigation / Header -->
  <g class="a a-acc">
    <!-- Brand Mark -->
    <rect x="80" y="75" width="36" height="36" rx="8" fill="url(#s1-accentGrad)" />
    <text x="130" y="102" class="font-sans" font-size="32" font-weight="800" fill="#F0F4F8" text-anchor="start">IncuBrix</text>
    
    <!-- Page Progress Indicator -->
    <text x="1000" y="102" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="end">01 <tspan fill="#475569">/ 05</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g class="a a-acc">
    <rect x="80" y="180" width="340" height="48" rx="24" fill="#1E293B" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="250" y="212" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="middle">// CREATOR OPS SDK</text>
  </g>

  <!-- Headline -->
  <g class="a a-head">
    <text x="80" y="320" class="font-sans" font-size="82" font-weight="800" fill="#F0F4F8" text-anchor="start">Ship CreatorOps</text>
    <text x="80" y="415" class="font-sans" font-size="82" font-weight="800" fill="#00F0FF" text-anchor="start">in 1 weekend.</text>
  </g>

  <!-- Subheadline -->
  <g class="a a-sub">
    <text x="80" y="500" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">Stop building custom affiliate &amp; payout</text>
    <text x="80" y="550" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">dashboards from scratch.</text>
  </g>

  <!-- Hero Visual Component (IDE Terminal) -->
  <g class="a a-card" filter="url(#s1-shadow)">
    <!-- Terminal Box -->
    <rect x="80" y="620" width="920" height="340" rx="16" fill="url(#s1-cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="120" cy="660" r="7" fill="#EF4444" />
    <circle cx="145" cy="660" r="7" fill="#F59E0B" />
    <circle cx="170" cy="660" r="7" fill="#10B981" />
    <text x="540" y="666" class="font-mono" font-size="28" fill="#64748B" text-anchor="middle">App.tsx — IncuBrix Integration</text>

    <!-- Code Block Inside Terminal -->
    <text x="120" y="730" class="font-mono" font-size="32" fill="#F43F5E" text-anchor="start">import <tspan fill="#F0F4F8">{ IncuBrixEngine }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#10B981">'@incubrix/sdk'</tspan>;</text>

    <text x="120" y="800" class="font-mono" font-size="32" fill="#7000FF" font-weight="700" text-anchor="start">&lt;<tspan fill="#00F0FF">IncuBrixEngine</tspan></text>
    <text x="160" y="850" class="font-mono" font-size="32" fill="#38BDF8" text-anchor="start">apiKey=<tspan fill="#F59E0B">"bx_live_8f92a1"</tspan></text>
    <text x="160" y="900" class="font-mono" font-size="32" fill="#38BDF8" text-anchor="start">features=<tspan fill="#F0F4F8">{[</tspan><tspan fill="#10B981">'affiliates'</tspan><tspan fill="#F0F4F8">, </tspan><tspan fill="#10B981">'payouts'</tspan><tspan fill="#F0F4F8">]}</tspan> <tspan fill="#7000FF">/&gt;</tspan></text>
  </g>

  <!-- Swipe Prompt Bar -->
  <g class="a a-acc">
    <text x="80" y="1030" class="font-mono" font-size="28" font-weight="700" fill="#64748B" text-anchor="start">SWIPE FOR ARCHITECTURE</text>
    <path d="M 430,1020 L 460,1020 M 450,1010 L 460,1020 L 450,1030" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SEAMLESS CONNECTING DATA STREAM (Exits Slide 1 at Right: Y=1000) -->
  <g class="a a-pulse">
    <path d="M 800,1020 C 900,1020 980,1000 1080,1000" fill="none" stroke="url(#s1-accentGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="1040" cy="1005" r="8" fill="#00F0FF" filter="url(#s1-glow)" />
  </g>
</svg>