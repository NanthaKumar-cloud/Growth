<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .a-bg { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a-card { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, float 4s ease-in-out 1.1s infinite; }
      .a-head { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .a-sub { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards; }
      .a-acc { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards; }
      .a-pulse { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards, pulseGlow 3s ease-in-out 2.0s infinite; }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

      .font-sans { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="s3-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <linearGradient id="s3-cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F2E" />
      <stop offset="100%" stop-color="#0D131D" />
    </linearGradient>

    <linearGradient id="s3-accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="s3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="s3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#s3-bgGrad)" />

  <g class="a a-bg">
    <circle cx="540" cy="500" r="320" fill="#00F0FF" opacity="0.08" filter="url(#s3-glow)" />
    <path d="M 0,150 L 1080,150 M 0,300 L 1080,300 M 0,450 L 1080,450 M 0,600 L 1080,600 M 0,750 L 1080,750 M 0,900 L 1080,900 M 0,1050 L 1080,1050 M 0,1200 L 1080,1200" stroke="#1E293B" stroke-width="1" opacity="0.4" />
    <path d="M 150,0 L 150,1350 M 300,0 L 300,1350 M 450,0 L 450,1350 M 600,0 L 600,1350 M 750,0 L 750,1350 M 900,0 L 900,1350" stroke="#1E293B" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Header -->
  <g class="a a-acc">
    <rect x="80" y="75" width="36" height="36" rx="8" fill="url(#s3-accentGrad)" />
    <text x="130" y="102" class="font-sans" font-size="32" font-weight="800" fill="#F0F4F8" text-anchor="start">IncuBrix</text>
    <text x="1000" y="102" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="end">03 <tspan fill="#475569">/ 05</tspan></text>
  </g>

  <!-- Tag Pill -->
  <g class="a a-acc">
    <rect x="80" y="180" width="350" height="48" rx="24" fill="#1E293B" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="255" y="212" class="font-mono" font-size="28" font-weight="700" fill="#00F0FF" text-anchor="middle">// TURNKEY SOLUTION</text>
  </g>

  <!-- Headline -->
  <g class="a a-head">
    <text x="80" y="320" class="font-sans" font-size="82" font-weight="800" fill="#F0F4F8" text-anchor="start">Embed IncuBrix in</text>
    <text x="80" y="415" class="font-sans" font-size="82" font-weight="800" fill="#00F0FF" text-anchor="start">just 3 API calls.</text>
  </g>

  <!-- Subheadline -->
  <g class="a a-sub">
    <text x="80" y="500" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">Turnkey affiliate tracking, auto webhooks,</text>
    <text x="80" y="550" class="font-sans" font-size="36" font-weight="700" fill="#94A3B8" text-anchor="start">and instant automated payouts.</text>
  </g>

  <!-- API Code Card Visual -->
  <g class="a a-card" filter="url(#s3-shadow)">
    <rect x="80" y="620" width="920" height="340" rx="16" fill="url(#s3-cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Code step 1 -->
    <text x="120" y="690" class="font-mono" font-size="30" fill="#10B981" text-anchor="start">1. incubrix.init({ key: "bx_live_..." });</text>
    <text x="120" y="730" class="font-sans" font-size="28" fill="#64748B" text-anchor="start">   // Initializes affiliate tracker &amp; attribution engine</text>

    <!-- Code step 2 -->
    <text x="120" y="790" class="font-mono" font-size="30" fill="#00F0FF" text-anchor="start">2. incubrix.trackEvent("subscription_created");</text>
    <text x="120" y="830" class="font-sans" font-size="28" fill="#64748B" text-anchor="start">   // Calculates tiers &amp; fraud-proof commission splits</text>

    <!-- Code step 3 -->
    <text x="120" y="890" class="font-mono" font-size="30" fill="#7000FF" text-anchor="start">3. incubrix.payouts.triggerAuto();</text>
    <text x="120" y="930" class="font-sans" font-size="28" fill="#64748B" text-anchor="start">   // Dispatches Instant global payouts via Stripe/Wise</text>
  </g>

  <!-- Swipe Cue -->
  <g class="a a-acc">
    <text x="80" y="1030" class="font-mono" font-size="28" font-weight="700" fill="#64748B" text-anchor="start">SWIPE FOR BENCHMARKS</text>
    <path d="M 430,1020 L 460,1020 M 450,1010 L 460,1020 L 450,1030" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SEAMLESS CONNECTING DATA STREAM -->
  <!-- Starts Left at Y=1050 (from S2) -> Curves Up -> Exits Right at Y=950 -->
  <g class="a a-pulse">
    <path d="M 0,1050 C 200,1050 500,980 1080,950" fill="none" stroke="url(#s3-accentGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="500" cy="995" r="8" fill="#00F0FF" filter="url(#s3-glow)" />
  </g>
</svg>