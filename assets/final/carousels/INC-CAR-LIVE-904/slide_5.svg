<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
    
    .bg { fill: url(#bg-grad); }
    .card { fill: #111827; stroke: #00F0FF; stroke-width: 2; rx: 16px; }
    .text-title { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 80px; text-anchor: middle; }
    .text-gradient { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: url(#cyan-purple); font-size: 80px; text-anchor: middle; }
    .text-body { font-family: 'Inter', Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 36px; text-anchor: middle; }
    .text-brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #00F0FF; font-size: 28px; }
    .text-meta { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #64748B; font-size: 28px; }
    .text-swipe { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #00F0FF; font-size: 30px; letter-spacing: 2px; }

    .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
    .a1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
    .a2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .a3 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <rect width="1080" height="1350" class="bg"/>

  <!-- Top Navigation UI -->
  <g transform="translate(72, 80)">
    <rect width="260" height="48" rx="24" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="130" y="33" text-anchor="middle" class="text-brand">IncuBrix // Ops</text>
  </g>
  <text x="1008" y="113" text-anchor="end" class="text-meta">05 / 15</text>

  <!-- Title -->
  <g transform="translate(540, 260)">
    <g class="a a1">
      <text x="0" y="0" class="text-title">Meet IncuBrix:</text>
      <text x="0" y="95" class="text-gradient">CreatorOps Built For SaaS</text>
    </g>
  </g>

  <!-- Dashboard Preview Card Graphic -->
  <g transform="translate(140, 470)">
    <g class="a a3">
      <rect x="0" y="0" width="800" height="400" class="card" filter="url(#glow)"/>
      <!-- Header bar -->
      <rect x="0" y="0" width="800" height="60" fill="#161F33" rx="16"/>
      <circle cx="30" cy="30" r="8" fill="#FF3B00"/>
      <circle cx="55" cy="30" r="8" fill="#FFCC00"/>
      <circle cx="80" cy="30" r="8" fill="#28C740"/>
      <text x="400" y="38" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#64748B" text-anchor="middle">app.incubrix.com/dashboard</text>

      <!-- Dashboard Elements -->
      <g transform="translate(40, 90)">
        <rect x="0" y="0" width="220" height="110" rx="12" fill="#1F293D"/>
        <text x="20" y="40" font-family="'Inter', sans-serif" font-size="18" fill="#94A3B8">ACTIVE CREATORS</text>
        <text x="20" y="85" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="42" fill="#00F0FF">142</text>

        <rect x="250" y="0" width="220" height="110" rx="12" fill="#1F293D"/>
        <text x="270" y="40" font-family="'Inter', sans-serif" font-size="18" fill="#94A3B8">REVENUE ATTRIBUTED</text>
        <text x="270" y="85" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="42" fill="#FFFFFF">$84.2K</text>

        <rect x="500" y="0" width="220" height="110" rx="12" fill="#1F293D"/>
        <text x="520" y="40" font-family="'Inter', sans-serif" font-size="18" fill="#94A3B8">AUTO PAYOUTS</text>
        <text x="520" y="85" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="42" fill="#8B5CF6">100%</text>

        <!-- Wave Graph Preview -->
        <g transform="translate(0, 140)">
          <rect x="0" y="0" width="720" height="130" rx="12" fill="#161F33"/>
          <path d="M 20 100 Q 180 20, 360 80 T 700 30" fill="none" stroke="#00F0FF" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Body Text -->
  <g transform="translate(540, 980)">
    <g class="a a2">
      <text x="0" y="0" class="text-body">The developer-first platform designed specifically for SaaS founders</text>
      <text x="0" y="50" class="text-body">and growth engineering teams.</text>
    </g>
  </g>

  <!-- Seamless Seam Line (Enter y=850, Exit y=980) -->
  <path d="M 0 850 C 300 830, 700 1000, 1080 980" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>

  <!-- Swipe Cue -->
  <g transform="translate(540, 1220)">
    <text x="0" y="0" text-anchor="middle" class="text-swipe">EXPLORE FEATURE 1 &#x2192;</text>
  </g>
</svg>