<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
    
    .bg { fill: url(#bg-grad); }
    .card { fill: #111827; stroke: #1F293D; stroke-width: 2; rx: 16px; }
    .text-title { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 80px; text-anchor: middle; }
    .text-gradient { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: url(#cyan-purple); font-size: 80px; text-anchor: middle; }
    .text-body { font-family: 'Inter', Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 36px; text-anchor: middle; }
    .text-brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #00F0FF; font-size: 28px; }
    .text-meta { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #64748B; font-size: 28px; }
    .text-swipe { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #00F0FF; font-size: 30px; letter-spacing: 2px; }

    .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
    .a1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
    .a2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .a3 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <rect width="1080" height="1350" class="bg"/>

  <!-- Top Navigation UI -->
  <g transform="translate(72, 80)">
    <rect width="260" height="48" rx="24" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="130" y="33" text-anchor="middle" class="text-brand">IncuBrix // Ops</text>
  </g>
  <text x="1008" y="113" text-anchor="end" class="text-meta">08 / 15</text>

  <!-- Title -->
  <g transform="translate(540, 260)">
    <g class="a a1">
      <text x="0" y="0" class="text-title">Real-Time Attribution</text>
      <text x="0" y="95" class="text-gradient">SDK &amp; Webhooks</text>
    </g>
  </g>

  <!-- Terminal Code Graphic -->
  <g transform="translate(140, 480)">
    <g class="a a3">
      <rect x="0" y="0" width="800" height="380" class="card"/>
      <rect x="0" y="0" width="800" height="48" rx="16" fill="#161F33"/>
      <circle cx="25" cy="24" r="6" fill="#FF3B00"/>
      <circle cx="45" cy="24" r="6" fill="#FFCC00"/>
      <circle cx="65" cy="24" r="6" fill="#28C740"/>
      <text x="400" y="31" font-family="monospace" font-size="18" fill="#64748B" text-anchor="middle">incubrix-attribution.ts</text>

      <g transform="translate(40, 90)" font-family="monospace" font-size="22">
        <text x="0" y="30" fill="#8B5CF6">import <tspan fill="#FFFFFF">{ IncuBrix } </tspan><tspan fill="#8B5CF6">from</tspan><tspan fill="#00F0FF"> '@incubrix/sdk'</tspan>;</text>
        <text x="0" y="75" fill="#64748B">// Initialize real-time attribution event</text>
        <text x="0" y="120" fill="#00F0FF">await <tspan fill="#FFFFFF">IncuBrix.trackConversion({</tspan></text>
        <text x="30" y="160" fill="#FFFFFF">creatorId: <tspan fill="#00F0FF">'cr_9941a'</tspan>,</text>
        <text x="30" y="200" fill="#FFFFFF">revenue: <tspan fill="#8B5CF6">299.00</tspan>,</text>
        <text x="30" y="240" fill="#FFFFFF">plan: <tspan fill="#00F0FF">'enterprise_annual'</tspan></text>
        <text x="0" y="275" fill="#FFFFFF">});</text>
      </g>
    </g>
  </g>

  <!-- Body Text -->
  <g transform="translate(540, 960)">
    <g class="a a2">
      <text x="0" y="0" class="text-body">Track every lead, trial, and paid SaaS subscription with precise</text>
      <text x="0" y="50" class="text-body">server-side attribution tracking.</text>
    </g>
  </g>

  <!-- Seamless Seam Line (Enter y=860, Exit y=940) -->
  <path d="M 0 860 C 300 840, 700 960, 1080 940" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>

  <!-- Swipe Cue -->
  <g transform="translate(540, 1220)">
    <text x="0" y="0" text-anchor="middle" class="text-swipe">SEE TECH STACK INTEGRATION &#x2192;</text>
  </g>
</svg>