    display: flex;

    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #A5B4FC;
    background: rgba(99, 102, 241, 0.15);

    border-radius: 9999px;
    letter-spacing: 0.05em;
    text-transform: uppercase;

  .controls-bar {

    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: #1F2937;
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  button.active {
    background: var(--accent);

    border-color: var(--accent);
  }

    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 100%;
    overflow: visible;
  }

    width: 100%;
    max-width: 540px;
    aspect-ratio: 4 / 5;
    background: transparent;
    border-radius: 0;
    overflow: visible;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    transition: max-width 0.25s ease;
  }
  .viewport-card.native-size {
    max-width: 1080px;
    width: 1080px;
    height: 1350px;
  }
  .slide-stage {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: visible;
  }
  .slide-stage svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible !important;
  }
  /* Panoramic Seamless Mode - Unclipped */
  .panoramic-mode {
    display: none;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: visible;
    padding: 20px 0;
  }
  .panoramic-strip {
    display: flex;
    gap: 0;
    width: max-content;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    border-radius: 0;
    overflow: visible;
  }
  .panoramic-strip .pano-slide {
    width: 480px;
    height: 600px;
    flex-shrink: 0;
    overflow: visible;
    border-right: 1px dashed rgba(255,255,255,0.25);
  }
  .panoramic-strip .pano-slide svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible !important;
  }

    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }
  .dots-container {
    display: flex;
    gap: 8px;

    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #374151;
    cursor: pointer;

  .dot.active {

  <!-- Hero Holographic Cube Motif (Identical visual rhyme to Slide 1) -->
  <g transform="translate(540, 560)">
    <g class="a a1">
      <rect x="-110" y="-110" width="220" height="220" rx="24" fill="#111827" stroke="#00F0FF" stroke-width="3" filter="url(#glow)"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#8B5CF6" stroke-width="3"/>
      <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="2"/>
      <polygon points="0,0 52,30 0,60" fill="#8B5CF6" fill-opacity="0.4" stroke="#8B5CF6" stroke-width="2"/>
      <polygon points="-52,30 0,0 0,60" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Main CTA Interactive Button Card -->
  <g transform="translate(240, 780)">

      <rect x="0" y="0" width="600" height="110" rx="55" fill="url(#cyan-purple)" filter="url(#glow)"/>

  <g transform="translate(540, 970)">

  let currentIndex = 0;
  const stage = document.getElementById("slideStage");
  const roleLabel = document.getElementById("roleLabel");
  const dotsContainer = document.getElementById("dotsContainer");

  function init() {
    // Render dots
    dotsContainer.innerHTML = "";
    slidesData.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.onclick = () => goToSlide(i);
      dotsContainer.appendChild(d);
    });

    // Populate panoramic strip
    const panoStrip = document.getElementById("panoStrip");
    panoStrip.innerHTML = "";
    slidesData.forEach((s) => {
      const container = document.createElement("div");
      container.className = "pano-slide";
      container.innerHTML = s.svg;
      panoStrip.appendChild(container);
    });

    renderSlide(0);
  }

  function renderSlide(index) {
    currentIndex = index;
    const slide = slidesData[index];
    // Re-inject HTML to re-trigger CSS keyframe animations fresh
    stage.innerHTML = slide.svg;
    roleLabel.textContent = `Slide ${slide.index} of ${slidesData.length} - ${slide.role}`;

    document.querySelectorAll(".dot").forEach((d, i) => {
      d.className = "dot" + (i === index ? " active" : "");
    });

    document.getElementById("prevBtn").disabled = index === 0;
    document.getElementById("nextBtn").disabled = index === slidesData.length - 1;
  }

  function nextSlide() {
    if (currentIndex < slidesData.length - 1) {
      renderSlide(currentIndex + 1);
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      renderSlide(currentIndex - 1);
    }
  }

  function goToSlide(index) {
    renderSlide(index);
  }

  function replayCurrentSlide() {
    renderSlide(currentIndex);
  }

  let panoActive = false;
  function togglePanoramicView() {
    panoActive = !panoActive;
    const single = document.getElementById("singleStageView");
    const pano = document.getElementById("panoramicView");
    const btn = document.getElementById("togglePanoBtn");

    if (panoActive) {
      single.style.display = "none";
      pano.style.display = "block";
      btn.classList.add("active");
    } else {
      single.style.display = "flex";
      pano.style.display = "none";
      btn.classList.remove("active");
    }
  }

  let isNative = false;
  function toggleNativeScale() {
    isNative = !isNative;
    const card = document.querySelector(".viewport-card");
    const btn = document.getElementById("toggleNativeBtn");
    if (isNative) {
      card.classList.add("native-size");
      btn.classList.add("active");
      btn.innerHTML = "&#x2922; Fit Scale";
    } else {
      card.classList.remove("native-size");
      btn.classList.remove("active");
      btn.innerHTML = "&#x2921; 100% Native (1080&times;1350)";
    }
  }

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextSlide();
    if (e.key === "ArrowLeft") prevSlide();
    if (e.key === "r" || e.key === "R") replayCurrentSlide();
  });

  init();
</script>
</body>
</html>
