<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="alert-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
    
    .bg { fill: url(#bg-grad); }
    .card { fill: #111827; stroke: #1F293D; stroke-width: 2; rx: 16px; }
    .card-alert { fill: #111827; stroke: #FF453A; stroke-width: 2; rx: 16px; }
    .text-title { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 80px; text-anchor: middle; }
    .text-alert { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #FF453A; font-size: 80px; text-anchor: middle; }
    .text-body { font-family: 'Inter', Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 36px; text-anchor: middle; }
    .text-brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #00F0FF; font-size: 28px; }
    .text-meta { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #64748B; font-size: 28px; }
    .text-swipe { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #00F0FF; font-size: 30px; letter-spacing: 2px; }

    .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
    .a1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
    .a2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .a3 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <rect width="1080" height="1350" class="bg"/>

  <!-- Top Navigation UI -->
  <g transform="translate(72, 80)">
    <rect width="260" height="48" rx="24" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="130" y="33" text-anchor="middle" class="text-brand">IncuBrix // Ops</text>
  </g>
  <text x="1008" y="113" text-anchor="end" class="text-meta">02 / 15</text>

  <!-- Title -->
  <g transform="translate(540, 260)">
    <g class="a a1">
      <text x="0" y="0" class="text-title">Manual Creator Ops</text>
      <text x="0" y="95" class="text-alert">Kills SaaS Velocity</text>
    </g>
  </g>

  <!-- Content Graphic: Fragmented Operational Chaos Card -->
  <g transform="translate(140, 480)">
    <g class="a a3">
      <rect x="0" y="0" width="800" height="380" class="card-alert" filter="url(#alert-glow)"/>
      <g transform="translate(40, 50)">
        <circle cx="30" cy="30" r="24" fill="#FF453A" fill-opacity="0.2"/>
        <path d="M 30 18 L 30 34 M 30 42 L 30 44" stroke="#FF453A" stroke-width="4" stroke-linecap="round"/>
        <text x="80" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" fill="#FFFFFF" font-size="32">OPERATIONAL BOTTLENECK DETECTED</text>
      </g>
      <!-- Scattered nodes -->
      <g transform="translate(80, 160)">
        <rect x="0" y="0" width="180" height="80" rx="12" fill="#1F293D" stroke="#FF453A" stroke-width="1.5"/>
        <text x="90" y="48" font-family="'Inter', sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">Spreadsheets</text>
        
        <path d="M 180 40 L 260 40" stroke="#FF453A" stroke-width="2" stroke-dasharray="4 4"/>
        
        <rect x="260" y="0" width="180" height="80" rx="12" fill="#1F293D" stroke="#FF453A" stroke-width="1.5"/>
        <text x="350" y="48" font-family="'Inter', sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">Manual Payouts</text>

        <path d="M 440 40 L 520 40" stroke="#FF453A" stroke-width="2" stroke-dasharray="4 4"/>

        <rect x="520" y="0" width="180" height="80" rx="12" fill="#1F293D" stroke="#FF453A" stroke-width="1.5"/>
        <text x="610" y="48" font-family="'Inter', sans-serif" font-size="22" fill="#FF453A" text-anchor="middle">Lost Attribution</text>
      </g>
      <text x="400" y="320" font-family="'Inter', sans-serif" font-size="26" fill="#64748B" text-anchor="middle">High operational friction prevents scaling creator partnerships</text>
    </g>
  </g>

  <!-- Body Text -->
  <g transform="translate(540, 960)">
    <g class="a a2">
      <text x="0" y="0" class="text-body">Engineers build custom internal tools instead of core features.</text>
      <text x="0" y="50" class="text-body">Growth engineering gets blocked by manual administration.</text>
    </g>
  </g>

  <!-- Seamless Seam Line (Enter y=950, Exit y=880) -->
  <path d="M 0 950 C 300 920, 700 900, 1080 880" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>

  <!-- Swipe Cue -->
  <g transform="translate(540, 1220)">
    <text x="0" y="0" text-anchor="middle" class="text-swipe">SWIPE TO SEE COST BREAKDOWN &#x2192;</text>
  </g>
</svg>