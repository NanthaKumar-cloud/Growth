<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
    
    .bg { fill: url(#bg-grad); }
    .text-title { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 82px; text-anchor: middle; }
    .text-gradient { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: url(#cyan-purple); font-size: 82px; text-anchor: middle; }
    .text-body { font-family: 'Inter', Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 36px; text-anchor: middle; }
    .text-brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #00F0FF; font-size: 28px; }
    .text-meta { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; fill: #64748B; font-size: 28px; }
    .text-button { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #0A0E17; font-size: 36px; text-anchor: middle; }
    .text-url { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; fill: #00F0FF; font-size: 32px; text-anchor: middle; letter-spacing: 1px; }

    .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
    .a1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
    .a2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .a3 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards, pulse 3s ease-in-out 1.4s infinite; }
    .a4 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <rect width="1080" height="1350" class="bg"/>

  <!-- Top Navigation UI -->
  <g transform="translate(72, 80)">
    <rect width="260" height="48" rx="24" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="130" y="33" text-anchor="middle" class="text-brand">IncuBrix // Ops</text>
  </g>
  <text x="1008" y="113" text-anchor="end" class="text-meta">15 / 15</text>

  <!-- Title (Visual Rhyme with Slide 1) -->
  <g transform="translate(540, 250)">
    <g class="a a1">
      <text x="0" y="0" class="text-title">Try IncuBrix Free</text>
      <text x="0" y="95" class="text-gradient">This Weekend</text>
    </g>
  </g>

  <!-- Hero Holographic Cube Motif (Identical visual rhyme to Slide 1) -->
  <g transform="translate(540, 560)">
    <g class="a a1">
      <rect x="-110" y="-110" width="220" height="220" rx="24" fill="#111827" stroke="#00F0FF" stroke-width="3" filter="url(#glow)"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#8B5CF6" stroke-width="3"/>
      <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="2"/>
      <polygon points="0,0 52,30 0,60" fill="#8B5CF6" fill-opacity="0.4" stroke="#8B5CF6" stroke-width="2"/>
      <polygon points="-52,30 0,0 0,60" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#00F0FF" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Main CTA Interactive Button Card -->
  <g transform="translate(240, 780)">
    <g class="a a3">
      <rect x="0" y="0" width="600" height="110" rx="55" fill="url(#cyan-purple)" filter="url(#glow)"/>
      <text x="300" y="68" class="text-button">START FREE TRIAL &#x2192;</text>
    </g>
  </g>

  <!-- Supporting Text -->
  <g transform="translate(540, 970)">
    <g class="a a2">
      <text x="0" y="0" class="text-body">Start your trial at incubrix.com and build your</text>
      <text x="0" y="50" class="text-body">high-converting SaaS creator engine today.</text>
    </g>
  </g>

  <!-- Terminal Wire Continuation ending gracefully -->
  <path d="M 0 950 C 300 930, 600 950, 800 950" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>

  <!-- Footer Info -->
  <g transform="translate(540, 1180)">
    <g class="a a4">
      <text x="0" y="0" class="text-url">incubrix.com</text>
      <text x="0" y="45" font-family="'Inter', sans-serif" font-size="24" fill="#64748B" text-anchor="middle">@incubrix // Developer-First CreatorOps</text>
    </g>
  </g>
</svg>