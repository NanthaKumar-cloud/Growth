<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');
      
      .bg { fill: #07090E; }
      .grid-line { stroke: #1A2333; stroke-width: 1; opacity: 0.5; }
      
      .brand-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; fill: #00F0FF; letter-spacing: 2px; }
      .ui-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; fill: #8A99AD; }
      .headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 88px; fill: #FFFFFF; line-height: 1.05; }
      .headline-accent { fill: url(#neon-grad); }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 38px; fill: #8A99AD; line-height: 1.4; }
      
      .cta-card { fill: #0D1320; stroke: #1F2D44; stroke-width: 2; rx: 16px; }
      .badge-bg { fill: rgba(0, 240, 255, 0.1); stroke: #00F0FF; stroke-width: 1.5; rx: 30px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; fill: #00F0FF; letter-spacing: 1px; }

      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      
      .a-bg { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards; }
      .a-h1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
      .a-sub { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
      .a-card { animation: scaleUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards, pulseCard 4s ease-in-out 1.6s infinite; }
      .a-ui { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes pulseCard {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.01); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg a a-bg" width="1080" height="1350" />

  <!-- Grid lines -->
  <g class="a a-bg">
    <line x1="0" y1="225" x2="1080" y2="225" class="grid-line" />
    <line x1="0" y1="450" x2="1080" y2="450" class="grid-line" />
    <line x1="0" y1="675" x2="1080" y2="675" class="grid-line" />
    <line x1="0" y1="900" x2="1080" y2="900" class="grid-line" />
    <line x1="0" y1="1125" x2="1080" y2="1125" class="grid-line" />
    <line x1="216" y1="0" x2="216" y2="1350" class="grid-line" />
    <line x1="540" y1="0" x2="540" y2="1350" class="grid-line" />
    <line x1="864" y1="0" x2="864" y2="1350" class="grid-line" />
  </g>

  <!-- Seam-crossing visual element: Left edge continuation -->
  <path d="M 0 1200 C 5 1250 10 1280 10 1320 L 10 1350 L 0 1350 Z" fill="url(#neon-grad)" class="a a-bg" opacity="0.5" />

  <!-- Persistent UI -->
  <g class="a a-ui">
    <text x="80" y="95" class="brand-text">INCLUBRIX</text>
    <text x="940" y="95" text-anchor="end" class="ui-text">05 / 05</text>
  </g>

  <!-- Badge -->
  <g class="a a-h1">
    <rect x="80" y="160" width="310" height="52" class="badge-bg" />
    <text x="235" y="193" text-anchor="middle" class="badge-text">FREE TRIAL ACTIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="295" class="a a-h1 headline">Reclaim your next</text>
  <text x="80" y="395" class="a a-h1 headline"><tspan class="headline-accent">weekend now.</tspan></text>

  <!-- Supporting Text -->
  <text x="80" y="490" class="a a-sub body-text">Deploy your first autonomous pipeline in 2 minutes.</text>
  <text x="80" y="540" class="a a-sub body-text">No credit card required. Full enterprise access.</text>

  <!-- Central CTA Card -->
  <g class="a a-card">
    <rect x="80" y="620" width="920" height="520" class="cta-card" filter="url(#glow)" />
    
    <!-- Inner glowing decorative element -->
    <circle cx="540" cy="780" r="120" fill="url(#neon-grad)" opacity="0.15" filter="url(#neon-glow)" />

    <text x="540" y="740" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF">Start Your Free Trial</text>
    <text x="540" y="795" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="24" fill="#00F0FF">incubrix.com</text>

    <!-- Big Button -->
    <g transform="translate(240, 860)" filter="url(#neon-glow)">
      <rect x="0" y="0" width="600" height="90" rx="45" fill="url(#neon-grad)" />
      <text x="300" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="26" fill="#07090E">CLAIM FREE TRIAL ></text>
    </g>

    <text x="540" y="1030" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="20" fill="#8A99AD">@incubrix | B2B SaaS CreatorOps Platform</text>
  </g>
</svg>