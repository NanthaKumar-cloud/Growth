<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');
      
      .bg { fill: #07090E; }
      .grid-line { stroke: #1A2333; stroke-width: 1; opacity: 0.5; }
      
      .brand-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; fill: #00F0FF; letter-spacing: 2px; }
      .ui-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; fill: #8A99AD; }
      .headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 82px; fill: #FFFFFF; line-height: 1.08; }
      .headline-accent { fill: #10B981; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 38px; fill: #8A99AD; line-height: 1.4; }
      
      .proof-card { fill: #0D1320; stroke: #1F2D44; stroke-width: 2; rx: 16px; }
      .swipe-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; fill: #00F0FF; letter-spacing: 2px; }

      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      
      .a-bg { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards; }
      .a-h1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
      .a-sub { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
      .a-proof { animation: scaleUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
      .a-ui { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg a a-bg" width="1080" height="1350" />

  <!-- Grid lines -->
  <g class="a a-bg">
    <line x1="0" y1="225" x2="1080" y2="225" class="grid-line" />
    <line x1="0" y1="450" x2="1080" y2="450" class="grid-line" />
    <line x1="0" y1="675" x2="1080" y2="675" class="grid-line" />
    <line x1="0" y1="900" x2="1080" y2="900" class="grid-line" />
    <line x1="0" y1="1125" x2="1080" y2="1125" class="grid-line" />
    <line x1="216" y1="0" x2="216" y2="1350" class="grid-line" />
    <line x1="540" y1="0" x2="540" y2="1350" class="grid-line" />
    <line x1="864" y1="0" x2="864" y2="1350" class="grid-line" />
  </g>

  <!-- Seam-crossing visual element: Left edge continuation -->
  <path d="M 0 1200 C 5 1250 10 1280 10 1320 L 10 1350 L 0 1350 Z" fill="url(#neon-grad)" class="a a-bg" opacity="0.5" />

  <!-- Persistent UI -->
  <g class="a a-ui">
    <text x="80" y="95" class="brand-text">INCLUBRIX</text>
    <text x="940" y="95" text-anchor="end" class="ui-text">04 / 05</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="195" class="a a-h1 headline">Engineers love our</text>
  <text x="80" y="295" class="a a-h1 headline"><tspan class="headline-accent">weekend results.</tspan></text>

  <!-- Supporting Text -->
  <text x="80" y="390" class="a a-sub body-text">See what B2B SaaS founders are saying</text>
  <text x="80" y="440" class="a a-sub body-text">after switching to automated CreatorOps.</text>

  <!-- Proof Cards -->
  <g class="a a-proof">
    <!-- Testimonial 1 -->
    <rect x="80" y="520" width="920" height="260" class="proof-card" filter="url(#glow)" />
    <text x="130" y="590" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#00F0FF">"We saved 12 engineering hours this weekend alone."</text>
    <text x="130" y="640" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#8A99AD" width="820">"IncuBrix automated our deployment pipelines seamlessly. Zero downtime,</text>
    <text x="130" y="675" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#8A99AD">zero alerts, and absolute peace of mind."</text>
    <text x="130" y="735" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#FFFFFF">Alex Rivera — CTO @ DataFlow SaaS</text>

    <!-- Testimonial 2 / Metric Highlight -->
    <rect x="80" y="810" width="920" height="280" class="proof-card" filter="url(#glow)" />
    <text x="130" y="885" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="54" fill="#10B981">99.99%</text>
    <text x="350" y="865" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">Uptime during peak traffic surges</text>
    <text x="350" y="905" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#8A99AD">Our automated load balancing scales instantly without manual intervention.</text>
    
    <line x1="130" y1="940" x2="950" y2="940" stroke="#1F2D44" stroke-width="2" />
    <text x="130" y="990" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="18" fill="#8A99AD">> Verified benchmark from 450+ SaaS deployment pipelines</text>
  </g>

  <!-- Seam-crossing visual element: Right edge connector gradient bar -->
  <path d="M 1070 1200 C 1075 1250 1080 1280 1080 1320 L 1080 1350 L 1070 1350 Z" fill="url(#neon-grad)" class="a a-bg" />

  <!-- Swipe Cue -->
  <g class="a a-sub">
    <text x="920" y="1285" text-anchor="end" class="swipe-text">SWIPE</text>
    <path d="M 945 1277 L 970 1277 M 955 1267 L 970 1277 L 955 1287" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>