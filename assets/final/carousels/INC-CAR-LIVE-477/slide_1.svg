<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');
      
      .bg { fill: #07090E; }
      .grid-line { stroke: #1A2333; stroke-width: 1; opacity: 0.5; }
      
      .brand-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; fill: #00F0FF; letter-spacing: 2px; }
      .ui-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; fill: #8A99AD; }
      .headline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 88px; fill: #FFFFFF; line-height: 1.05; }
      .headline-accent { fill: url(#neon-grad); }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 38px; fill: #8A99AD; line-height: 1.4; }
      
      .code-bg { fill: #0D1320; stroke: #1F2D44; stroke-width: 2; rx: 16px; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #38BDF8; }
      .code-keyword { fill: #FF007A; }
      .code-string { fill: #10B981; }

      .badge-bg { fill: rgba(0, 240, 255, 0.1); stroke: #00F0FF; stroke-width: 1.5; rx: 30px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; fill: #00F0FF; letter-spacing: 1px; }

      .swipe-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; fill: #00F0FF; letter-spacing: 2px; }

      /* Animation base */
      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      
      .a-bg { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards; }
      .a-h1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
      .a-sub { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
      .a-card { animation: scaleUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards, floatCard 6s ease-in-out 1.6s infinite; }
      .a-ui { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131C2E" />
      <stop offset="100%" stop-color="#0A0F1A" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg a a-bg" width="1080" height="1350" />

  <!-- Grid pattern lines -->
  <g class="a a-bg">
    <line x1="0" y1="225" x2="1080" y2="225" class="grid-line" />
    <line x1="0" y1="450" x2="1080" y2="450" class="grid-line" />
    <line x1="0" y1="675" x2="1080" y2="675" class="grid-line" />
    <line x1="0" y1="900" x2="1080" y2="900" class="grid-line" />
    <line x1="0" y1="1125" x2="1080" y2="1125" class="grid-line" />
    <line x1="216" y1="0" x2="216" y2="1350" class="grid-line" />
    <line x1="540" y1="0" x2="540" y2="1350" class="grid-line" />
    <line x1="864" y1="0" x2="864" y2="1350" class="grid-line" />
  </g>

  <!-- Persistent UI (Top Bar) -->
  <g class="a a-ui">
    <text x="80" y="95" class="brand-text">INCLUBRIX</text>
    <text x="940" y="95" text-anchor="end" class="ui-text">01 / 05</text>
  </g>

  <!-- Badge -->
  <g class="a a-h1">
    <rect x="80" y="160" width="280" height="52" class="badge-bg" />
    <text x="220" y="193" text-anchor="middle" class="badge-text">CREATOR OPS OS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="295" class="a a-h1 headline">Stop wasting weekends</text>
  <text x="80" y="395" class="a a-h1 headline">on <tspan class="headline-accent">CreatorOps.</tspan></text>

  <!-- Supporting Text -->
  <text x="80" y="490" class="a a-sub body-text">Automate your B2B SaaS deployment pipelines</text>
  <text x="80" y="540" class="a a-sub body-text">and scaling infrastructure instantly.</text>

  <!-- Central Technical Code Card -->
  <g class="a a-card">
    <rect x="80" y="620" width="920" height="520" class="code-bg" filter="url(#glow)" />
    
    <!-- Window controls -->
    <circle cx="130" cy="670" r="8" fill="#FF5F56" />
    <circle cx="155" cy="670" r="8" fill="#FFBD2E" />
    <circle cx="180" cy="670" r="8" fill="#27C93F" />
    <text x="540" y="678" text-anchor="middle" class="code-text" fill="#8A99AD" font-size="16">deploy_cluster.yml</text>
    <line x1="80" y1="710" x2="1000" y2="710" stroke="#1F2D44" stroke-width="2" />

    <!-- Code Content -->
    <text x="130" y="770" class="code-text"><tspan class="code-keyword">pipeline:</tspan> weekend_growth</text>
    <text x="130" y="820" class="code-text">  <tspan class="code-keyword">trigger:</tspan> <tspan class="code-string">"instant_scale"</tspan></text>
    <text x="130" y="870" class="code-text">  <tspan class="code-keyword">nodes:</tspan> 500</text>
    <text x="130" y="920" class="code-text">  <tspan class="code-keyword">infrastructure:</tspan> automated</text>
    <text x="130" y="970" class="code-text">  <tspan class="code-keyword">status:</tspan> <tspan style="fill: #00F0FF;">READY_TO_DEPLOY</tspan></text>

    <g transform="translate(700, 1020)" filter="url(#neon-glow)">
      <rect x="0" y="0" width="220" height="60" rx="30" fill="url(#neon-grad)" />
      <text x="110" y="37" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#07090E">INITIALIZE ></text>
    </g>
  </g>

  <!-- Seam-crossing visual element: Right edge connector gradient bar -->
  <path d="M 1070 1200 C 1075 1250 1080 1280 1080 1320 L 1080 1350 L 1070 1350 Z" fill="url(#neon-grad)" class="a a-bg" />

  <!-- Swipe Cue -->
  <g class="a a-sub">
    <text x="920" y="1285" text-anchor="end" class="swipe-text">SWIPE</text>
    <path d="M 945 1277 L 970 1277 M 955 1267 L 970 1277 L 955 1287" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>