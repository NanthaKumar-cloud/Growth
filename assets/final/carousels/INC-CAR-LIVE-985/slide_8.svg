<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
<defs>
    <filter id="glow">
        <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00D3DD" flood-opacity="0.8"/>
    </filter>
    <filter id="neonGlow">
        <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#39FF14" flood-opacity="0.9"/>
    </filter>
</defs>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap');
    .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
    .a1 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards; }
    .a2 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s forwards; }
    .a3 { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.1s forwards; }
    .a4 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards; }
    .a5 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.4s forwards; }
    .a6 { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.7s forwards; }
    .a7 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.0s forwards; }
    .a8 { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.3s forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite alternate; }
    .bob { animation: bob 3s ease-in-out infinite alternate; }
    .shimmer { animation: shimmer 4s linear infinite; }
    .flow { animation: flow 8s linear infinite; }
    .flow-reverse { animation: flow-reverse 8s linear infinite; }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.02); }
    }
    @keyframes bob {
        from { transform: translateY(-5px); }
        to { transform: translateY(5px); }
    }
    @keyframes shimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
    }
    @keyframes flow {
        from { transform: translateX(0); }
        to { transform: translateX(-1080px); }
    }
    @keyframes flow-reverse {
        from { transform: translateX(-1080px); }
        to { transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
        .pulse, .bob, .shimmer, .flow, .flow-reverse { animation: none !important; }
    }
</style>

<rect x="0" y="0" width="1080" height="1350" fill="#1A1A2E"/>

<!-- Persistent UI: Brand Mark -->
<g class="a a4">
    <text x="100" y="70" font-family="'Orbitron', sans-serif" font-size="36" fill="#00D3DD" text-anchor="start">IncuBrix</text>
</g>

<!-- Persistent UI: Progress Indicator -->
<g class="a a4">
    <text x="980" y="70" font-family="'Inter', sans-serif" font-size="32" fill="#E0E0E0" text-anchor="end">8 / 10</text>
</g>

<!-- Seam Element: Bottom Data Stream -->
<g transform="translate(-7560,0)">
    <path d="M 0 1100 C 150 1080 300 1120 450 1100 C 600 1080 750 1120 900 1100 C 1050 1080 1200 1120 1350 1100 C 1500 1080 1650 1120 1800 1100 C 1950 1080 2100 1120 2250 1100 C 2400 1080 2550 1120 2700 1100 C 2850 1080 3000 1120 3150 1100 C 3300 1080 3450 1120 3600 1100 C 3750 1080 3900 1120 4050 1100 C 4200 1080 4350 1120 4500 1100 C 4650 1080 4800 1120 4950 1100 C 5100 1080 5250 1120 5400 1100 C 5550 1080 5700 1120 5850 1100 C 6000 1080 6150 1120 6300 1100 C 6450 1080 6600 1120 6750 1100 C 6900 1080 7050 1120 7200 1100 C 7350 1080 7500 1120 7650 1100 C 7800 1080 7950 1120 8100 1100 C 8250 1080 8400 1120 8550 1100 C 8700 1080 8850 1120 9000 1100 C 9150 1080 9300 1120 9450 1100 C 9600 1080 9750 1120 9900 1100 C 10050 1080 10200 1120 10350 1100 C 10500 1080 10650 1120 10800 1100"
          fill="none" stroke="#00D3DD" stroke-width="4" filter="url(#glow)"/>
</g>

<!-- Main content -->
<g class="a a1">
    <text x="540" y="470" font-family="'Orbitron', sans-serif" font-size="90" fill="#E0E0E0" text-anchor="middle">
        SaaS Founders Trust
    </text>
</g>
<g class="a a2">
    <text x="540" y="570" font-family="'Orbitron', sans-serif" font-size="90" fill="#00D3DD" text-anchor="middle">
        IncuBrix.
    </text>
</g>
<g class="a a5">
    <rect x="180" y="700" width="720" height="250" rx="12" ry="12" fill="#0A1128" stroke="#00D3DD" stroke-width="2" filter="url(#glow)"/>
</g>
<g class="a a6">
    <text x="540" y="780" font-family="'Inter', sans-serif" font-size="44" fill="#E0E0E0" text-anchor="middle">
        "We shipped more, with less stress and
    </text>
    <text x="540" y="830" font-family="'Inter', sans-serif" font-size="44" fill="#E0E0E0" text-anchor="middle">
        zero weekend interruptions."
    </text>
    <text x="540" y="900" font-family="'Inter', sans-serif" font-size="36" fill="#39FF14" text-anchor="middle" font-weight="700">
        — CEO, TechCorp
    </text>
</g>

<!-- Swipe Indicator -->
<g class="a a3">
    <path d="M 970 1280 L 990 1260 L 970 1240 Z" fill="#E0E0E0" opacity="0.8"/>
</g>

</svg>