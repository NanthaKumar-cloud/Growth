<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

      * { box-sizing: border-box; }
      text { font-family: 'Inter', Arial, sans-serif; }
      .title-text { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }

      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      .a1 { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a2 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
      .a3 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
      .a4 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards, float 4s ease-in-out 1.8s infinite; }
      .a5 { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards; }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scaleUp { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#131B2A"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- Grid Tech Lines Overlay -->
  <g opacity="0.05">
    <line x1="0" y1="270" x2="1080" y2="270" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="540" x2="1080" y2="540" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="810" x2="1080" y2="810" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="1080" x2="1080" y2="1080" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Continuous Seam Flow Path (Enters left at y=910, exits right at y=950) -->
  <path d="M 0,910 C 300,980 700,880 1080,950" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.6" filter="url(#glow)"/>
  <path d="M 0,910 C 300,980 700,880 1080,950" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Top Navigation / Persistent UI -->
  <g class="a a1">
    <text x="72" y="100" fill="#F59E0B" font-size="24" font-weight="700" letter-spacing="2">SULLAN MADHAN x INCUBRIX</text>
    <rect x="912" y="72" width="96" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="960" y="98" fill="#94A3B8" font-size="22" font-weight="600" text-anchor="middle">4 / 5</text>
  </g>

  <!-- Main Title Block -->
  <g class="a a2">
    <text x="540" y="240" fill="#FFFFFF" font-size="80" class="title-text" text-anchor="middle">99.9% Uptime and 10x</text>
    <text x="540" y="335" fill="url(#goldGrad)" font-size="80" class="title-text" text-anchor="middle" filter="url(#glow)">Crisp Conversion</text>
  </g>

  <!-- Subtitle -->
  <g class="a a3">
    <text x="540" y="420" fill="#94A3B8" font-size="34" font-weight="400" text-anchor="middle">Sullan Madhan’s methodology gives SaaS teams battle-tested velocity.</text>
  </g>

  <!-- Metrics Dashboard Card -->
  <g class="a a4">
    <rect x="140" y="490" width="800" height="490" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

    <!-- Left Metric: Growth Chart -->
    <g transform="translate(180, 530)">
      <rect x="0" y="0" width="340" height="200" rx="16" fill="#0B0F17" stroke="#10B981" stroke-width="1"/>
      <text x="24" y="40" fill="#64748B" font-size="20">THROUGHPUT_GAIN</text>
      <text x="24" y="105" fill="#10B981" font-size="60" font-weight="700">+320%</text>
      <path d="M 240,150 L 270,110 L 290,130 L 320,80" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Right Metric: Ping Gauge -->
    <g transform="translate(560, 530)">
      <rect x="0" y="0" width="340" height="200" rx="16" fill="#0B0F17" stroke="#F59E0B" stroke-width="1"/>
      <text x="24" y="40" fill="#64748B" font-size="20">AVG_SERVE_LATENCY</text>
      <text x="24" y="105" fill="#F59E0B" font-size="60" font-weight="700">12ms</text>
      <text x="24" y="160" fill="#94A3B8" font-size="20">Zero stutter under heavy traffic</text>
    </g>

    <!-- Bottom Testimonial / Proof Quote -->
    <g transform="translate(180, 760)">
      <rect x="0" y="0" width="720" height="180" rx="16" fill="#0B0F17" stroke="#334155" stroke-width="1"/>
      <circle cx="60" cy="60" r="28" fill="#F59E0B"/>
      <text x="60" y="68" fill="#0B0F17" font-size="26" font-weight="700" text-anchor="middle">SM</text>
      <text x="110" y="55" fill="#FFFFFF" font-size="24" font-weight="600">Sullan Madhan Engineering Review</text>
      <text x="110" y="85" fill="#10B981" font-size="20">Verified Growth Architecture</text>
      <text x="30" y="135" fill="#94A3B8" font-size="22" font-style="italic">"Treating pipeline latency like cold tawa surface completely transformed our conversion stats."</text>
    </g>
  </g>

  <!-- Bottom Swipe Bar Callout -->
  <g class="a a5">
    <rect x="360" y="1120" width="360" height="64" rx="32" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="520" y="1160" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">Claim Free Access</text>
    <path d="M 640,1152 L 652,1152 L 646,1146 M 652,1152 L 646,1158" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Footer -->
  <text x="540" y="1280" fill="#64748B" font-size="24" text-anchor="middle">incubrix.com • Sullan Madhan Masterclass</text>
</svg>