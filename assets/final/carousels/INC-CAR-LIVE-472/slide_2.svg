<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

      * { box-sizing: border-box; }
      text { font-family: 'Inter', Arial, sans-serif; }
      .title-text { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }

      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      .a1 { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a2 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
      .a3 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
      .a4 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards, float 4s ease-in-out 1.8s infinite; }
      .a5 { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards; }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scaleUp { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#131B2A"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- Grid Tech Lines Overlay -->
  <g opacity="0.05">
    <line x1="0" y1="270" x2="1080" y2="270" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="540" x2="1080" y2="540" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="810" x2="1080" y2="810" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="1080" x2="1080" y2="1080" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Continuous Seam Flow Path (Enters left at y=920, exits right at y=960) -->
  <path d="M 0,920 C 300,840 700,1020 1080,960" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.6" filter="url(#redGlow)"/>
  <path d="M 0,920 C 300,840 700,1020 1080,960" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Top Navigation / Persistent UI -->
  <g class="a a1">
    <text x="72" y="100" fill="#F59E0B" font-size="24" font-weight="700" letter-spacing="2">SULLAN MADHAN x INCUBRIX</text>
    <rect x="912" y="72" width="96" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="960" y="98" fill="#94A3B8" font-size="22" font-weight="600" text-anchor="middle">2 / 5</text>
  </g>

  <!-- Main Title Block -->
  <g class="a a2">
    <text x="540" y="240" fill="#FFFFFF" font-size="80" class="title-text" text-anchor="middle">Cold Tawa, Soggy Churn:</text>
    <text x="540" y="335" fill="url(#redGrad)" font-size="80" class="title-text" text-anchor="middle" filter="url(#redGlow)">The Dev Debt Crisis</text>
  </g>

  <!-- Subtitle -->
  <g class="a a3">
    <text x="540" y="420" fill="#94A3B8" font-size="34" font-weight="400" text-anchor="middle">Uncalibrated infrastructure causes lag, high drop-off, and burnt capital.</text>
  </g>

  <!-- Agitation Graphic: Error Console & Soggy Performance Diagnostics -->
  <g class="a a4">
    <rect x="140" y="490" width="800" height="490" rx="24" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Top Console Bar -->
    <path d="M 140,514 C 140,500 151,490 165,490 L 915,490 C 929,490 940,500 940,514 L 940,550 L 140,550 Z" fill="#0F172A"/>
    <circle cx="180" cy="520" r="8" fill="#EF4444"/>
    <circle cx="205" cy="520" r="8" fill="#F59E0B"/>
    <circle cx="230" cy="520" r="8" fill="#10B981"/>
    <text x="540" y="527" fill="#64748B" font-size="20" font-weight="600" text-anchor="middle">SYSTEM_DIAGNOSTIC // HIGH_LATENCY_ALERT</text>

    <!-- Error Metrics Display -->
    <g transform="translate(180, 590)">
      <rect x="0" y="0" width="340" height="150" rx="16" fill="#0B0F17" stroke="#334155" stroke-width="1"/>
      <text x="24" y="40" fill="#64748B" font-size="20">TAWA_HEAT_INDEX</text>
      <text x="24" y="95" fill="#EF4444" font-size="52" font-weight="700">140°C</text>
      <text x="200" y="95" fill="#EF4444" font-size="22" font-weight="600">(CRITICAL)</text>
    </g>

    <g transform="translate(560, 590)">
      <rect x="0" y="0" width="340" height="150" rx="16" fill="#0B0F17" stroke="#334155" stroke-width="1"/>
      <text x="24" y="40" fill="#64748B" font-size="20">USER_RETENTION</text>
      <text x="24" y="95" fill="#EF4444" font-size="52" font-weight="700">18.4%</text>
      <text x="210" y="95" fill="#EF4444" font-size="22" font-weight="600">(SOGGY)</text>
    </g>

    <!-- Warning Box -->
    <rect x="180" y="770" width="720" height="160" rx="16" fill="#1E1215" stroke="#EF4444" stroke-width="1.5"/>
    <path d="M 220,830 L 250,780 L 280,830 Z" fill="none" stroke="#EF4444" stroke-width="3" stroke-linejoin="round"/>
    <text x="250" y="822" fill="#EF4444" font-size="26" font-weight="700" text-anchor="middle">!</text>
    <text x="310" y="820" fill="#F87171" font-size="28" font-weight="600">Error: Batter stickiness bottleneck</text>
    <text x="310" y="865" fill="#94A3B8" font-size="24">Poor stack configuration leads to unbaked SaaS pipelines.</text>
  </g>

  <!-- Bottom Swipe Bar Callout -->
  <g class="a a5">
    <rect x="360" y="1120" width="360" height="64" rx="32" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="520" y="1160" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">See The Solution</text>
    <path d="M 640,1152 L 652,1152 L 646,1146 M 652,1152 L 646,1158" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Footer -->
  <text x="540" y="1280" fill="#64748B" font-size="24" text-anchor="middle">incubrix.com • Sullan Madhan Masterclass</text>
</svg>