<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

      * { box-sizing: border-box; }
      text { font-family: 'Inter', Arial, sans-serif; }
      .title-text { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }

      .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }
      .a1 { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      .a2 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
      .a3 { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
      .a4 { animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards, float 4s ease-in-out 1.8s infinite; }
      .a5 { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards; }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scaleUp { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#131B2A"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- Grid Tech Lines Overlay -->
  <g opacity="0.05">
    <line x1="0" y1="270" x2="1080" y2="270" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="540" x2="1080" y2="540" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="810" x2="1080" y2="810" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="1080" x2="1080" y2="1080" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="1350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="1350" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Continuous Seam Flow Path (Starts left, exits right at y=920) -->
  <path d="M 0,950 C 300,900 700,1000 1080,920" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.6" filter="url(#glow)"/>
  <path d="M 0,950 C 300,900 700,1000 1080,920" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Top Navigation / Persistent UI -->
  <g class="a a1">
    <text x="72" y="100" fill="#F59E0B" font-size="24" font-weight="700" letter-spacing="2">SULLAN MADHAN x INCUBRIX</text>
    <rect x="912" y="72" width="96" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="960" y="98" fill="#94A3B8" font-size="22" font-weight="600" text-anchor="middle">1 / 5</text>
  </g>

  <!-- Main Title Block -->
  <g class="a a2">
    <text x="540" y="240" fill="#FFFFFF" font-size="82" class="title-text" text-anchor="middle">Why B2B SaaS is Like</text>
    <text x="540" y="335" fill="url(#goldGrad)" font-size="82" class="title-text" text-anchor="middle" filter="url(#glow)">a Perfect Dosa</text>
  </g>

  <!-- Subtitle -->
  <g class="a a3">
    <text x="540" y="420" fill="#94A3B8" font-size="34" font-weight="400" text-anchor="middle">High heat execution, zero churn, and golden scalability at peak demand.</text>
  </g>

  <!-- Hero Visual: Tech Tawa & Golden Dosa Cylinder -->
  <g class="a a4">
    <!-- Card Frame -->
    <rect x="140" y="490" width="800" height="490" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Outer Heat Ring / Tawa Base -->
    <circle cx="540" cy="710" r="190" fill="#0B0F17" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 8" opacity="0.8"/>
    <circle cx="540" cy="710" r="160" fill="#161F30" stroke="#10B981" stroke-width="2" opacity="0.5"/>
    
    <!-- Geometric Dosa Cone / Triangle Motif -->
    <path d="M 540,570 L 680,810 L 400,810 Z" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>
    <path d="M 540,570 L 680,810 L 540,810 Z" fill="#D97706" opacity="0.4"/>
    
    <!-- Tech Parameter Badges -->
    <rect x="180" y="530" width="180" height="48" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="270" y="561" fill="#10B981" font-size="22" font-weight="600" text-anchor="middle">temp: 450°C</text>

    <rect x="720" y="530" width="180" height="48" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="810" y="561" fill="#F59E0B" font-size="22" font-weight="600" text-anchor="middle">crisp: 100%</text>

    <rect x="180" y="890" width="220" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="290" y="921" fill="#94A3B8" font-size="20" font-weight="500" text-anchor="middle">batter.ferment()</text>

    <rect x="680" y="890" width="220" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="790" y="921" fill="#94A3B8" font-size="20" font-weight="500" text-anchor="middle">churn: 0.00%</text>

    <!-- Center Status Indicator -->
    <circle cx="540" cy="710" r="16" fill="#10B981" filter="url(#glow)"/>
  </g>

  <!-- Bottom Swipe Bar Callout -->
  <g class="a a5">
    <rect x="360" y="1120" width="360" height="64" rx="32" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="520" y="1160" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">Swipe For Recipe</text>
    <path d="M 640,1152 L 652,1152 L 646,1146 M 652,1152 L 646,1158" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Footer -->
  <text x="540" y="1280" fill="#64748B" font-size="24" text-anchor="middle">incubrix.com • Sullan Madhan Masterclass</text>
</svg>