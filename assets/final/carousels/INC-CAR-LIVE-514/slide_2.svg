<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg { fill: #0B0F19; }
      .text-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 76px; fill: #F8FAFC; text-anchor: middle; }
      .text-body { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 36px; fill: #94A3B8; text-anchor: middle; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 26px; }
      
      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }

      .a-bg { animation: fadeIn 0.4s ease-out 0s forwards; }
      .a-head { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }
      .a-body { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards; }
      .a-card1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
      .a-card2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .a-pulse { animation: fadeIn 0.6s ease-out 2.2s forwards, pulseGlow 3s ease-in-out 2.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1350" class="bg" />

  <!-- Tech Grid Background -->
  <g opacity="0.15">
    <path d="M 0 100 L 1080 100 M 0 300 L 1080 300 M 0 500 L 1080 500 M 0 700 L 1080 700 M 0 900 L 1080 900 M 0 1100 L 1080 1100" stroke="#1E293B" stroke-width="1" />
    <path d="M 180 0 L 180 1350 M 360 0 L 360 1350 M 540 0 L 540 1350 M 720 0 L 720 1350 M 900 0 L 900 1350" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Continuous Seam Pipeline at Bottom -->
  <path d="M 0 1180 L 1080 1180" stroke="#00F0FF" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Left Edge Seam Continuation from Slide 1 (x=-60..60, y=700) -->
  <g transform="translate(-60, 700)">
    <path d="M 0 0 L 60 -30 L 120 0 L 60 30 Z" fill="#00FF87" opacity="0.8" />
    <path d="M 0 0 L 60 30 L 60 80 L 0 50 Z" fill="#00B359" />
  </g>

  <!-- Top UI Header -->
  <g transform="translate(72, 70)">
    <path d="M 0 0 L 24 -12 L 48 0 L 24 12 Z" fill="#00F0FF" />
    <path d="M 0 0 L 24 12 L 24 38 L 0 26 Z" fill="#0072FF" />
    <path d="M 48 0 L 48 26 L 24 38 L 24 12 Z" fill="#00FF87" />
    <text x="64" y="22" class="text-mono" font-weight="700" fill="#F8FAFC">IncuBrix</text>
  </g>
  <text x="1008" y="92" text-anchor="end" class="text-mono" font-weight="700" fill="#00F0FF">02 / 05</text>

  <!-- Headline -->
  <g transform="translate(540, 240)">
    <g class="a a-head">
      <text x="0" y="0" class="text-title">Manual Workflows Waste</text>
      <text x="0" y="90" class="text-title" fill="#FF4B4B">Engineering Cycles.</text>
    </g>
  </g>

  <!-- Supporting Body -->
  <g transform="translate(540, 460)">
    <g class="a a-body">
      <text x="0" y="0" class="text-body">Stop burning sprint hours on fragile payout scripts,</text>
      <text x="0" y="50" class="text-body">broken webhooks, and chaotic spreadsheets.</text>
    </g>
  </g>

  <!-- Problem Comparison Stack Graphic -->
  <g transform="translate(140, 580)">
    <!-- Broken Stack Card (The Problem) -->
    <g class="a a-card1">
      <rect x="0" y="0" width="800" height="230" rx="16" fill="#131B2E" stroke="#FF4B4B" stroke-width="1.5" />
      <circle cx="50" cy="45" r="16" fill="#FF4B4B" opacity="0.2" />
      <path d="M 44 39 L 56 51 M 56 39 L 44 51" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round" />
      <text x="85" y="52" class="text-mono" font-weight="700" fill="#FF4B4B">FRAGMENTED LEGACY STACK</text>
      
      <!-- Mock terminal logs of failure -->
      <g transform="translate(40, 85)">
        <rect x="0" y="0" width="720" height="110" rx="8" fill="#0B0F19" />
        <text x="20" y="35" class="text-mono" fill="#FF4B4B" font-size="22">ERR: Webhook timeout (504) - Payout event dropped</text>
        <text x="20" y="70" class="text-mono" fill="#94A3B8" font-size="22">WARN: CSV mismatch - 142 affiliate IDs missing attribution</text>
      </g>
    </g>

    <!-- Lost Time Impact Card -->
    <g transform="translate(0, 260)">
      <g class="a a-card2">
        <rect x="0" y="0" width="800" height="180" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5" />
        
        <g transform="translate(50, 45)">
          <text x="0" y="40" class="text-mono" font-size="64" font-weight="700" fill="#FF4B4B">120+</text>
          <text x="0" y="80" class="text-body" font-size="26" text-anchor="start">Hours Lost Per Quarter</text>
        </g>

        <line x1="380" y1="30" x2="380" y2="150" stroke="#1E293B" stroke-width="2" />

        <g transform="translate(430, 45)">
          <text x="0" y="40" class="text-mono" font-size="64" font-weight="700" fill="#FF4B4B">3.8x</text>
          <text x="0" y="80" class="text-body" font-size="26" text-anchor="start">More Disputed Payouts</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Edge Seam Flow Object (Data stream crossing to Slide 3: x=1050..1110, y=400) -->
  <g transform="translate(1050, 400)">
    <path d="M 0 0 C 30 0 30 100 60 100" stroke="#00FF87" stroke-width="4" fill="none" opacity="0.8" />
  </g>

  <!-- Swipe Cue Indicator -->
  <g transform="translate(1008, 675)">
    <g class="a a-pulse">
      <path d="M 0 -16 L 16 0 L 0 16" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>