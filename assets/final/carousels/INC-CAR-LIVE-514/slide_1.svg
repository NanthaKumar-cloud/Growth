<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg { fill: #0B0F19; }
      .text-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 80px; fill: #F8FAFC; text-anchor: middle; }
      .text-body { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 36px; fill: #94A3B8; text-anchor: middle; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 28px; }
      
      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }

      .a-bg { animation: fadeIn 0.4s ease-out 0s forwards; }
      .a-head { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }
      .a-body { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards; }
      .a-hero { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, float 5s ease-in-out 1.1s infinite; }
      .a-card { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards; }
      .a-pulse { animation: fadeIn 0.6s ease-out 2.2s forwards, pulseGlow 3s ease-in-out 2.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#0F1626" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1350" class="bg" />

  <!-- Tech Grid Accent -->
  <g opacity="0.15">
    <path d="M 0 100 L 1080 100 M 0 300 L 1080 300 M 0 500 L 1080 500 M 0 700 L 1080 700 M 0 900 L 1080 900 M 0 1100 L 1080 1100" stroke="#1E293B" stroke-width="1" />
    <path d="M 180 0 L 180 1350 M 360 0 L 360 1350 M 540 0 L 540 1350 M 720 0 L 720 1350 M 900 0 L 900 1350" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Continuous Seam Pipeline at Bottom -->
  <path d="M 0 1180 L 1080 1180" stroke="#00F0FF" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Top UI Header -->
  <g transform="translate(72, 70)">
    <!-- Brand Logo Icon -->
    <path d="M 0 0 L 24 -12 L 48 0 L 24 12 Z" fill="#00F0FF" />
    <path d="M 0 0 L 24 12 L 24 38 L 0 26 Z" fill="#0072FF" />
    <path d="M 48 0 L 48 26 L 24 38 L 24 12 Z" fill="#00FF87" />
    <text x="64" y="22" class="text-mono" font-weight="700" fill="#F8FAFC">IncuBrix</text>
  </g>
  <text x="1008" y="92" text-anchor="end" class="text-mono" font-weight="700" fill="#00F0FF">01 / 05</text>

  <!-- Headline -->
  <g transform="translate(540, 240)">
    <g class="a a-head">
      <text x="0" y="0" class="text-title">Ship CreatorOps</text>
      <text x="0" y="95" class="text-title" fill="#00F0FF">in One Weekend.</text>
    </g>
  </g>

  <!-- Supporting Body -->
  <g transform="translate(540, 470)">
    <g class="a a-body">
      <text x="0" y="0" class="text-body">Automate payouts, tracking, and attribution with</text>
      <text x="0" y="50" class="text-body">enterprise-grade developer infrastructure.</text>
    </g>
  </g>

  <!-- Hero Visual: Isometric Brix Stack -->
  <g transform="translate(540, 800)">
    <g class="a a-hero">
      <!-- Outer Glow Ring -->
      <ellipse cx="0" cy="110" rx="280" ry="80" fill="#00F0FF" opacity="0.12" filter="url(#cyanGlow)" />
      
      <!-- Isometric Base Platform -->
      <path d="M -220 60 L 0 -50 L 220 60 L 0 170 Z" fill="#131B2E" stroke="#1E293B" stroke-width="3" />
      <path d="M -220 60 L 0 170 L 0 210 L -220 100 Z" fill="#0B0F19" />
      <path d="M 220 60 L 0 170 L 0 210 L 220 100 Z" fill="#0F1626" />

      <!-- Isometric Main Brix Block 1 -->
      <g transform="translate(-80, -40)">
        <path d="M -70 0 L 0 -35 L 70 0 L 0 35 Z" fill="#00F0FF" opacity="0.9" />
        <path d="M -70 0 L 0 35 L 0 90 L -70 55 Z" fill="#0072FF" />
        <path d="M 70 0 L 0 35 L 0 90 L 70 55 Z" fill="#003B80" />
      </g>

      <!-- Isometric Main Brix Block 2 -->
      <g transform="translate(80, -90)">
        <path d="M -70 0 L 0 -35 L 70 0 L 0 35 Z" fill="#00FF87" opacity="0.9" />
        <path d="M -70 0 L 0 35 L 0 90 L -70 55 Z" fill="#00B359" />
        <path d="M 70 0 L 0 35 L 0 90 L 70 55 Z" fill="#00592D" />
      </g>

      <!-- Isometric Top Brix Block -->
      <g transform="translate(0, -160)">
        <path d="M -70 0 L 0 -35 L 70 0 L 0 35 Z" fill="#FFFFFF" />
        <path d="M -70 0 L 0 35 L 0 80 L -70 45 Z" fill="#60EFFF" />
        <path d="M 70 0 L 0 35 L 0 80 L 70 45 Z" fill="#00F0FF" />
      </g>
    </g>

    <!-- Floating Badge Left -->
    <g transform="translate(-320, 20)">
      <g class="a a-card">
        <rect x="0" y="0" width="220" height="60" rx="12" fill="#131B2E" stroke="#00F0FF" stroke-width="1.5" />
        <text x="20" y="38" class="text-mono" font-size="20" fill="#00FF87">POST /payouts</text>
      </g>
    </g>

    <!-- Floating Badge Right -->
    <g transform="translate(140, -100)">
      <g class="a a-card">
        <rect x="0" y="0" width="200" height="60" rx="12" fill="#131B2E" stroke="#00FF87" stroke-width="1.5" />
        <text x="20" y="38" class="text-mono" font-size="20" fill="#00F0FF">200 OK [12ms]</text>
      </g>
    </g>
  </g>

  <!-- Seam Object Crossing Right Edge (x=1020..1140, y=700) -->
  <g transform="translate(1020, 700)">
    <path d="M 0 0 L 60 -30 L 120 0 L 60 30 Z" fill="#00FF87" opacity="0.8" />
    <path d="M 0 0 L 60 30 L 60 80 L 0 50 Z" fill="#00B359" />
  </g>

  <!-- Swipe Cue Indicator -->
  <g transform="translate(1008, 675)">
    <g class="a a-pulse">
      <path d="M 0 -16 L 16 0 L 0 16" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>