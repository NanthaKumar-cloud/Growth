<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@700&display=swap');
            .font-poppins { font-family: 'Poppins', Arial, sans-serif; }
            .font-inter { font-family: 'Inter', Helvetica, sans-serif; }

            /* Colors */
            .color-primary { fill: #6633FF; } /* Deep Purple */
            .color-accent1 { fill: #00CCAA; } /* Teal */
            .color-accent2 { fill: #FFCC00; } /* Yellow */
            .color-bg-light { fill: #F5F5F5; } /* Light Gray Background */
            .color-dark-text { fill: #333333; } /* Dark Gray Text */
            .color-white { fill: #FFFFFF; } /* White */

            /* Text styles */
            .headline { font-size: 96px; font-weight: 700; text-anchor: middle; }
            .subheadline { font-size: 40px; font-weight: 700; text-anchor: middle; }
            .body-text { font-size: 40px; font-weight: 400; text-anchor: middle; }
            .small-text { font-size: 32px; font-weight: 400; text-anchor: middle; }
            .brand-text { font-size: 36px; font-weight: 700; text-anchor: end; }

            /* Animation base */
            .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }

            /* Keyframe Animations */
            @keyframes fadeUp {
                from { opacity: 0; transform: translateY(40px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes scaleIn {
                from { opacity: 0; transform: scale(0.8); }
                to { opacity: 1; transform: scale(1); }
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes slideInLeft {
                from { opacity: 0; transform: translateX(-100px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes slideInRight {
                from { opacity: 0; transform: translateX(100px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes gentlePulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
            @keyframes floatUpDown {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
            @keyframes dashFlow {
                from { stroke-dashoffset: 120; }
                to { stroke-dashoffset: 0; }
            }
            @keyframes rotateClock {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            @keyframes spinCircle {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            /* Animation classes */
            .a1 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards, gentlePulse 2s ease-in-out 3.3s infinite alternate; }
            .a2 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards, gentlePulse 2s ease-in-out 3.6s infinite alternate; }
            .a3 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards, gentlePulse 2s ease-in-out 3.9s infinite alternate; }
            .a4 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.2s forwards, gentlePulse 2s ease-in-out 4.2s infinite alternate; }
            .a5 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.5s forwards, gentlePulse 2s ease-in-out 4.5s infinite alternate; }
            .a6 { animation: slideInLeft 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.8s forwards, floatUpDown 2s ease-in-out 4.8s infinite alternate; }
            .a7 { animation: slideInRight 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.1s forwards, floatUpDown 2s ease-in-out 5.1s infinite alternate; }
            .a8 { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.4s forwards; }
            .a-bg { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0s forwards; }
            .a-flow { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards; }
            .a-dash { animation: dashFlow 3s linear 0s infinite; }
            .a-spin-idle { animation: rotateClock 10s linear 3s infinite; }
            .a-spin-entrance { animation: spinCircle 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s forwards; }


            @media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
        </style>

        <filter id="shadowDepth" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
        <filter id="shadowHover" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
        </filter>
        <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
            <feFlood flood-color="#00CCAA" flood-opacity="0.7" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <linearGradient id="gradPurpleTeal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6633FF"/>
            <stop offset="100%" stop-color="#00CCAA"/>
        </linearGradient>
        <linearGradient id="gradFlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00CCAA"/>
            <stop offset="100%" stop-color="#6633FF"/>
        </linearGradient>
        <linearGradient id="gradIncuBrixButton" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6633FF"/>
            <stop offset="100%" stop-color="#00CCAA"/>
        </linearGradient>
        <linearGradient id="gradRedPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5050"/>
            <stop offset="100%" stop-color="#6633FF"/>
        </linearGradient>

        <!-- IncuBrix Logo Mark -->
        <g id="brandMark">
            <rect x="0" y="0" width="30" height="30" rx="6" fill="#6633FF"/>
            <path d="M 8 22 L 8 8 L 15 8 A 7 7 0 0 1 15 22 L 8 22 Z M 15 15 L 15 22 L 22 22 L 22 8 L 15 8 L 15 15 Z" fill="#FFFFFF"/>
        </g>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="1080" height="1350" fill="#F5F5F5"/>

    <!-- IncuFlow - Entering Left, Exiting Right -->
    <g class="a a-flow">
        <path d="M 0 550 C 100 580 200 520 300 500 C 450 450 600 480 750 400 C 850 350 950 450 1080 400" stroke="url(#gradFlow)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowEffect)"/>
        <path d="M 0 550 C 100 580 200 520 300 500 C 450 450 600 480 750 400 C 850 350 950 450 1080 400" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="80 40" class="a-dash"/>
    </g>

    <!-- Headline -->
    <g class="a a1">
        <text x="540" y="240" class="headline font-poppins color-dark-text">Automate Content.</text>
    </g>
    <g class="a a2">
        <text x="540" y="340" class="headline font-poppins color-primary">Reclaim Engineering Focus.</text>
    </g>

    <!-- Supporting Text -->
    <g class="a a3">
        <text x="540" y="470" class="body-text font-inter color-dark-text">IncuBrix turns your weekend ideas into</text>
        <text x="540" y="520" class="body-text font-inter color-dark-text">production-ready assets, automatically.</text>
    </g>

    <!-- Visual Element: Automation Pipeline / Lightbulb to multiple outputs -->
    <g class="a a4" transform="translate(540, 800)">
        <rect x="-300" y="-100" width="600" height="200" rx="24" fill="#FFFFFF" filter="url(#shadowDepth)"/>
        <!-- Input: Lightbulb -->
        <circle cx="-200" cy="0" r="50" fill="#FFCC00" filter="url(#glowEffect)"/>
        <path d="M-200 -20 L-200 -40 C -200 -50 -190 -60 -180 -60 L -170 -60 C -160 -60 -150 -50 -150 -40 L -150 -20" stroke="#333333" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M-200 20 L-200 40 C -200 50 -190 60 -180 60 L -170 60 C -160 60 -150 50 -150 40 L -150 20" stroke="#333333" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M-200 0 C -190 -15 -210 -15 -200 0 Z" fill="#333333"/>
        <!-- Process block -->
        <rect x="-80" y="-40" width="160" height="80" rx="16" fill="#6633FF" filter="url(#shadowDepth)"/>
        <path d="M -50 0 L 50 0 M 0 -20 L 0 20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <!-- Output: multiple small blocks -->
        <rect x="180" y="-60" width="60" height="30" rx="6" fill="#00CCAA"/>
        <rect x="190" y="10" width="60" height="30" rx="6" fill="#00CCAA"/>
        <rect x="170" y="50" width="60" height="30" rx="6" fill="#00CCAA"/>
        <!-- Arrows -->
        <path d="M -130 0 L -100 0 L -100 -10 L -90 0 L -100 10 L -100 0" fill="#333333"/>
        <path d="M 80 0 L 110 0 L 110 -10 L 120 0 L 110 10 L 110 0" fill="#333333"/>
    </g>

    <!-- Swipe Indicator -->
    <g class="a a8">
        <text x="540" y="1270" class="small-text font-inter color-dark-text">SWIPE</text>
        <path d="M 570 1260 L 590 1250 L 570 1240 Z" fill="#333333"/>
    </g>

    <!-- Progress Dots -->
    <g class="a a8">
        <circle cx="490" cy="1310" r="8" class="color-dark-text" opacity="0.3"/>
        <circle cx="515" cy="1310" r="8" class="color-dark-text" opacity="0.3"/>
        <circle cx="540" cy="1310" r="8" class="color-accent1"/>
        <circle cx="565" cy="1310" r="8" class="color-dark-text" opacity="0.3"/>
        <circle cx="590" cy="1310" r="8" class="color-dark-text" opacity="0.3"/>
    </g>

    <!-- Brand Mark -->
    <g class="a a8">
        <use href="#brandMark" x="900" y="55"/>
        <text x="1040" y="77" class="brand-text font-poppins color-dark-text">@incubrix</text>
    </g>
</svg>