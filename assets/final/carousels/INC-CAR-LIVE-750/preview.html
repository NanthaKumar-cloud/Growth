    --text-primary: #F3F4F6;
    --text-secondary: #9CA3AF;

    background: var(--bg-dark);
    color: var(--text-primary);

    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #A5B4FC;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.4);
    padding: 6px 14px;
    border-radius: 9999px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .controls-bar {
    display: flex;
    gap: 12px;
  }
  button {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: #1F2937;
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  /* Main Stage - Unclipped Full Frame Display */
  .stage-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 100%;
    overflow: visible;
  }
  .viewport-card {
    width: 100%;
    max-width: 540px;
    aspect-ratio: 4 / 5;
    background: transparent;
    border-radius: 0;
    overflow: visible;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    transition: max-width 0.25s ease;
  }
  .viewport-card.native-size {
    max-width: 1080px;
    width: 1080px;
    height: 1350px;
  }
  .slide-stage {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: visible;
  }
  .slide-stage svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible !important;
  }
  /* Panoramic Seamless Mode - Unclipped */
  .panoramic-mode {
    display: none;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: visible;
    padding: 20px 0;
  }
  .panoramic-strip {
    display: flex;
    gap: 0;
    width: max-content;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    border-radius: 0;
    overflow: visible;
  }
  .panoramic-strip .pano-slide {
    width: 480px;
    height: 600px;
    flex-shrink: 0;
    overflow: visible;
    border-right: 1px dashed rgba(255,255,255,0.25);
  }
  .panoramic-strip .pano-slide svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible !important;
  }
  /* Bottom Navigation */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }
  .dots-container {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #374151;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .dot.active {
    background: var(--accent);
    transform: scale(1.3);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .slide-role-label {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }
</style>
</head>

            /* Animation base */

            /* Keyframe Animations */
            @keyframes fadeUp {
                from { opacity: 0; transform: translateY(40px); }

            }
            @keyframes scaleIn {
                from { opacity: 0; transform: scale(0.8); }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }

            @keyframes slideInLeft {
                from { opacity: 0; transform: translateX(-100px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes slideInRight {
                from { opacity: 0; transform: translateX(100px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes gentlePulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
            @keyframes floatUpDown {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
            @keyframes dashFlow {
                from { stroke-dashoffset: 120; }
                to { stroke-dashoffset: 0; }
            }
            @keyframes rotateClock {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            @keyframes spinCircle {

            /* Animation classes */
            .a1 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards, gentlePulse 2s ease-in-out 3.3s infinite alternate; }
            .a2 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards, gentlePulse 2s ease-in-out 3.6s infinite alternate; }
            .a3 { animation: fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards, gentlePulse 2s ease-in-out 3.9s infinite alternate; }
            .a4 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.2s forwards, gentlePulse 2s ease-in-out 4.2s infinite alternate; }
            .a5 { animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.5s forwards, gentlePulse 2s ease-in-out 4.5s infinite alternate; }

            .a8 { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.4s forwards; }
            .a-bg { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0s forwards; }
            .a-flow { animation: fadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards; }
            .a-dash { animation: dashFlow 3s linear 0s infinite; }
            .a-spin-idle { animation: rotateClock 10s linear 3s infinite; }

        </style>

  let currentIndex = 0;
  const stage = document.getElementById("slideStage");
  const roleLabel = document.getElementById("roleLabel");
  const dotsContainer = document.getElementById("dotsContainer");

  function init() {
    // Render dots
    dotsContainer.innerHTML = "";
    slidesData.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.onclick = () => goToSlide(i);
      dotsContainer.appendChild(d);
    });

    // Populate panoramic strip
    const panoStrip = document.getElementById("panoStrip");
    panoStrip.innerHTML = "";
    slidesData.forEach((s) => {
      const container = document.createElement("div");
      container.className = "pano-slide";
      container.innerHTML = s.svg;
      panoStrip.appendChild(container);
    });

    renderSlide(0);
  }

  function renderSlide(index) {
    currentIndex = index;
    const slide = slidesData[index];
    // Re-inject HTML to re-trigger CSS keyframe animations fresh
    stage.innerHTML = slide.svg;
    roleLabel.textContent = `Slide ${slide.index} of ${slidesData.length} - ${slide.role}`;

    document.querySelectorAll(".dot").forEach((d, i) => {
      d.className = "dot" + (i === index ? " active" : "");
    });

    document.getElementById("prevBtn").disabled = index === 0;
    document.getElementById("nextBtn").disabled = index === slidesData.length - 1;
  }

  function nextSlide() {
    if (currentIndex < slidesData.length - 1) {
      renderSlide(currentIndex + 1);
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      renderSlide(currentIndex - 1);
    }
  }

  function goToSlide(index) {
    renderSlide(index);
  }

  function replayCurrentSlide() {
    renderSlide(currentIndex);
  }

  let panoActive = false;
  function togglePanoramicView() {
    panoActive = !panoActive;
    const single = document.getElementById("singleStageView");
    const pano = document.getElementById("panoramicView");
    const btn = document.getElementById("togglePanoBtn");

    if (panoActive) {
      single.style.display = "none";
      pano.style.display = "block";
      btn.classList.add("active");
    } else {
      single.style.display = "flex";
      pano.style.display = "none";
      btn.classList.remove("active");
    }
  }

  let isNative = false;
  function toggleNativeScale() {
    isNative = !isNative;
    const card = document.querySelector(".viewport-card");
    const btn = document.getElementById("toggleNativeBtn");
    if (isNative) {
      card.classList.add("native-size");
      btn.classList.add("active");
      btn.innerHTML = "&#x2922; Fit Scale";
    } else {
      card.classList.remove("native-size");
      btn.classList.remove("active");
      btn.innerHTML = "&#x2921; 100% Native (1080&times;1350)";
    }
  }

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextSlide();
    if (e.key === "ArrowLeft") prevSlide();
    if (e.key === "r" || e.key === "R") replayCurrentSlide();
  });

  init();
</script>
