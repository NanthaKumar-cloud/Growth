<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  .bg-fill { fill: #0D1117; }
  .grid-lines { stroke: #161B22; stroke-width: 2; stroke-dasharray: 6 12; }
  
  /* Animations */
  .fade-in { animation: fadeIn 0.6s ease-out 0.2s forwards; }
  .slide-down { animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards; }
  .slide-up { animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards; }
  .pop-in-1 { animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards, floatCard1 4s ease-in-out 1.3s infinite alternate; }
  .pop-in-2 { animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards, floatCard2 4.5s ease-in-out 1.5s infinite alternate; }
  .pop-in-3 { animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.0s forwards, floatCard1 3.8s ease-in-out 1.7s infinite alternate; }
  .pop-in-4 { animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards, floatCard2 4.2s ease-in-out 1.9s infinite alternate; }
  
  .stack-bills { animation: stackBills 0.8s cubic-bezier(0.34, 1.2, 0.64, 1) 4.2s forwards; }
  .pulse-alert { animation: pulseAlert 1.5s ease-in-out 4.2s infinite alternate; }
  .ribbon-wave { animation: ribbonWave 3s ease-in-out 0.5s infinite alternate; }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes slideDown {
    0% { opacity: 0; transform: translateY(-30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes floatCard1 {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-12px) rotate(-1deg); }
  }
  @keyframes floatCard2 {
    0% { transform: translateY(0) rotate(3deg); }
    100% { transform: translateY(-15px) rotate(1deg); }
  }
  @keyframes stackBills {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); }
    50% { transform: translate(0, -50px) scale(1.05) rotate(5deg); }
    100% { transform: translate(0, -20px) scale(1.1) rotate(0deg); }
  }
  @keyframes pulseAlert {
    0% { filter: drop-shadow(0 0 10px rgba(255, 123, 114, 0.3)); }
    100% { filter: drop-shadow(0 0 35px rgba(255, 123, 114, 0.8)); }
  }
  @keyframes ribbonWave {
    0% { transform: translateY(0) scaleX(1); }
    100% { transform: translateY(8px) scaleX(0.98); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>

  
  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1F242C" />
    <stop offset="100%" stop-color="#161B22" />
  </linearGradient>

  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF7B72" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#FF7B72" stop-opacity="0.2" />
  </linearGradient>

  
  <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
    <stop offset="30%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="70%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
  </linearGradient>

  
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
  </filter>
  
  <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FF7B72" flood-opacity="0.4" />
  </filter>
</defs>


<rect width="1080" height="1920" fill="url(#bgGrad)" />


<g class="a fade-in">
  <line x1="100" y1="0" x2="100" y2="1920" class="grid-lines" />
  <line x1="360" y1="0" x2="360" y2="1920" class="grid-lines" />
  <line x1="720" y1="0" x2="720" y2="1920" class="grid-lines" />
  <line x1="980" y1="0" x2="980" y2="1920" class="grid-lines" />
  <line x1="0" y1="300" x2="1080" y2="300" class="grid-lines" />
  <line x1="0" y1="960" x2="1080" y2="960" class="grid-lines" />
  <line x1="0" y1="1600" x2="1080" y2="1600" class="grid-lines" />
</g>


<g transform="translate(80, 80)"><g class="a fade-in">
  <rect width="48" height="48" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2" />
  <circle cx="24" cy="24" r="10" fill="#58A6FF" />
  <text x="68" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24" fill="#C9D1D9" letter-spacing="0.5">CreatorOps</text>
</g>


</g><g transform="translate(540, 220)"><g class="a slide-down">
  <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="-1">Stop Subscription Bleed</text>
  <text x="0" y="55" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="28" fill="#8B949E">Paying $100/mo across 4 fragmented tools?</text>
</g>


</g><g transform="translate(540, 1050)">
  
  <g class="a slide-up">
    <rect x="-420" y="250" width="840" height="16" rx="8" fill="#21262D" filter="url(#shadow)" />
    <rect x="-120" y="266" width="240" height="150" fill="#161B22" opacity="0.6" />
  </g>

  
  <g class="a slide-up" style="animation-delay: 0.8s;">
    
    <circle cx="0" cy="60" r="45" fill="#1F242C" />
    <path d="M -90 220 C -90 140, -50 120, 0 120 C 50 120, 90 140, 90 220 Z" fill="#1F242C" />
    
    <path d="M 0 105 C 10 105, 25 110, 30 125" stroke="#8B949E" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  
  
  <g transform="translate(-280, -80)"><g class="a pop-in-1">
    <rect x="-110" y="-80" width="220" height="160" rx="20" fill="url(#cardGrad)" stroke="#FF7B72" stroke-width="2" filter="url(#redGlow)" />
    <circle cx="-65" cy="-35" r="20" fill="#FF7B72" opacity="0.2" />
    <path d="M -73 -35 L -69 -30 L -55 -45" stroke="#FF7B72" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-35" y="-28" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#C9D1D9">Cloud Storage</text>
    <text x="-65" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="36" fill="#FF7B72">$25<tspan font-size="18" fill="#8B949E">/mo</tspan></text>
  </g>

  
  </g><g transform="translate(-100, -180)"><g class="a pop-in-2">
    <rect x="-110" y="-80" width="220" height="160" rx="20" fill="url(#cardGrad)" stroke="#FF7B72" stroke-width="2" filter="url(#redGlow)" />
    <circle cx="-65" cy="-35" r="20" fill="#FF7B72" opacity="0.2" />
    <path d="M -77 -43 L -53 -43 L -53 -27 L -77 -27 Z" stroke="#FF7B72" stroke-width="3" fill="none" />
    <path d="M -77 -43 L -65 -33 L -53 -43" stroke="#FF7B72" stroke-width="3" fill="none" />
    <text x="-35" y="-28" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#C9D1D9">Email Suite</text>
    <text x="-65" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="36" fill="#FF7B72">$25<tspan font-size="18" fill="#8B949E">/mo</tspan></text>
  </g>

  
  </g><g transform="translate(100, -180)"><g class="a pop-in-3">
    <rect x="-110" y="-80" width="220" height="160" rx="20" fill="url(#cardGrad)" stroke="#FF7B72" stroke-width="2" filter="url(#redGlow)" />
    <circle cx="-65" cy="-35" r="20" fill="#FF7B72" opacity="0.2" />
    <circle cx="-65" cy="-35" r="8" fill="#FF7B72" />
    <text x="-35" y="-28" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#C9D1D9">Video CRM</text>
    <text x="-65" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="36" fill="#FF7B72">$25<tspan font-size="18" fill="#8B949E">/mo</tspan></text>
  </g>

  
  </g><g transform="translate(280, -80)"><g class="a pop-in-4">
    <rect x="-110" y="-80" width="220" height="160" rx="20" fill="url(#cardGrad)" stroke="#FF7B72" stroke-width="2" filter="url(#redGlow)" />
    <circle cx="-65" cy="-35" r="20" fill="#FF7B72" opacity="0.2" />
    <path d="M -75 -25 L -75 -40 L -65 -40 L -65 -25 Z M -60 -25 L -60 -48 L -50 -48 L -50 -25 Z" fill="#FF7B72" />
    <text x="-35" y="-28" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#C9D1D9">Analytics</text>
    <text x="-65" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="36" fill="#FF7B72">$25<tspan font-size="18" fill="#8B949E">/mo</tspan></text>
  </g>

  
  </g><g transform="translate(0, -320)"><g class="a stack-bills pulse-alert">
    <rect x="-150" y="-60" width="300" height="120" rx="24" fill="#161B22" stroke="#FF7B72" stroke-width="3" filter="url(#redGlow)" />
    <text x="0" y="-12" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="18" fill="#8B949E">TOTAL DRAIN</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="48" fill="#FF7B72">$100<tspan font-size="20" fill="#8B949E"> /mo</tspan></text>
  </g>
</g></g>


<g transform="translate(540, 1250)"><g class="a ribbon-wave">
  <path d="M -180 0 Q 0 -40 180 0" stroke="url(#ribbonGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
</g>


</g><rect x="0" y="1720" width="1080" height="200" fill="#0D1117" opacity="0.9" />

</svg>