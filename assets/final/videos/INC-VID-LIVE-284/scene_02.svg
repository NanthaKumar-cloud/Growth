<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Poppins:wght@700;900&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }
      
      .bg-rect { opacity: 1 !important; }
      .brand-mark { opacity: 1 !important; }
      .ribbon-stub-left { opacity: 1 !important; }
      .ribbon-stub-right { opacity: 1 !important; }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.3); }
        70% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes meltIn {
        0% { opacity: 0; transform: scale(1.6) translate(0, -150px); filter: blur(12px); }
        50% { opacity: 0.8; transform: scale(0.9) translate(0, 20px); filter: blur(4px); }
        100% { opacity: 1; transform: scale(1) translate(0, 0); filter: blur(0px); }
      }
      @keyframes pulseGreen {
        0%, 100% { filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.4)); }
        50% { filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.8)); }
      }
      @keyframes ribbonWave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .ani-bg { animation: fadeUp 0.8s ease-out 0s forwards; }
      .ani-headline { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards; }
      .ani-support { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards; }
      
      .ani-cube { animation: meltIn 1.0s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards, floatSlow 4s ease-in-out 1.6s infinite; }
      
      .ani-dash-1 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards, floatSlow 3.5s ease-in-out 2.1s infinite; }
      .ani-dash-2 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.8s forwards, floatSlow 4.0s ease-in-out 2.4s infinite; }
      .ani-dash-3 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.1s forwards, floatSlow 3.8s ease-in-out 2.7s infinite; }

      .ani-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards, ribbonWave 4s ease-in-out 1.0s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#161B2E" />
      <stop offset="100%" stop-color="#0D0F18" />
    </radialGradient>

    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neon-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="1080" height="1920" fill="url(#bg-grad)" />

  <!-- Background Grid with Opacity on Child -->
  <g class="a ani-bg">
    <g opacity="0.15">
      <path d="M 0,300 L 1080,300 M 0,600 L 1080,600 M 0,900 L 1080,900 M 0,1200 L 1080,1200 M 0,1500 L 1080,1500" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
    </g>
  </g>

  <!-- Persistent Brand Mark -->
  <g class="brand-mark" transform="translate(72, 100)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
    <path d="M14 24 L22 32 L34 16" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" letter-spacing="1">CreatorOS</text>
  </g>

  <!-- Headlines -->
  <g transform="translate(540, 260)">
    <text class="a ani-headline" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-weight="900" font-size="76" fill="#F8FAFC" letter-spacing="-1">
      Meet CreatorOps Studio
    </text>
    <text class="a ani-support" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="38" fill="#22C55E" y="80">
      All your workflows in one dashboard
    </text>
  </g>

  <!-- HERO ELEMENT: Isometric Studio Cube with Glowing Holographic Play Button -->
  <g transform="translate(540, 820)">
    <g class="a ani-cube" filter="url(#neon-green)">
      <!-- Cube Top Face -->
      <path d="M 0,-140 L 180,-50 L 0,40 L -180,-50 Z" fill="url(#cube-top)" stroke="#34D399" stroke-width="2" />
      
      <!-- Cube Left Face -->
      <path d="M -180,-50 L 0,40 L 0,220 L -180,130 Z" fill="url(#cube-left)" stroke="#6366F1" stroke-width="2" />

      <!-- Cube Right Face -->
      <path d="M 180,-50 L 0,40 L 0,220 L 180,130 Z" fill="url(#cube-right)" stroke="#6366F1" stroke-width="2" />

      <!-- Holographic Play Button Floating on Top -->
      <g transform="translate(0, -50)">
        <polygon points="0,-45 40,-20 40,30 0,55 -40,30 -40,-20" fill="#1E293B" stroke="#22C55E" stroke-width="3" filter="url(#shadow)" />
        <path d="M-12 -18 L16 0 L-12 18 Z" fill="#22C55E" />
      </g>
    </g>
  </g>

  <!-- Floating UI Dashboards / Modules (Scheduling, Analytics, Revenue) -->
  <g transform="translate(0, 0)">
    <!-- Dashboard 1: Scheduling (Left) -->
    <g transform="translate(200, 1120)"><g class="a ani-dash-1">
      <rect x="-140" y="-70" width="280" height="140" rx="20" fill="url(#panel-grad)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-90" cy="-25" r="18" fill="#6366F1" fill-opacity="0.3" />
      <path d="M-95 -25 L-85 -25 M-90 -30 L-90 -20" stroke="#6366F1" stroke-width="3" stroke-linecap="round" />
      <text x="-60" y="-30" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Smart Schedule</text>
      <text x="-60" y="-6" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">Next post queued 4:00 PM</text>
      <rect x="-110" y="14" width="220" height="8" rx="4" fill="#334155" />
      <rect x="-110" y="14" width="160" height="8" rx="4" fill="#6366F1" />
    </g></g>

    <!-- Dashboard 2: Analytics (Right) -->
    <g transform="translate(880, 1060)"><g class="a ani-dash-2">
      <rect x="-140" y="-70" width="280" height="140" rx="20" fill="url(#panel-grad)" stroke="#A855F7" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-90" cy="-25" r="18" fill="#A855F7" fill-opacity="0.3" />
      <path d="M-100 -15 L-90 -30 L-80 -20 L-70 -38" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="-60" y="-30" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Live Analytics</text>
      <text x="-60" y="-6" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">+24.5% reach today</text>
      <path d="M-110 25 L-70 10 L-30 20 L10 0 L50 15 L90 -5" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    </g></g>

    <!-- Dashboard 3: Revenue (Bottom Center) -->
    <g transform="translate(540, 1420)"><g class="a ani-dash-3">
      <rect x="-180" y="-55" width="360" height="110" rx="20" fill="url(#panel-grad)" stroke="#22C55E" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-125" cy="-10" r="20" fill="#22C55E" fill-opacity="0.2" />
      <path d="M-125 -20 C-133 -20 -133 -5 -125 -5 C-117 -5 -117 10 -125 10 M-125 -25 L-125 15" stroke="#22C55E" stroke-width="3" stroke-linecap="round" />
      <text x="-90" y="-18" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="22" fill="#F8FAFC">Unified Revenue Stream</text>
      <text x="-90" y="12" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="24" fill="#22C55E">+$4,820.00 /mo</text>
    </g></g>
  </g>

  <!-- Left Stub (Seamless continuation from Scene 1 right stub) -->
  <rect class="ribbon-stub-left" x="0" y="1232" width="173" height="32" fill="#6366F1" />

  <!-- Ribbon Seam Link (Active animated middle) -->
  <g class="a ani-ribbon">
    <path d="M 173 1248 C 300 1248, 400 1200, 540 1200 C 680 1200, 780 1248, 907 1248" fill="none" stroke="#6366F1" stroke-width="32" stroke-linecap="round" filter="url(#shadow)" />
  </g>

  <!-- Right Stub (Static pixel alignment for transition to Scene 3) -->
  <rect class="ribbon-stub-right" x="907" y="1232" width="173" height="32" fill="#6366F1" />
</svg>