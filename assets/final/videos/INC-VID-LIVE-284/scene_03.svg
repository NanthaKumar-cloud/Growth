<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Poppins:wght@700;900&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }
      
      .bg-rect { opacity: 1 !important; }
      .brand-mark { opacity: 1 !important; }
      .ribbon-stub-left { opacity: 1 !important; }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.3); }
        70% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGreen {
        0%, 100% { filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.4)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 50px rgba(34, 197, 94, 0.9)); transform: scale(1.03); }
      }
      @keyframes badgePop {
        0% { opacity: 0; transform: scale(0.5) translateY(20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes ribbonWave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ctaGlow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 35px rgba(99, 102, 241, 0.8)); }
      }

      .ani-bg { animation: fadeUp 0.8s ease-out 0s forwards; }
      .ani-headline { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.25s forwards; }
      .ani-support { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards; }
      
      .ani-cube { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, pulseGreen 3.5s ease-in-out 1.5s infinite; }
      
      .ani-check { animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards, floatSlow 3.2s ease-in-out 1.5s infinite; }
      .ani-metric-1 { animation: badgePop 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.2s forwards, floatSlow 3.8s ease-in-out 1.8s infinite; }
      .ani-metric-2 { animation: badgePop 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards, floatSlow 4.2s ease-in-out 2.1s infinite; }

      .ani-cta { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.8s forwards, ctaGlow 3s ease-in-out 2.6s infinite; }
      .ani-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards, ribbonWave 4s ease-in-out 1.0s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#161B2E" />
      <stop offset="100%" stop-color="#0D0F18" />
    </radialGradient>

    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neon-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="1080" height="1920" fill="url(#bg-grad)" />

  <!-- Background Grid with Opacity on Child -->
  <g class="a ani-bg">
    <g opacity="0.15">
      <path d="M 0,300 L 1080,300 M 0,600 L 1080,600 M 0,900 L 1080,900 M 0,1200 L 1080,1200 M 0,1500 L 1080,1500" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
    </g>
  </g>

  <!-- Persistent Brand Mark -->
  <g class="brand-mark" transform="translate(72, 100)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
    <path d="M14 24 L22 32 L34 16" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" letter-spacing="1">CreatorOS</text>
  </g>

  <!-- Headlines -->
  <g transform="translate(540, 260)">
    <text class="a ani-headline" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-weight="900" font-size="84" fill="#F8FAFC" letter-spacing="-1">
      Build faster today
    </text>
    <text class="a ani-support" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="40" fill="#22C55E" y="85">
      creatoros.in | @creatoros
    </text>
  </g>

  <!-- HERO ELEMENT: Isometric Studio Cube Centered -->
  <g transform="translate(540, 780)">
    <g class="a ani-cube" filter="url(#neon-green)">
      <!-- Cube Top Face -->
      <path d="M 0,-140 L 180,-50 L 0,40 L -180,-50 Z" fill="url(#cube-top)" stroke="#34D399" stroke-width="2" />
      
      <!-- Cube Left Face -->
      <path d="M -180,-50 L 0,40 L 0,220 L -180,130 Z" fill="url(#cube-left)" stroke="#6366F1" stroke-width="2" />

      <!-- Cube Right Face -->
      <path d="M 180,-50 L 0,40 L 0,220 L 180,130 Z" fill="url(#cube-right)" stroke="#6366F1" stroke-width="2" />

      <!-- Holographic Play Button Floating on Top -->
      <g transform="translate(0, -50)">
        <polygon points="0,-45 40,-20 40,30 0,55 -40,30 -40,-20" fill="#1E293B" stroke="#22C55E" stroke-width="3" filter="url(#shadow)" />
        <path d="M-12 -18 L16 0 L-12 18 Z" fill="#22C55E" />
      </g>
    </g>

    <!-- Large Green Checkmark Pulsing Over Studio Cube -->
    <g transform="translate(0, -30)"><g class="a ani-check" filter="url(#shadow)">
      <circle cx="0" cy="0" r="54" fill="#22C55E" fill-opacity="0.95" stroke="#F8FAFC" stroke-width="4" />
      <path d="M-18 -2 L-6, 12 L20,-14" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g></g>
  </g>

  <!-- Success Metric Badges (Floating Left & Right) -->
  <g transform="translate(0, 0)">
    <!-- Metric Badge Left: Time Saved -->
    <g transform="translate(250, 680)"><g class="a ani-metric-1">
      <rect x="-130" y="-45" width="260" height="90" rx="20" fill="url(#panel-grad)" stroke="#22C55E" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-85" cy="0" r="16" fill="#22C55E" fill-opacity="0.2" />
      <path d="M-92 0 L-88 5 L-78 -6" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="-55" y="-6" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Time Saved</text>
      <text x="-55" y="18" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="22" fill="#22C55E">15+ hrs / wk</text>
    </g></g>

    <!-- Metric Badge Right: Cost Reduction -->
    <g transform="translate(830, 680)"><g class="a ani-metric-2">
      <rect x="-130" y="-45" width="260" height="90" rx="20" fill="url(#panel-grad)" stroke="#A855F7" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-85" cy="0" r="16" fill="#A855F7" fill-opacity="0.2" />
      <path d="M-93 -5 C-93 -10 -77 -10 -77 -5 C-77 0 -93 0 -93 5 C-93 10 -77 10 -77 5 M-85 -12 L-85 12" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
      <text x="-55" y="-6" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Costs Cut</text>
      <text x="-55" y="18" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="22" fill="#A855F7">-80% Expenses</text>
    </g></g>
  </g>

  <!-- Bold Call-to-Action Button at Bottom -->
  <g transform="translate(540, 1100)"><g class="a ani-cta">
    <rect x="-320" y="-45" width="640" height="90" rx="45" fill="url(#btn-grad)" stroke="#F8FAFC" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="8" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="32" fill="#F8FAFC" letter-spacing="1">
      CLAIM YOUR FREE TRIAL
    </text>
  </g></g>

  <!-- Left Stub (Seamless continuation from Scene 2 right stub) -->
  <rect class="ribbon-stub-left" x="0" y="1232" width="1080" height="32" fill="#6366F1" opacity="0.3" />

  <!-- Ribbon Seam Link (Active animated middle) -->
  <g class="a ani-ribbon">
    <path d="M 0 1248 C 250 1248, 400 1200, 540 1200 C 680 1200, 830 1248, 1080 1248" fill="none" stroke="#6366F1" stroke-width="32" stroke-linecap="round" filter="url(#shadow)" opacity="0.4" />
  </g>
</svg>