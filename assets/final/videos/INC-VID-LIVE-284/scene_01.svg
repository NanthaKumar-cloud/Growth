<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Poppins:wght@700;900&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }
      
      .bg-rect { opacity: 1 !important; }
      .brand-mark { opacity: 1 !important; }
      .ribbon-stub { opacity: 1 !important; }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.3); }
        70% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatLeft {
        0% { opacity: 0; transform: translate(100px, 30px) rotate(15deg); }
        20% { opacity: 1; }
        100% { opacity: 1; transform: translate(0px, 0px) rotate(-4deg); }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        20% { transform: translateX(-6px) rotate(-3deg); }
        40% { transform: translateX(6px) rotate(3deg); }
        60% { transform: translateX(-4px) rotate(-2deg); }
        80% { transform: translateX(4px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4)); }
        50% { filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.8)); }
      }

      .ani-bg { animation: fadeUp 0.8s ease-out 0s forwards; }
      .ani-headline { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards; }
      .ani-support { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards; }
      
      .ani-card-1 { animation: floatLeft 0.7s cubic-bezier(0.34,1.56,0.64,0.55) 0.55s forwards, floatSlow 4s ease-in-out 1.25s infinite; }
      .ani-card-2 { animation: floatLeft 0.7s cubic-bezier(0.34,1.56,0.64,0.55) 0.95s forwards, floatSlow 4.5s ease-in-out 1.65s infinite; }
      .ani-card-3 { animation: floatLeft 0.7s cubic-bezier(0.34,1.56,0.64,0.55) 1.35s forwards, floatSlow 3.8s ease-in-out 2.05s infinite; }
      .ani-card-4 { animation: floatLeft 0.7s cubic-bezier(0.34,1.56,0.64,0.55) 1.75s forwards, floatSlow 4.2s ease-in-out 2.45s infinite; }

      .ani-shake-1 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, shake 0.6s ease-in-out 1.2s infinite; }
      .ani-shake-2 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards, shake 0.6s ease-in-out 1.5s infinite; }
      .ani-shake-3 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards, shake 0.6s ease-in-out 1.8s infinite; }
      .ani-shake-4 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.4s forwards, shake 0.6s ease-in-out 2.1s infinite; }

      .ani-ribbon { animation: fadeUp 0.8s ease-out 0.3s forwards; }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#161B2E" />
      <stop offset="100%" stop-color="#0D0F18" />
    </radialGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neon-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="1080" height="1920" fill="url(#bg-grad)" />

  <!-- Background Grid with Opacity on Child -->
  <g class="a ani-bg">
    <g opacity="0.15">
      <path d="M 0,300 L 1080,300 M 0,600 L 1080,600 M 0,900 L 1080,900 M 0,1200 L 1080,1200 M 0,1500 L 1080,1500" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 8" />
    </g>
  </g>

  <!-- Persistent Brand Mark -->
  <g class="brand-mark" transform="translate(72, 100)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
    <path d="M14 24 L22 32 L34 16" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" letter-spacing="1">CreatorOS</text>
  </g>

  <!-- Headlines -->
  <g transform="translate(540, 260)">
    <text class="a ani-headline" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-weight="900" font-size="76" fill="#F8FAFC" letter-spacing="-1">
      Stop the subscription leak
    </text>
    <text class="a ani-support" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="38" fill="#EF4444" y="80">
      $100/mo wasted on 4 fragmented tools
    </text>
  </g>

  <!-- Floating App/Cash Icons (Shaking) -->
  <g transform="translate(540, 560)">
    <g transform="translate(-240, -40)"><g class="a ani-shake-1">
      <rect x="-55" y="-55" width="110" height="110" rx="28" fill="#1E293B" stroke="#EF4444" stroke-width="3" filter="url(#shadow)" />
      <path d="M-18 -18 L18 0 L-18 18 Z" fill="#EF4444" />
      <text x="0" y="75" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">$25/mo</text>
    </g></g>

    <g transform="translate(-80, -90)"><g class="a ani-shake-2">
      <rect x="-55" y="-55" width="110" height="110" rx="28" fill="#1E293B" stroke="#EF4444" stroke-width="3" filter="url(#shadow)" />
      <path d="M-22 5 C-22 -8 -10 -15 0 -10 C8 -18 22 -12 22 0 C28 2 30 12 25 18 C-25 18 -25 10 -22 5 Z" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="0" y="75" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">$25/mo</text>
    </g></g>

    <g transform="translate(80, -90)"><g class="a ani-shake-3">
      <rect x="-55" y="-55" width="110" height="110" rx="28" fill="#1E293B" stroke="#EF4444" stroke-width="3" filter="url(#shadow)" />
      <path d="M-18 -12 C-18 -20 18 -20 18 -12 C18 -4 8 2 0 10 C-8 2 -18 -4 -18 -12 Z" fill="#EF4444" />
      <text x="0" y="75" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">$25/mo</text>
    </g></g>

    <g transform="translate(240, -40)"><g class="a ani-shake-4">
      <rect x="-55" y="-55" width="110" height="110" rx="28" fill="#1E293B" stroke="#EF4444" stroke-width="3" filter="url(#shadow)" />
      <path d="M-20 15 L-20 5 M-7 15 L-7 -5 M6 15 L-6 2 M19 15 L19 -15" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
      <text x="0" y="75" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">$25/mo</text>
    </g></g>
  </g>

  <!-- Flying Invoice Cards -->
  <g transform="translate(0, 0)">
    <g transform="translate(220, 880)"><g class="a ani-card-1">
      <rect x="-170" y="-100" width="340" height="200" rx="24" fill="url(#card-grad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-110" cy="-40" r="24" fill="#EF4444" fill-opacity="0.2" />
      <path d="M-118 -40 L-102 -40 M-110 -48 L-110 -32" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="-70" y="-48" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">CloudStorage Pro</text>
      <text x="-70" y="-18" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Monthly Auto-Debit</text>
      <line x1="-130" y1="10" x2="130" y2="10" stroke="#334155" stroke-width="2" />
      <text x="-130" y="55" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">Due Today</text>
      <text x="130" y="58" text-anchor="end" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="32" fill="#EF4444">-$25.00</text>
    </g></g>

    <g transform="translate(620, 800)"><g class="a ani-card-2">
      <rect x="-170" y="-100" width="340" height="200" rx="24" fill="url(#card-grad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-110" cy="-40" r="24" fill="#EF4444" fill-opacity="0.2" />
      <path d="M-118 -40 L-102 -40 M-110 -48 L-110 -32" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="-70" y="-48" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">StreamYard Plus</text>
      <text x="-70" y="-18" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Monthly Auto-Debit</text>
      <line x1="-130" y1="10" x2="130" y2="10" stroke="#334155" stroke-width="2" />
      <text x="-130" y="55" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">Due Today</text>
      <text x="130" y="58" text-anchor="end" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="32" fill="#EF4444">-$25.00</text>
    </g></g>

    <g transform="translate(320, 1140)"><g class="a ani-card-3">
      <rect x="-170" y="-100" width="340" height="200" rx="24" fill="url(#card-grad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-110" cy="-40" r="24" fill="#EF4444" fill-opacity="0.2" />
      <path d="M-118 -40 L-102 -40 M-110 -48 L-110 -32" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="-70" y="-48" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">MailerHub Suite</text>
      <text x="-70" y="-18" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Monthly Auto-Debit</text>
      <line x1="-130" y1="10" x2="130" y2="10" stroke="#334155" stroke-width="2" />
      <text x="-130" y="55" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">Due Today</text>
      <text x="130" y="58" text-anchor="end" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="32" fill="#EF4444">-$25.00</text>
    </g></g>

    <g transform="translate(700, 1070)"><g class="a ani-card-4">
      <rect x="-170" y="-100" width="340" height="200" rx="24" fill="url(#card-grad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)" />
      <circle cx="-110" cy="-40" r="24" fill="#EF4444" fill-opacity="0.2" />
      <path d="M-118 -40 L-102 -40 M-110 -48 L-110 -32" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="-70" y="-48" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">ScheduleApp X</text>
      <text x="-70" y="-18" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Monthly Auto-Debit</text>
      <line x1="-130" y1="10" x2="130" y2="10" stroke="#334155" stroke-width="2" />
      <text x="-130" y="55" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8">Due Today</text>
      <text x="130" y="58" text-anchor="end" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="32" fill="#EF4444">-$25.00</text>
    </g></g>
  </g>

  <!-- Ribbon Seam Link -->
  <g class="a ani-ribbon">
    <path d="M 0 1248 C 300 1248, 400 1210, 540 1210 C 680 1210, 780 1248, 907 1248" fill="none" stroke="#6366F1" stroke-width="32" stroke-linecap="round" filter="url(#shadow)" />
  </g>

  <!-- Right Stub (Static pixel alignment for transition) -->
  <rect class="ribbon-stub" x="907" y="1232" width="173" height="32" fill="#6366F1" />
</svg>