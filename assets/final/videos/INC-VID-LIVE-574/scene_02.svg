<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&amp;family=Inter:wght@400;700&amp;display=swap');
.a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }

/* General entrance animations */
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

/* Scene-specific animations */
@keyframes thoughtBubbleFadeOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.7); }
}
@keyframes appConverge1 {
    0% { opacity: 1; transform: translate(100px, -50px) scale(1); }
    100% { opacity: 0; transform: translate(450px, 900px) scale(0.2); }
}
@keyframes appConverge2 {
    0% { opacity: 1; transform: translate(-80px, 80px) scale(1); }
    100% { opacity: 0; transform: translate(500px, 905px) scale(0.2); }
}
@keyframes appConverge3 {
    0% { opacity: 1; transform: translate(120px, 120px) scale(1); }
    100% { opacity: 0; transform: translate(550px, 900px) scale(0.2); }
}
@keyframes appConverge4 {
    0% { opacity: 1; transform: translate(-100px, -100px) scale(1); }
    100% { opacity: 0; transform: translate(500px, 895px) scale(0.2); }
}
@keyframes laptopScreenOn {
    0% { opacity: 0.1; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes creatorLookUp {
    0% { transform: rotateX(0deg) translateY(0); }
    100% { transform: rotateX(-5deg) translateY(-5px); }
}
@keyframes creatorSmile {
    0% { d: path('M -20 0 Q 0 10 20 0'); } /* Straight mouth */
    100% { d: path('M -20 0 Q 0 20 20 0'); } /* Smiling mouth */
}

/* Idle loops */
@keyframes subtleFloat {
    0% { transform: translate(0, 0); }
    50% { transform: translate(0, -5px); }
    100% { transform: translate(0, 0); }
}
@keyframes dashboardPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.005); }
    100% { transform: scale(1); }
}

.aniThoughtBubble { animation: thoughtBubbleFadeOut 0.3s ease-out 0.2s forwards; }

.aniApp1 { animation: appConverge1 2.0s ease-in-out 0.55s forwards; }
.aniApp2 { animation: appConverge2 2.2s ease-in-out 0.65s forwards; }
.aniApp3 { animation: appConverge3 2.1s ease-in-out 0.75s forwards; }
.aniApp4 { animation: appConverge4 2.3s ease-in-out 0.85s forwards; }

.aniLaptopScreen { animation: laptopScreenOn 1.0s ease-out 2.8s forwards, dashboardPulse 4s ease-in-out 3.8s infinite alternate; }
.aniDashboardElement1 { animation: slideUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 3.0s forwards, dashboardPulse 4s ease-in-out 3.8s infinite alternate; }
.aniDashboardElement2 { animation: slideUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 3.2s forwards, dashboardPulse 4s ease-in-out 4.0s infinite alternate; }
.aniDashboardElement3 { animation: slideUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 3.4s forwards, dashboardPulse 4s ease-in-out 4.2s infinite alternate; }

.aniCreatorHead { animation: creatorLookUp 0.8s ease-in-out 4.8s forwards; }
.aniCreatorMouth { animation: creatorSmile 0.8s ease-in-out 4.8s forwards; }
.aniCreatorBob { animation: subtleFloat 3s ease-in-out 5.6s infinite alternate; }

.aniHeadline { animation: slideUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 5.0s forwards; }
.aniSupportText { animation: slideUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 5.3s forwards; }

@media (prefers-reduced-motion: reduce) { .a { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>
<defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E0E0E0" />
        <stop offset="100%" stop-color="#C0C0C0" />
    </linearGradient>
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#F8F8F8" />
    </linearGradient>
    <linearGradient id="creatorShirtGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4CAF50" />
        <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
    <linearGradient id="creatorSkinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFDAB9" />
        <stop offset="100%" stop-color="#E0B080" />
    </linearGradient>
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2196F3" />
        <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
</defs>

<rect width="1080" height="1920" fill="#F8F8F8" />


<text x="72" y="100" font-size="32" font-weight="700" fill="#333333" font-family="'Poppins', Arial, sans-serif">CreatorOps</text>


<rect x="0" y="1190" width="173" height="36" fill="url(#ribbonGradient)" />
<rect x="907" y="1190" width="173" height="36" fill="url(#ribbonGradient)" />


<path d="M 173 1208 C 250 1180, 400 1150, 540 1190 S 830 1240, 907 1208" fill="url(#ribbonGradient)" filter="url(#shadow)" />


<g transform="translate(540, 1000)"> 

    
    <rect x="-300" y="0" width="600" height="80" rx="28" fill="url(#deskGradient)" filter="url(#shadow)" />
    <rect x="-280" y="80" width="560" height="20" fill="#E0E0E0" /> 
    <rect x="-200" y="100" width="400" height="200" fill="#D0D0D0" rx="12" /> 

    
    <rect x="-180" y="-120" width="360" height="200" rx="18" fill="url(#laptopGradient)" filter="url(#shadow)" />
    <rect x="-170" y="-110" width="340" height="190" rx="14" fill="#333333" /> 

    
    <g class="a aniLaptopScreen">
        <rect x="-160" y="-100" width="320" height="180" rx="10" fill="#FFFFFF" />
        
        <g transform="translate(0, 0)">
            
            <rect x="-140" y="-80" width="130" height="80" rx="8" fill="#F0F0F0" class="a aniDashboardElement1" />
            <rect x="-130" y="-70" width="30" height="40" rx="4" fill="#4CAF50" class="a aniDashboardElement1" />
            <rect x="-90" y="-50" width="30" height="60" rx="4" fill="#2196F3" class="a aniDashboardElement1" />
            <rect x="-50" y="-60" width="30" height="50" rx="4" fill="#FFC107" class="a aniDashboardElement1" />

            
            <rect x="10" y="-80" width="130" height="80" rx="8" fill="#F0F0F0" class="a aniDashboardElement2" />
            <rect x="20" y="-65" width="100" height="12" rx="4" fill="#E0E0E0" class="a aniDashboardElement2" />
            <rect x="20" y="-45" width="80" height="12" rx="4" fill="#E0E0E0" class="a aniDashboardElement2" />
            <rect x="20" y="-25" width="100" height="12" rx="4" fill="#E0E0E0" class="a aniDashboardElement2" />

            
            <rect x="-140" y="20" width="280" height="40" rx="8" fill="#F0F0F0" class="a aniDashboardElement3" />
            <rect x="-130" y="30" width="260" height="20" rx="6" fill="#E0E0E0" class="a aniDashboardElement3" />
            <rect x="-130" y="30" width="180" height="20" rx="6" fill="#4CAF50" class="a aniDashboardElement3" />
            <text x="0" y="45" text-anchor="middle" font-size="16" fill="#FFFFFF" font-family="'Inter', Arial, sans-serif" class="a aniDashboardElement3">75% Complete</text>
        </g>
    </g>

    
    <g class="a aniCreatorBob">
        <g opacity="1"> 
            
            <rect x="-80" y="-150" width="160" height="180" rx="28" fill="url(#creatorShirtGradient)" />
            
            <g class="a aniCreatorHead">
                <circle cx="0" cy="-250" r="60" fill="url(#creatorSkinGradient)" />
                
                <path d="M -60 -270 C -80 -300, 80 -300, 60 -270 L 60 -240 C 60 -210, -60 -210, -60 -240 Z" fill="#333333" />
                
                <circle cx="-25" cy="-260" r="5" fill="#333333" />
                <circle cx="25" cy="-260" r="5" fill="#333333" />
                
                <g transform="translate(0, -230)"><path d="M -20 0 Q 0 10 20 0" stroke="#333333" stroke-width="4" fill="none" class="a aniCreatorMouth" />
            </g></g>
            
            <rect x="-130" y="-100" width="50" height="100" rx="20" fill="url(#creatorShirtGradient)" transform="rotate(-15 -105 -50)" />
            <rect x="80" y="-100" width="50" height="100" rx="20" fill="url(#creatorShirtGradient)" transform="rotate(15 105 -50)" />
            
            <circle cx="-140" cy="-20" r="20" fill="url(#creatorSkinGradient)" />
            <circle cx="140" cy="-20" r="20" fill="url(#creatorSkinGradient)" />
        </g>
    </g>

    
    <g transform="translate(70, -350)"><g class="a aniThoughtBubble">
        <g opacity="1"> 
            <path d="M 0 0 Q 30 -30 60 0 Q 70 -50 40 -80 Q 10 -110 -20 -80 Q -50 -50 -40 0 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="4" />
            <text x="0" y="-45" text-anchor="middle" font-size="28" font-weight="700" fill="#FFC107" font-family="'Inter', Arial, sans-serif">₹100+</text>
        </g>
    </g>

    
    
    </g><g transform="translate(-250, -400)"><g class="a aniApp1">
        <g opacity="1"> 
            <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#FFC107" />
            <rect x="-20" y="-20" width="40" height="10" rx="4" fill="#FFFFFF" />
            <text x="0" y="10" text-anchor="middle" font-size="24" fill="#FFFFFF" font-family="'Inter', Arial, sans-serif">15</text>
        </g>
    </g>
    
    </g><g transform="translate(200, -300)"><g class="a aniApp2">
        <g opacity="1"> 
            <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#2196F3" />
            <rect x="-20" y="-15" width="40" height="8" rx="2" fill="#FFFFFF" />
            <rect x="-20" y="0" width="30" height="8" rx="2" fill="#FFFFFF" />
            <rect x="-20" y="15" width="40" height="8" rx="2" fill="#FFFFFF" />
        </g>
    </g>
    
    </g><g transform="translate(-300, -100)"><g class="a aniApp3">
        <g opacity="1"> 
            <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#4CAF50" />
            <path d="M -20 10 L -5 -5 L 10 5 L 20 -10" stroke="#FFFFFF" stroke-width="4" fill="none" />
            <path d="M 20 -10 L 15 -10 L 20 -15 L 20 -10 Z" fill="#FFFFFF" />
        </g>
    </g>
    
    </g><g transform="translate(280, 0)"><g class="a aniApp4">
        <g opacity="1"> 
            <path d="M -30 -30 H 30 V 10 H 10 L 0 20 L -10 10 H -30 Z" rx="12" ry="12" fill="#FFC107" />
            <circle cx="-15" cy="-10" r="4" fill="#FFFFFF" />
            <circle cx="0" cy="-10" r="4" fill="#FFFFFF" />
            <circle cx="15" cy="-10" r="4" fill="#FFFFFF" />
        </g>
    </g>
</g></g>


<g class="a aniHeadline">
    <text x="540" y="280" text-anchor="middle" font-size="88" font-weight="800" fill="#333333" font-family="'Poppins', Arial, sans-serif">One Studio.</text>
    <text x="540" y="385" text-anchor="middle" font-size="88" font-weight="800" fill="#333333" font-family="'Poppins', Arial, sans-serif">Total Control.</text>
</g>


<g class="a aniSupportText">
    <text x="540" y="490" text-anchor="middle" font-size="44" fill="#2196F3" font-family="'Inter', Arial, sans-serif">Simplify Your Workflow Instantly.</text>
</g>

</svg>