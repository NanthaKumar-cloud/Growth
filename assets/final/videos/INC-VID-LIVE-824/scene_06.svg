<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-fill { fill: #0D1117; }
  .text-ink { fill: #F0F6FC; }
  .text-paper { fill: #8B949E; }
  .text-primary { fill: #58A6FF; }
  .text-secondary { fill: #3FB950; }

  .a {
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes scalePop {
    0% { opacity: 0; transform: scale(0.7); }
    70% { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes ribbonWave {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-6px) scaleX(1.04); }
  }

  @keyframes floatSlow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(88,166,255,0.4)); }
    50% { transform: scale(1.04); filter: drop-shadow(0 0 35px rgba(63,185,80,0.7)); }
  }

  @keyframes pulseButton {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(63,185,80, 0.4); }
    50% { transform: scale(1.02); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <filter id="glow-primary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="glow-secondary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
  </filter>

  <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>

  <linearGradient id="orb-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#58A6FF" />
    <stop offset="50%" stop-color="#1F6FEB" />
    <stop offset="100%" stop-color="#3FB950" />
  </linearGradient>

  <linearGradient id="btn-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#238636" />
    <stop offset="100%" stop-color="#2EA043" />
  </linearGradient>

  <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
    <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#3FB950" stop-opacity="0" />
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1080" height="1920" class="bg-fill" />

<!-- Background grid lines -->
<g class="a" style="animation: fadeIn 1s ease-out 0.1s forwards;">
  <path d="M0 320 H1080 M0 640 H1080 M0 960 H1080 M0 1280 H1080 M0 1600 H1080" stroke="#21262D" stroke-width="2" />
  <path d="M216 0 V1920 M432 0 V1920 M648 0 V1920 M864 0 V1920" stroke="#21262D" stroke-width="2" />
</g>

<!-- Persistent brand mark -->
<g transform="translate(80, 80)">
  <circle cx="20" cy="20" r="16" fill="#58A6FF" opacity="0.2" />
  <circle cx="20" cy="20" r="8" fill="#58A6FF" />
  <text x="52" y="27" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#F0F6FC" letter-spacing="1">CreatorOps</text>
</g>

<!-- Localized Ribbon Accent near center -->
<g transform="translate(390, 1280)">
  <g class="a" style="animation: fadeIn 0.8s ease-out 0.2s forwards;">
    <path d="M 0 16 Q 150 -16 300 16" fill="none" stroke="url(#ribbon-grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow-primary)" style="animation: ribbonWave 4s ease-in-out infinite;" />
  </g>
</g>

<!-- HERO ORB (Front and center, radiating warm cyan/green aura) -->
<g transform="translate(540, 520)">
  <g class="a" style="animation: scalePop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards, floatSlow 5s ease-in-out infinite 0.8s;">
    <!-- Outer Aura Rings -->
    <circle cx="0" cy="0" r="140" fill="#58A6FF" opacity="0.1" filter="url(#glow-primary)" />
    <circle cx="0" cy="0" r="100" fill="#3FB950" opacity="0.15" filter="url(#glow-secondary)" />
    
    <!-- Central Orb Body -->
    <circle cx="0" cy="0" r="70" fill="url(#orb-grad)" filter="url(#glow-primary)" style="animation: pulseGlow 3s ease-in-out infinite;" />
    <circle cx="0" cy="0" r="55" fill="#0D1117" opacity="0.3" />

    <!-- Inner Core Icon / Sparkle -->
    <path d="M 0 -30 L 8 -8 L 30 0 L 8 8 L 0 30 L -8 8 L -30 0 L -8 -8 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" />
  </g>
</g>

<!-- TYPOGRAPHY / HEADLINE (Scene Focus) -->
<g transform="translate(540, 780)">
  <!-- Headline -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;">
    <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="72" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="-1">Start Free Trial</text>
  </g>

  <!-- Supporting text (URL and Handle) -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards;">
    <text x="0" y="70" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="600" fill="#3FB950" text-anchor="middle" filter="url(#glow-secondary)">creatorops.in  |  @creatorops</text>
  </g>
</g>

<!-- CALL TO ACTION BUTTON (Prominent pulsing button) -->
<g transform="translate(540, 1040)">
  <g class="a" style="animation: scalePop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards, pulseButton 2s ease-in-out infinite 1.4s;">
    <rect x="-310" y="-45" width="620" height="90" rx="45" fill="url(#btn-grad)" filter="url(#glow-secondary)" />
    <text x="0" y="10" font-family="'Poppins', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Get Started Free Now</text>
  </g>
</g>

<!-- SUPPORTING BADGE / TRUST PILL -->
<g transform="translate(540, 1220)">
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.75s forwards;">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#161B22" stroke="#30363D" stroke-width="2" filter="url(#card-shadow)" />
    <text x="0" y="8" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="500" fill="#8B949E" text-anchor="middle">No credit card required · Instant access</text>
  </g>
</g>

</svg>