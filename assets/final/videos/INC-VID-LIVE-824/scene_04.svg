<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-fill { fill: #161B22; }
  .text-ink { fill: #F0F6FC; }
  .text-paper { fill: #8B949E; }
  .text-primary { fill: #58A6FF; }
  .text-secondary { fill: #3FB950; }

  .a {
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes slideUpPanel {
    0% { opacity: 0; transform: translateY(80px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes chartGrow {
    0% { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }

  @keyframes checkFlash {
    0% { opacity: 0; transform: scale(0.5); }
    60% { transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes ribbonWave {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-5px) scaleX(1.03); }
  }

  @keyframes floatUI {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <filter id="glow-primary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="glow-secondary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
  </filter>

  <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>

  <linearGradient id="panel-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1f242d" />
    <stop offset="100%" stop-color="#11161d" />
  </linearGradient>

  <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
    <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#3FB950" stop-opacity="0" />
  </linearGradient>

  <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3FB950" stop-opacity="0.5" />
    <stop offset="100%" stop-color="#3FB950" stop-opacity="0.0" />
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1080" height="1920" class="bg-fill" />

<!-- Background grid lines for technical minimal look -->
<g class="a" style="animation: fadeIn 1s ease-out 0.1s forwards;">
  <path d="M0 320 H1080 M0 640 H1080 M0 960 H1080 M0 1280 H1080 M0 1600 H1080" stroke="#21262D" stroke-width="2" />
  <path d="M216 0 V1920 M432 0 V1920 M648 0 V1920 M864 0 V1920" stroke="#21262D" stroke-width="2" />
</g>

<!-- Persistent brand mark -->
<g transform="translate(80, 80)">
  <circle cx="20" cy="20" r="16" fill="#58A6FF" opacity="0.2" />
  <circle cx="20" cy="20" r="8" fill="#58A6FF" />
  <text x="52" y="27" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#F0F6FC" letter-spacing="1">CreatorOps</text>
</g>

<!-- Localized Ribbon Accent -->
<g transform="translate(390, 1500)">
  <g class="a" style="animation: fadeIn 0.8s ease-out 0.2s forwards;">
    <path d="M 0 16 Q 150 -16 300 16" fill="none" stroke="url(#ribbon-grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow-primary)" style="animation: ribbonWave 4s ease-in-out infinite;" />
  </g>
</g>

<!-- MAIN DASHBOARD INTERFACE MOCKUP (Opens from Hub Orb expansion) -->
<g transform="translate(540, 720)">
  
  <g class="a" style="animation: slideUpPanel 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.25s forwards, floatUI 6s ease-in-out infinite 1s;">
    <!-- Main Window Container -->
    <rect x="-440" y="-450" width="880" height="780" rx="28" fill="url(#panel-grad)" stroke="#30363D" stroke-width="3" filter="url(#card-shadow)" />
    
    <!-- Window Header Bar -->
    <path d="M -440 -394 H 440" stroke="#30363D" stroke-width="2" />
    <circle cx="-404" cy="-422" r="7" fill="#F85149" />
    <circle cx="-380" cy="-422" r="7" fill="#E3B341" />
    <circle cx="-356" cy="-422" r="7" fill="#3FB950" />
    
    <!-- Window Title -->
    <text x="-320" y="-414" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="600" fill="#8B949E">CreatorOps // lightning-dashboard.io</text>

    <!-- SIDEBAR NAVIGATION -->
    <path d="M -260 -394 V 330" stroke="#21262D" stroke-width="2" />
    <g transform="translate(-350, -340)">
      <!-- Nav items -->
      <rect x="0" y="0" width="60" height="10" rx="5" fill="#58A6FF" />
      <rect x="0" y="35" width="45" height="10" rx="5" fill="#30363D" />
      <rect x="0" y="70" width="50" height="10" rx="5" fill="#30363D" />
      <rect x="0" y="105" width="35" height="10" rx="5" fill="#30363D" />
      
      <circle cx="30" cy="220" r="18" fill="#21262D" stroke="#30363D" stroke-width="2" />
      <path d="M 24 220 L 28 224 L 38 214" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- DASHBOARD CONTENT AREA -->
    <g transform="translate(-220, -350)">

      <!-- WORKFLOW ROW 1: Content Management -->
      <g transform="translate(30, 20)">
        <rect x="0" y="0" width="600" height="90" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
        <circle cx="45" cy="45" r="22" fill="#58A6FF" opacity="0.15" />
        <path d="M 38 35 H 52 V 55 H 38 Z" fill="none" stroke="#58A6FF" stroke-width="2.5" rx="4" />
        <path d="M 35 40 L 45 48 L 55 40" fill="none" stroke="#58A6FF" stroke-width="2" />
        
        <text x="85" y="38" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#F0F6FC">Auto-Publish Video Reel</text>
        <text x="85" y="65" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="400" fill="#8B949E">Scheduled across TikTok, YT Shorts &amp; IG</text>
        
        <!-- Flash Checkmark 1 -->
        <g transform="translate(535, 45)">
          <g class="a" style="animation: checkFlash 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards;">
            <circle cx="0" cy="0" r="18" fill="#3FB950" opacity="0.2" />
            <circle cx="0" cy="0" r="14" fill="#3FB950" />
            <path d="M -5 0 L -1 4 L 6 -3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>
      </g>

      <!-- WORKFLOW ROW 2: Automation & Client Chats -->
      <g transform="translate(30, 130)">
        <rect x="0" y="0" width="600" height="90" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
        <circle cx="45" cy="45" r="22" fill="#3FB950" opacity="0.15" />
        <path d="M 35 38 C 35 32 40 28 46 28 H 54 C 60 28 65 32 65 38 V 46 C 65 52 60 56 54 56 H 48 L 40 62 V 56 H 35 C 29 56 25 52 25 46 Z" fill="none" stroke="#3FB950" stroke-width="2.5" />
        
        <text x="85" y="38" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#F0F6FC">AI Chat Responder &amp; CRM</text>
        <text x="85" y="65" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="400" fill="#8B949E">Qualifying brand deals &amp; DMs instantly</text>
        
        <!-- Flash Checkmark 2 -->
        <g transform="translate(535, 45)">
          <g class="a" style="animation: checkFlash 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.2s forwards;">
            <circle cx="0" cy="0" r="18" fill="#3FB950" opacity="0.2" />
            <circle cx="0" cy="0" r="14" fill="#3FB950" />
            <path d="M -5 0 L -1 4 L 6 -3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>
      </g>

      <!-- REVENUE STREAM GROWTH CHART -->
      <g transform="translate(30, 240)">
        <rect x="0" y="0" width="600" height="150" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
        
        <text x="30" y="38" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Revenue Streams</text>
        <text x="300" y="38" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="800" fill="#3FB950" text-anchor="end">+$24,850.00</text>
        <text x="325" y="38" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#8B949E">this month</text>

        <!-- Chart Area -->
        <g transform="translate(30, 50)">
          <!-- Background Grid lines -->
          <line x1="0" y1="70" x2="540" y2="70" stroke="#21262D" stroke-width="1" />
          <line x1="0" y1="35" x2="540" y2="35" stroke="#21262D" stroke-width="1" />

          <!-- Growth Area Fill -->
          <path d="M 0 70 L 0 50 Q 120 40 200 30 T 400 15 T 540 5 L 540 70 Z" fill="url(#chart-grad)" />

          <!-- Smooth Growing Line -->
          <g class="a" style="animation: chartGrow 1.2s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards;">
            <path d="M 0 50 Q 120 40 200 30 T 400 15 T 540 5" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" filter="url(#glow-secondary)" />
          </g>

          <!-- Data Points -->
          <circle cx="200" cy="30" r="5" fill="#3FB950" />
          <circle cx="400" cy="15" r="5" fill="#3FB950" />
          <circle cx="540" cy="5" r="6" fill="#58A6FF" />
        </g>
      </g>

    </g>

  </g>

</g>

<!-- TYPOGRAPHY / HEADLINE (Scene Focus) -->
<g transform="translate(540, 1260)">
  <!-- Headline -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;">
    <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="64" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="-1">Unified Dashboard</text>
  </g>

  <!-- Supporting text -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards;">
    <text x="0" y="65" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#8B949E" text-anchor="middle">Content, chats, and revenue in one place</text>
  </g>
</g>

</svg>