<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-fill { fill: #0D1117; }
  .text-ink { fill: #F0F6FC; }
  .text-paper { fill: #8B949E; }
  .text-primary { fill: #58A6FF; }
  .text-secondary { fill: #3FB950; }

  .a {
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    70% { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes orbPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(88,166,255,0.4)); }
    50% { transform: scale(1.04); filter: drop-shadow(0 0 45px rgba(63,185,80,0.7)); }
  }

  @keyframes ringRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes ringRotateRev {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-360deg); }
  }

  @keyframes floatModule1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-8px, -12px); }
  }

  @keyframes floatModule2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -10px); }
  }

  @keyframes floatModule3 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-10px, 10px); }
  }

  @keyframes floatModule4 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(12px, 8px); }
  }

  @keyframes ribbonWave {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-5px) scaleX(1.03); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <filter id="glow-primary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="glow-secondary" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
  </filter>

  <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>

  <linearGradient id="orb-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#58A6FF" />
    <stop offset="100%" stop-color="#3FB950" />
  </linearGradient>

  <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
    <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#3FB950" stop-opacity="0" />
  </linearGradient>

  <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1080" height="1920" class="bg-fill" />

<!-- Background grid lines for technical minimal look -->
<g class="a" style="animation: fadeIn 1s ease-out 0.1s forwards;">
  <path d="M0 320 H1080 M0 640 H1080 M0 960 H1080 M0 1280 H1080 M0 1600 H1080" stroke="#161B22" stroke-width="2" />
  <path d="M216 0 V1920 M432 0 V1920 M648 0 V1920 M864 0 V1920" stroke="#161B22" stroke-width="2" />
</g>

<!-- Persistent brand mark -->
<g transform="translate(80, 80)">
  <circle cx="20" cy="20" r="16" fill="#58A6FF" opacity="0.2" />
  <circle cx="20" cy="20" r="8" fill="#58A6FF" />
  <text x="52" y="27" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#F0F6FC" letter-spacing="1">CreatorOps</text>
</g>

<!-- Localized Ribbon Accent -->
<g transform="translate(390, 1250)">
  <g class="a" style="animation: fadeIn 0.8s ease-out 0.2s forwards;">
    <path d="M 0 16 Q 150 -16 300 16" fill="none" stroke="url(#ribbon-grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow-primary)" style="animation: ribbonWave 4s ease-in-out infinite;" />
  </g>
</g>

<!-- CENTRAL HERO ORB & ORBITING MODULES (Solution Centerpiece) -->
<g transform="translate(540, 720)">

  <!-- Outer Orbit Rings -->
  <g class="a" style="animation: fadeIn 1s ease-out 0.3s forwards;">
    <circle cx="0" cy="0" r="240" fill="none" stroke="#30363D" stroke-width="2" stroke-dasharray="6 6" style="animation: ringRotate 25s linear infinite;" />
    <circle cx="0" cy="0" r="340" fill="none" stroke="#21262D" stroke-width="2" stroke-dasharray="10 10" style="animation: ringRotateRev 35s linear infinite;" />
  </g>

  <!-- Glowing Connection Rays -->
  <g class="a" style="animation: fadeIn 0.8s ease-out 0.35s forwards;">
    <g opacity="0.4">
      <line x1="0" y1="0" x2="-220" y2="-180" stroke="#58A6FF" stroke-width="2" stroke-dasharray="8 8" />
      <line x1="0" y1="0" x2="220" y2="-180" stroke="#3FB950" stroke-width="2" stroke-dasharray="8 8" />
      <line x1="0" y1="0" x2="-220" y2="180" stroke="#3FB950" stroke-width="2" stroke-dasharray="8 8" />
      <line x1="0" y1="0" x2="220" y2="180" stroke="#58A6FF" stroke-width="2" stroke-dasharray="8 8" />
    </g>
  </g>

  <!-- Central Glowing Hero Orb -->
  <g class="a" style="animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;">
    <!-- Outer Glow Halo -->
    <circle cx="0" cy="0" r="130" fill="url(#orb-grad)" opacity="0.25" filter="url(#glow-primary)" style="animation: orbPulse 3s ease-in-out infinite;" />
    
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#orb-grad)" stroke-width="4" opacity="0.6" />

    <!-- Core Orb Body -->
    <circle cx="0" cy="0" r="85" fill="url(#card-grad)" stroke="#58A6FF" stroke-width="3" filter="url(#card-shadow)" />
    
    <!-- Inner Hub Icon (Unified Creator Studio Core) -->
    <path d="M -25 -25 H 25 V 25 H -25 Z" fill="none" stroke="#58A6FF" stroke-width="5" rx="8" />
    <circle cx="0" cy="0" r="22" fill="#3FB950" opacity="0.3" />
    <path d="M -10 -2 L -3 5 L 12 -10" fill="none" stroke="#3FB950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Orbiting Module 1: Scheduling (Top-Left) -->
  <g transform="translate(-220, -180)">
    <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards, floatModule1 5s ease-in-out infinite;">
      <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#58A6FF" stroke-width="2.5" filter="url(#card-shadow)" />
      <!-- Calendar Icon -->
      <path d="M -20 -15 H 20 C 26 -15 30 -11 30 -5 V 20 C 30 26 26 30 20 30 H -20 C -26 30 -30 26 -30 20 V -5 C -30 -11 -26 -15 -20 -15 Z" fill="none" stroke="#58A6FF" stroke-width="3" />
      <path d="M -30 -5 H 30 M -15 -25 V -15 M 15 -25 V -15" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" />
      <circle cx="-10" cy="8" r="3" fill="#3FB950" />
      <circle cx="5" cy="8" r="3" fill="#58A6FF" />
      <circle cx="20" cy="8" r="3" fill="#3FB950" />
    </g>
  </g>

  <!-- Orbiting Module 2: Analytics (Top-Right) -->
  <g transform="translate(220, -180)">
    <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.55s forwards, floatModule2 5.5s ease-in-out infinite;">
      <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#3FB950" stroke-width="2.5" filter="url(#card-shadow)" />
      <!-- Chart Icon -->
      <path d="M -22 22 H 22" stroke="#3FB950" stroke-width="3" stroke-linecap="round" />
      <path d="M -15 12 V -2 M -5 12 V -15 M 5 12 V -4 M 15 12 V -20" stroke="#3FB950" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Orbiting Module 3: Finance (Bottom-Left) -->
  <g transform="translate(-220, 180)">
    <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.65s forwards, floatModule3 6s ease-in-out infinite;">
      <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#3FB950" stroke-width="2.5" filter="url(#card-shadow)" />
      <!-- Wallet / Dollar Icon -->
      <path d="M 20 10 H -18 C -25 10 -30 4 -30 -3 C -30 -10 -25 -16 -18 -16 H 18 C 24 -16 28 -12 28 -6 V 6 C 28 8 24 10 20 10 Z" fill="none" stroke="#3FB950" stroke-width="3" />
      <circle cx="12" cy="-3" r="3" fill="#58A6FF" />
    </g>
  </g>

  <!-- Orbiting Module 4: Content Studio (Bottom-Right) -->
  <g transform="translate(220, 180)">
    <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.75s forwards, floatModule4 5.8s ease-in-out infinite;">
      <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#58A6FF" stroke-width="2.5" filter="url(#card-shadow)" />
      <!-- Play / Video Sparkle Icon -->
      <path d="M -12 -20 L 16 0 L -12 20 Z" fill="none" stroke="#58A6FF" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="14" cy="-14" r="4" fill="#3FB950" />
    </g>
  </g>

</g>

<!-- TYPOGRAPHY / HEADLINE (Solution Statement) -->
<g transform="translate(540, 1420)">
  <!-- Headline -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards;">
    <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="64" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="-1">CreatorOps Studio</text>
  </g>

  <!-- Supporting text -->
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.55s forwards;">
    <text x="0" y="65" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#8B949E" text-anchor="middle">The ultimate all-in-one platform for 2026</text>
  </g>
</g>

</svg>