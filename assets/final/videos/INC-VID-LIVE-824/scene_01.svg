<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-fill { fill: #0D1117; }
  .text-ink { fill: #F0F6FC; }
  .text-paper { fill: #8B949E; }
  .text-primary { fill: #58A6FF; }
  .text-accent { fill: #F85149; }
  .text-secondary { fill: #3FB950; }

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  /* Keyframes */
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    70% { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes floatApp1 {
    0%, 100% { transform: translate(0, 0) rotate(-6deg); }
    50% { transform: translate(-12px, -18px) rotate(-8deg); }
  }

  @keyframes floatApp2 {
    0%, 100% { transform: translate(0, 0) rotate(8deg); }
    50% { transform: translate(15px, 12px) rotate(10deg); }
  }

  @keyframes floatApp3 {
    0%, 100% { transform: translate(0, 0) rotate(-4deg); }
    50% { transform: translate(-10px, 15px) rotate(-2deg); }
  }

  @keyframes floatApp4 {
    0%, 100% { transform: translate(0, 0) rotate(5deg); }
    50% { transform: translate(12px, -15px) rotate(3deg); }
  }

  @keyframes pulseAlert {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(248,81,73,0)); }
    50% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(248,81,73,0.6)); }
  }

  @keyframes flyBill1 {
    0% { opacity: 0; transform: translate(0, 0) scale(0.6) rotate(0deg); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-160px, 120px) scale(1.1) rotate(-25deg); }
  }

  @keyframes flyBill2 {
    0% { opacity: 0; transform: translate(0, 0) scale(0.6) rotate(0deg); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(180px, 150px) scale(1.1) rotate(30deg); }
  }

  @keyframes idleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes ribbonWave {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-4px) scaleX(1.02); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  
  <filter id="glow-accent" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="glow-primary" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  
  <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
  </filter>

  
  <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>

  <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F85149" />
    <stop offset="100%" stop-color="#DA3633" />
  </linearGradient>

  <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#58A6FF" />
    <stop offset="100%" stop-color="#1F6FEB" />
  </linearGradient>

  <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
    <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8" />
    <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#3FB950" stop-opacity="0" />
  </linearGradient>
</defs>


<rect width="1080" height="1920" class="bg-fill" />


<g class="a" style="animation: fadeIn 1s ease-out 0.1s forwards;">
  <path d="M0 320 H1080 M0 640 H1080 M0 960 H1080 M0 1280 H1080 M0 1600 H1080" stroke="#161B22" stroke-width="2" />
  <path d="M216 0 V1920 M432 0 V1920 M648 0 V1920 M864 0 V1920" stroke="#161B22" stroke-width="2" />
</g>


<g transform="translate(80, 80)">
  <circle cx="20" cy="20" r="16" fill="#58A6FF" opacity="0.2" />
  <circle cx="20" cy="20" r="8" fill="#58A6FF" />
  <text x="52" y="27" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#F0F6FC" letter-spacing="1">CreatorOps</text>
</g>


<g transform="translate(390, 1250)"><g class="a" style="animation: fadeIn 0.8s ease-out 0.2s forwards;">
  <path d="M 0 16 Q 150 -16 300 16" fill="none" stroke="url(#ribbon-grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow-primary)" style="animation: ribbonWave 4s ease-in-out infinite;" />
</g>


</g><g transform="translate(540, 720)">
  
  <g class="a" style="animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;">
    
    
    <rect x="-180" y="-210" width="360" height="420" rx="24" fill="none" stroke="#F85149" stroke-width="4" opacity="0.4" filter="url(#glow-accent)" style="animation: pulseAlert 2.5s ease-in-out infinite;" />

    
    <rect x="-170" y="-200" width="340" height="400" rx="24" fill="url(#card-grad)" stroke="#30363D" stroke-width="2" filter="url(#card-shadow)" />
    
    
    <path d="M -170 -140 H 170" stroke="#30363D" stroke-width="2" />
    <circle cx="-130" cy="-170" r="8" fill="#F85149" />
    <circle cx="-105" cy="-170" r="8" fill="#D29922" />
    <circle cx="-80" cy="-170" r="8" fill="#3FB950" />
    
    <text x="0" y="-163" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600" fill="#8B949E" text-anchor="middle">MONTHLY_SUB_OVERLOAD.json</text>

    
    <g transform="translate(0, -20)">
      
      <rect x="-80" y="-70" width="160" height="150" rx="16" fill="#21262D" stroke="#58A6FF" stroke-width="3" />
      <path d="M -80 -30 H 80" stroke="#58A6FF" stroke-width="3" />
      
      <path d="M -45 -85 V -70 M 45 -85 V -70" stroke="#8B949E" stroke-width="6" stroke-linecap="round" />
      
      
      
      <path d="M -35 -5 L -20 10 M -20 -5 L -35 10" stroke="#F85149" stroke-width="4" stroke-linecap="round" />
      <path d="M 20 -5 L 35 10 M 35 -5 L 20 10" stroke="#F85149" stroke-width="4" stroke-linecap="round" />
      
      <path d="M 45 -25 Q 55 -15 45 -5 Q 35 -15 45 -25 Z" fill="#58A6FF" opacity="0.8" />
      
      <path d="M -25 40 Q -12 25 0 40 Q 12 55 25 40" fill="none" stroke="#F85149" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <g transform="translate(0, 120)" filter="url(#card-shadow)">
      <rect x="-110" y="-25" width="220" height="50" rx="25" fill="#DA3633" opacity="0.2" />
      <rect x="-110" y="-25" width="220" height="50" rx="25" fill="none" stroke="#F85149" stroke-width="2" />
      <text x="0" y="8" font-family="'Poppins', Arial, sans-serif" font-size="24" font-weight="700" fill="#F85149" text-anchor="middle">-$100.00 / MO</text>
    </g>

  </g>
</g>




<g transform="translate(140, 480)">
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards, floatApp1 5s ease-in-out 1.2s infinite;">
    <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#58A6FF" stroke-width="2" filter="url(#card-shadow)" />
    
    <path d="M -20 -15 H 20 C 28 -15 32 -11 32 -3 V 11 C 32 19 28 23 20 23 H 10 L 0 35 L -10 23 H -20 C -28 23 -32 19 -32 11 V -3 C -32 -11 -28 -15 -20 -15 Z" fill="none" stroke="#58A6FF" stroke-width="4" stroke-linejoin="round" />
    <circle cx="-12" cy="4" r="3" fill="#58A6FF" />
    <circle cx="0" cy="4" r="3" fill="#58A6FF" />
    <circle cx="12" cy="4" r="3" fill="#58A6FF" />
  </g>
  
  <g class="a" style="animation: flyBill1 2s ease-out 1.5s infinite;">
    <rect x="30" y="-20" width="48" height="28" rx="4" fill="#238636" stroke="#3FB950" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="54" y="-1" font-family="'Poppins', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
</g>


<g transform="translate(180, 1020)">
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, floatApp2 6s ease-in-out 1.4s infinite;">
    <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#D29922" stroke-width="2" filter="url(#card-shadow)" />
    
    <path d="M 18 10 H -16 C -24 10 -30 4 -30 -4 C -30 -12 -24 -18 -16 -18 C -14 -26 -6 -32 3 -30 C 12 -28 18 -20 18 -12 C 24 -12 28 -8 28 -2 C 28 5 24 10 18 10 Z" fill="none" stroke="#D29922" stroke-width="4" stroke-linejoin="round" />
  </g>
  
  <g class="a" style="animation: flyBill2 2.2s ease-out 1.8s infinite;">
    <rect x="40" y="10" width="48" height="28" rx="4" fill="#238636" stroke="#3FB950" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="64" y="29" font-family="'Poppins', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
</g>


<g transform="translate(900, 520)">
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards, floatApp3 5.5s ease-in-out 1.3s infinite;">
    <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#F85149" stroke-width="2" filter="url(#card-shadow)" />
    
    <path d="M -22 22 H 22" stroke="#F85149" stroke-width="4" stroke-linecap="round" />
    <path d="M -16 12 V -2 M -6 12 V -14 M 4 12 V -6 M 14 12 V -22" stroke="#F85149" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <g class="a" style="animation: flyBill1 1.9s ease-out 2s infinite;">
    <rect x="-70" y="-30" width="48" height="28" rx="4" fill="#238636" stroke="#3FB950" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="-46" y="-11" font-family="'Poppins', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
</g>


<g transform="translate(880, 1000)">
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, floatApp4 6.2s ease-in-out 1.6s infinite;">
    <rect x="-50" y="-50" width="100" height="100" rx="24" fill="url(#card-grad)" stroke="#3FB950" stroke-width="2" filter="url(#card-shadow)" />
    
    <path d="M -18 -24 H 18 V 24 L 12 18 L 6 24 L 0 18 L -6 24 L -12 18 L -18 24 Z" fill="none" stroke="#3FB950" stroke-width="3" stroke-linejoin="round" />
    <path d="M -10 -10 H 10 M -10 0 H 10 M -10 10 H 4" stroke="#3FB950" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <g class="a" style="animation: flyBill2 2.4s ease-out 1.3s infinite;">
    <rect x="-80" y="20" width="48" height="28" rx="4" fill="#238636" stroke="#3FB950" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="-56" y="39" font-family="'Poppins', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
</g>


<g transform="translate(540, 1420)">
  
  
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards;">
    <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="64" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="-1">Stop Tool Burnout</text>
  </g>

  
  <g class="a" style="animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.55s forwards;">
    <text x="0" y="65" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#8B949E" text-anchor="middle">Paying $100/mo across 4 fragmented apps?</text>
  </g>

</g>

</svg>