<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-base { fill: #161B22; }
  .grid-line { stroke: #21262d; stroke-width: 2; stroke-dasharray: 6 12; }
  
  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .fadeIn { animation-name: fadeInAnim; animation-timing-function: ease-out; }
  .fadeUp { animation-name: fadeUpAnim; }
  .popIn { animation-name: popInAnim; }
  .floatAnim { animation-name: floatLoop; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .steamAnim { animation-name: steamLoop; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  
  .chaosShake { animation-name: chaosAnim; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .mergeSnap { animation-name: mergeAnim; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes fadeInAnim {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUpAnim {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popInAnim {
    0% { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes floatLoop {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }

  @keyframes chaosAnim {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-12px, 8px) rotate(-3deg); }
    40% { transform: translate(10px, -10px) rotate(3deg); }
    60% { transform: translate(-8px, -6px) rotate(-2deg); }
    80% { transform: translate(12px, 6px) rotate(2deg); }
  }

  @keyframes mergeAnim {
    0% { opacity: 0; transform: scale(0.2) translateY(100px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes steamLoop {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    50% { opacity: 0.9; transform: translateY(-30px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>
  <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
  </filter>
  <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
  <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF7A50" />
    <stop offset="100%" stop-color="#FF5722" />
  </linearGradient>

  <linearGradient id="dashboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#21262d" />
    <stop offset="100%" stop-color="#0d1117" />
  </linearGradient>
</defs>

<rect width="1080" height="1920" class="bg-base" />

<!-- Background Grid -->
<g class="a fadeIn" style="animation-duration: 1s; animation-delay: 0.1s;">
  <line x1="0" y1="480" x2="1080" y2="480" class="grid-line" />
  <line x1="0" y1="960" x2="1080" y2="960" class="grid-line" />
  <line x1="0" y1="1440" x2="1080" y2="1440" class="grid-line" />
  <line x1="270" y1="0" x2="270" y2="1920" class="grid-line" />
  <line x1="540" y1="0" x2="540" y2="1920" class="grid-line" />
  <line x1="810" y1="0" x2="810" y2="1920" class="grid-line" />
</g>

<!-- Persistent Brand Mark -->
<g transform="translate(80, 90)">
  <g class="a fadeIn" style="animation-duration: 0.8s; animation-delay: 0.2s;">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#FF5722" />
    <path d="M16 24L24 16L32 24L24 32Z" fill="#FFFFFF" />
    <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">CreatorOps</text>
  </g>
</g>

<!-- Ribbon Accent -->
<g transform="translate(390, 1260)">
  <g class="a fadeIn" style="animation-duration: 1s; animation-delay: 0.3s;">
    <path d="M0 20 C 80 -10, 220 50, 300 20" fill="none" stroke="#FF5722" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <circle cx="150" cy="18" r="6" fill="#FF5722" />
  </g>
</g>

<!-- Header Copy -->
<g transform="translate(540, 230)">
  <g class="a popIn" style="animation-duration: 0.8s; animation-delay: 0.25s;">
    <rect x="-130" y="-45" width="260" height="50" rx="25" fill="#0d1117" stroke="#2196F3" stroke-width="2" />
    <text x="0" y="-14" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="600" fill="#2196F3" text-anchor="middle">THE SOLUTION</text>
  </g>
  
  <g class="a fadeUp" style="animation-duration: 0.9s; animation-delay: 0.35s;">
    <text x="0" y="45" font-family="'Poppins', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle">Meet CreatorOps</text>
  </g>
  
  <g class="a fadeUp" style="animation-duration: 0.9s; animation-delay: 0.45s;">
    <text x="0" y="105" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#8B949E" text-anchor="middle">All your workflows in one powerful studio.</text>
  </g>
</g>

<!-- Desk Surface Base -->
<g transform="translate(540, 1500)">
  <g class="a fadeUp" style="animation-duration: 1s; animation-delay: 0.4s;">
    <rect x="-440" y="0" width="880" height="24" rx="12" fill="#0d1117" filter="url(#shadow-deep)" />
    <rect x="-380" y="24" width="760" height="12" rx="4" fill="#161B22" opacity="0.6" />
  </g>
</g>

<!-- Hero Orange Coffee Mug (Centered, Happy & Steaming) -->
<g transform="translate(540, 1370)">
  <g class="a popIn" style="animation-duration: 0.9s; animation-delay: 0.5s;">
    <circle cx="0" cy="0" r="90" fill="#FF5722" opacity="0.3" filter="url(#glow-orange)" />
    <rect x="-45" y="-55" width="90" height="110" rx="20" fill="url(#mugGrad)" filter="url(#shadow-card)" />
    <rect x="-50" y="-65" width="100" height="16" rx="8" fill="#FF8A65" />
    <path d="M0 -5 L-12 -18 C-18 -24, -8 -34, 0 -24 C8 -34, 18 -24, 12 -18 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M45 -35 C 75 -35, 75 15, 45 25" fill="none" stroke="#FF5722" stroke-width="12" stroke-linecap="round" />
    
    <!-- Happy Steam -->
    <g class="a steamAnim" style="animation-duration: 2s; animation-delay: 1.0s;">
      <path d="M-12 -75 C -22 -95, 2 -105, -2 -125" fill="none" stroke="#FFC107" stroke-width="5" stroke-linecap="round" />
      <path d="M12 -70 C 22 -90, -2 -100, 2 -120" fill="none" stroke="#FF5722" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</g>

<!-- BEAT 1 (0.70s - 3.77s): Fragmented apps colliding & shaking before merge -->
<!-- App 1: Schedule (Left-Top) -->
<g transform="translate(300, 720)">
  <g class="a chaosShake" style="animation-duration: 0.4s; animation-delay: 0.70s; opacity: 1;">
    <rect x="-100" y="-70" width="200" height="140" rx="20" fill="#161B22" stroke="#2196F3" stroke-width="3" filter="url(#shadow-card)" />
    <circle cx="-50" cy="-30" r="18" fill="#2196F3" opacity="0.2" />
    <path d="M-56 -30 L-44 -30 M-50 -36 L-50 -24" stroke="#2196F3" stroke-width="3" stroke-linecap="round" />
    <text x="-20" y="-23" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Schedule</text>
    <rect x="-75" y="5" width="150" height="10" rx="5" fill="#2196F3" opacity="0.4" />
    <rect x="-75" y="25" width="90" height="10" rx="5" fill="#8B949E" opacity="0.3" />
  </g>
</g>

<!-- App 2: Analytics (Right-Top) -->
<g transform="translate(780, 720)">
  <g class="a chaosShake" style="animation-duration: 0.35s; animation-delay: 0.75s; opacity: 1;">
    <rect x="-100" y="-70" width="200" height="140" rx="20" fill="#161B22" stroke="#FFC107" stroke-width="3" filter="url(#shadow-card)" />
    <circle cx="-50" cy="-30" r="18" fill="#FFC107" opacity="0.2" />
    <path d="M-60 -20 L-52 -40 L-44 -28 L-38 -48" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-20" y="-23" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Analytics</text>
    <rect x="-75" y="10" width="130" height="35" rx="6" fill="#FFC107" opacity="0.15" />
  </g>
</g>

<!-- App 3: Video Tools (Left-Bottom) -->
<g transform="translate(300, 1020)">
  <g class="a chaosShake" style="animation-duration: 0.45s; animation-delay: 0.80s; opacity: 1;">
    <rect x="-100" y="-70" width="200" height="140" rx="20" fill="#161B22" stroke="#FF5722" stroke-width="3" filter="url(#shadow-card)" />
    <circle cx="-50" cy="-30" r="18" fill="#FF5722" opacity="0.2" />
    <path d="M-58 -36 L-42 -26 L-58 -16 Z" fill="#FF5722" />
    <text x="-20" y="-23" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Video Tools</text>
    <rect x="-75" y="5" width="130" height="10" rx="5" fill="#FF5722" opacity="0.4" />
    <rect x="-75" y="25" width="80" height="10" rx="5" fill="#8B949E" opacity="0.3" />
  </g>
</g>

<!-- App 4: Invoices (Right-Bottom) -->
<g transform="translate(780, 1020)">
  <g class="a chaosShake" style="animation-duration: 0.38s; animation-delay: 0.85s; opacity: 1;">
    <rect x="-100" y="-70" width="200" height="140" rx="20" fill="#161B22" stroke="#2196F3" stroke-width="3" filter="url(#shadow-card)" />
    <circle cx="-50" cy="-30" r="18" fill="#2196F3" opacity="0.2" />
    <text x="-58" y="-22" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="800" fill="#2196F3">$</text>
    <text x="-20" y="-23" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Invoices</text>
    <rect x="-75" y="8" width="150" height="14" rx="4" fill="#2196F3" opacity="0.3" />
    <rect x="-75" y="30" width="100" height="10" rx="4" fill="#8B949E" opacity="0.3" />
  </g>
</g>

<!-- BEAT 2 (3.81s - 6.69s): Unified CreatorOps Studio Dashboard Magnetic Snap & Green Checkmark -->
<g transform="translate(540, 870)">
  <g class="a mergeSnap" style="animation-duration: 0.9s; animation-delay: 3.75s;">
    <!-- Ambient Glow for Unified Dashboard -->
    <circle cx="0" cy="0" r="240" fill="#2196F3" opacity="0.15" filter="url(#glow-green)" />
    
    <!-- Main Dashboard Window -->
    <rect x="-340" y="-200" width="680" height="400" rx="28" fill="url(#dashboardGrad)" stroke="#2196F3" stroke-width="4" filter="url(#shadow-deep)" />
    
    <!-- Top Bar of Dashboard -->
    <rect x="-340" y="-200" width="680" height="70" rx="28" fill="#161B22" />
    <circle cx="-300" cy="-165" r="8" fill="#FF5722" />
    <circle cx="-275" cy="-165" r="8" fill="#FFC107" />
    <circle cx="-250" cy="-165" r="8" fill="#2196F3" />
    
    <text x="-210" y="-157" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">CreatorOps Studio</text>
    
    <!-- Success Badge / Checkmark -->
    <g transform="translate(245, -165)">
      <circle cx="0" cy="0" r="22" fill="#22c55e" opacity="0.2" />
      <circle cx="0" cy="0" r="16" fill="#22c55e" />
      <path d="M-6 0 L-2 4 L7 -5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Dashboard Content Layout (Unified Modules) -->
    <!-- Module 1: Schedule bar -->
    <rect x="-300" y="-100" width="280" height="70" rx="14" fill="#161B22" stroke="#2196F3" stroke-width="1.5" />
    <circle cx="-260" cy="-65" r="14" fill="#2196F3" opacity="0.25" />
    <path d="M-265 -65 L-255 -65 M-260 -70 L-260 -60" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round" />
    <text x="-230" y="-57" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Schedule &amp; Publish</text>
    <rect x="-230" y="-42" width="180" height="8" rx="4" fill="#2196F3" opacity="0.5" />

    <!-- Module 2: Analytics chart -->
    <rect x="20" y="-100" width="280" height="70" rx="14" fill="#161B22" stroke="#FFC107" stroke-width="1.5" />
    <circle cx="60" cy="-65" r="14" fill="#FFC107" opacity="0.25" />
    <path d="M52 -60 L58 -72 L64 -64 L70 -76" fill="none" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="-57" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Realtime Analytics</text>
    <rect x="90" y="-42" width="180" height="8" rx="4" fill="#FFC107" opacity="0.5" />

    <!-- Module 3: Video Engine -->
    <rect x="-300" y="-10" width="280" height="70" rx="14" fill="#161B22" stroke="#FF5722" stroke-width="1.5" />
    <circle cx="-260" cy="25" r="14" fill="#FF5722" opacity="0.25" />
    <path d="M-266 19 L-252 25 L-266 31 Z" fill="#FF5722" />
    <text x="-230" y="33" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Video Pipeline</text>
    <rect x="-230" y="48" width="180" height="8" rx="4" fill="#FF5722" opacity="0.5" />

    <!-- Module 4: Finance Hub -->
    <rect x="20" y="-10" width="280" height="70" rx="14" fill="#161B22" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="60" cy="25" r="14" fill="#22c55e" opacity="0.25" />
    <text x="53" y="32" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e">$</text>
    <text x="90" y="33" font-family="'Poppins', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Revenue &amp; Invoices</text>
    <rect x="90" y="48" width="180" height="8" rx="4" fill="#22c55e" opacity="0.5" />

    <!-- Bottom Status Text -->
    <text x="0" y="135" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="500" fill="#8B949E" text-anchor="middle">All systems synchronized &amp; operational</text>
    <rect x="-120" y="155" width="240" height="6" rx="3" fill="#2196F3" opacity="0.8" />
  </g>
</g>

</svg>