<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap');

  .bg-base { fill: #0D1117; }
  .grid-line { stroke: #161B22; stroke-width: 2; stroke-dasharray: 6 12; }
  
  /* Base animation classes */
  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Specific Animations */
  .fadeIn { animation-name: fadeInAnim; animation-timing-function: ease-out; }
  .fadeUp { animation-name: fadeUpAnim; }
  .popIn { animation-name: popInAnim; }
  .floatAnim { animation-name: floatLoop; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .steamAnim { animation-name: steamLoop; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }

  @keyframes fadeInAnim {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUpAnim {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popInAnim {
    0% { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes floatLoop {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.5deg); }
  }

  @keyframes steamLoop {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    50% { opacity: 0.8; transform: translateY(-25px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  
  <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>
  <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
  </filter>
  <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
  
  
  <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#161B22" />
    <stop offset="100%" stop-color="#0D1117" />
  </linearGradient>
  <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF7A50" />
    <stop offset="100%" stop-color="#FF5722" />
  </linearGradient>
</defs>


<rect width="1080" height="1920" class="bg-base" />


<g class="a fadeIn" style="animation-duration: 1s; animation-delay: 0.1s;">
  <line x1="0" y1="480" x2="1080" y2="480" class="grid-line" />
  <line x1="0" y1="960" x2="1080" y2="960" class="grid-line" />
  <line x1="0" y1="1440" x2="1080" y2="1440" class="grid-line" />
  <line x1="270" y1="0" x2="270" y2="1920" class="grid-line" />
  <line x1="540" y1="0" x2="540" y2="1920" class="grid-line" />
  <line x1="810" y1="0" x2="810" y2="1920" class="grid-line" />
</g>


<g transform="translate(80, 90)"><g class="a fadeIn" style="animation-duration: 0.8s; animation-delay: 0.2s;">
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#FF5722" />
  <path d="M16 24L24 16L32 24L24 32Z" fill="#FFFFFF" />
  <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">CreatorOps</text>
</g>


</g><g transform="translate(390, 1260)"><g class="a fadeIn" style="animation-duration: 1s; animation-delay: 0.3s;">
  <path d="M0 20 C 80 -10, 220 50, 300 20" fill="none" stroke="#FF5722" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <circle cx="150" cy="18" r="6" fill="#FF5722" />
</g>


</g><g transform="translate(540, 230)">
  
  <g class="a popIn" style="animation-duration: 0.8s; animation-delay: 0.3s;">
    <rect x="-140" y="-45" width="280" height="50" rx="25" fill="#161B22" stroke="#FF5722" stroke-width="2" />
    <text x="0" y="-14" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="600" fill="#FF5722" text-anchor="middle">SOLO CREATOR PAIN</text>
  </g>
  
  
  <g class="a fadeUp" style="animation-duration: 0.9s; animation-delay: 0.4s;">
    <text x="0" y="45" font-family="'Poppins', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle">Stop Tool Overload</text>
  </g>
  
  
  <g class="a fadeUp" style="animation-duration: 0.9s; animation-delay: 0.5s;">
    <text x="0" y="105" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#8B949E" text-anchor="middle">Paying for four apps is burning your cash.</text>
  </g>
</g>



<g transform="translate(540, 1450)"><g class="a fadeUp" style="animation-duration: 1s; animation-delay: 0.6s;">
  <rect x="-440" y="0" width="880" height="24" rx="12" fill="#161B22" filter="url(#shadow-deep)" />
  <rect x="-380" y="24" width="760" height="12" rx="4" fill="#0D1117" opacity="0.6" />
</g>


</g><g transform="translate(540, 1320)"><g class="a popIn" style="animation-duration: 0.9s; animation-delay: 0.7s;">
  
  <circle cx="0" cy="0" r="80" fill="#FF5722" opacity="0.25" filter="url(#glow-orange)" />
  
  <rect x="-45" y="-55" width="90" height="110" rx="20" fill="url(#mugGrad)" filter="url(#shadow-card)" />
  
  <rect x="-50" y="-65" width="100" height="16" rx="8" fill="#FF8A65" />
  
  <path d="M0 -5 L-12 -18 C-18 -24, -8 -34, 0 -24 C8 -34, 18 -24, 12 -18 Z" fill="#FFFFFF" opacity="0.9" />
  
  <path d="M45 -35 C 75 -35, 75 15, 45 25" fill="none" stroke="#FF5722" stroke-width="12" stroke-linecap="round" />
  
  
  <g class="a steamAnim" style="animation-duration: 2.2s; animation-delay: 4.1s;">
    <path d="M-15 -80 C -25 -100, 5 -110, -5 -130" fill="none" stroke="#FFC107" stroke-width="5" stroke-linecap="round" />
    <path d="M15 -75 C 25 -95, -5 -105, 5 -125" fill="none" stroke="#FF5722" stroke-width="5" stroke-linecap="round" />
  </g>
</g>


</g><g transform="translate(220, 680)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 0.8s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 4s; animation-delay: 0.8s, 0.8s;">
  <rect x="-110" y="-80" width="220" height="160" rx="24" fill="#161B22" stroke="#2196F3" stroke-width="3" filter="url(#shadow-card)" />
  
  <circle cx="-60" cy="-35" r="22" fill="#2196F3" opacity="0.2" />
  <path d="M-68 -35 L-52 -35 M-60 -43 L-60 -27" stroke="#2196F3" stroke-width="4" stroke-linecap="round" />
  <text x="-25" y="-28" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Schedule</text>
  <rect x="-85" y="5" width="170" height="12" rx="6" fill="#2196F3" opacity="0.4" />
  <rect x="-85" y="30" width="110" height="12" rx="6" fill="#8B949E" opacity="0.3" />
</g>


</g><g transform="translate(860, 720)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 0.95s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 4.5s; animation-delay: 0.95s, 0.95s;">
  <rect x="-110" y="-80" width="220" height="160" rx="24" fill="#161B22" stroke="#FFC107" stroke-width="3" filter="url(#shadow-card)" />
  <circle cx="-60" cy="-35" r="22" fill="#FFC107" opacity="0.2" />
  <path d="M-72 -25 L-65 -45 L-55 -30 L-48 -50" fill="none" stroke="#FFC107" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="-25" y="-28" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Analytics</text>
  <rect x="-85" y="10" width="140" height="40" rx="8" fill="#FFC107" opacity="0.15" />
</g>


</g><g transform="translate(200, 1020)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 1.1s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 3.8s; animation-delay: 1.1s, 1.1s;">
  <rect x="-110" y="-80" width="220" height="160" rx="24" fill="#161B22" stroke="#FF5722" stroke-width="3" filter="url(#shadow-card)" />
  <circle cx="-60" cy="-35" r="22" fill="#FF5722" opacity="0.2" />
  <path d="M-70 -42 L-50 -28 L-70 -14 Z" fill="#FF5722" />
  <text x="-25" y="-28" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Video Tools</text>
  <rect x="-85" y="5" width="150" height="12" rx="6" fill="#FF5722" opacity="0.4" />
  <rect x="-85" y="30" width="90" height="12" rx="6" fill="#8B949E" opacity="0.3" />
</g>


</g><g transform="translate(880, 1040)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 1.25s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 4.2s; animation-delay: 1.25s, 1.25s;">
  <rect x="-110" y="-80" width="220" height="160" rx="24" fill="#161B22" stroke="#2196F3" stroke-width="3" filter="url(#shadow-card)" />
  <circle cx="-60" cy="-35" r="22" fill="#2196F3" opacity="0.2" />
  <text x="-70" y="-27" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="800" fill="#2196F3">$</text>
  <text x="-25" y="-28" font-family="'Poppins', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Invoices</text>
  <rect x="-85" y="8" width="170" height="16" rx="4" fill="#2196F3" opacity="0.3" />
  <rect x="-85" y="34" width="120" height="12" rx="4" fill="#8B949E" opacity="0.3" />
</g>


</g><g transform="translate(410, 880)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 1.4s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 5s; animation-delay: 1.4s, 0s;">
  <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#161B22" stroke="#8B949E" stroke-width="2" filter="url(#shadow-card)" transform="rotate(-12)" />
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FF5722" text-anchor="middle" transform="rotate(-12)">-$25.00/mo</text>
</g>

</g><g transform="translate(680, 880)"><g class="a popIn floatAnim" style="animation-duration: 1s; animation-delay: 1.55s; animation-name: popInAnim, floatLoop; animation-iteration-count: 1, infinite; animation-duration: 0.9s, 4.6s; animation-delay: 1.55s, 0s;">
  <rect x="-70" y="-45" width="140" height="90" rx="12" fill="#161B22" stroke="#8B949E" stroke-width="2" filter="url(#shadow-card)" transform="rotate(15)" />
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="700" fill="#FF5722" text-anchor="middle" transform="rotate(15)">-$25.00/mo</text>
</g>

</g></svg>