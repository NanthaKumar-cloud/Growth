<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&amp;family=Inter:wght@400;600&amp;display=swap');

.a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }

.bg-in { animation: fadeIn 0.6s ease-out 0s forwards; }
.cube-enter { animation: cubeEnter 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards, cubeFloat 4s ease-in-out 1.1s infinite alternate; }
.node-left { animation: nodeLeftIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, nodeBob 3s ease-in-out 1.3s infinite alternate; }
.node-right { animation: nodeRightIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards, nodeBobAlt 3.5s ease-in-out 1.4s infinite alternate; }
.bridge-arc { animation: drawArc 1s cubic-bezier(0.22,1,0.36,1) 0.7s forwards; }
.text-h1 { animation: textPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards; }
.text-sub { animation: textPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards; }
.icon-flow-1 { animation: flowLeft 1.2s cubic-bezier(0.22,1,0.36,1) 3.5s forwards, pulseIcon 2s ease-in-out infinite alternate 4.7s; }
.icon-flow-2 { animation: flowLeft 1.2s cubic-bezier(0.22,1,0.36,1) 3.7s forwards, pulseIcon 2.2s ease-in-out infinite alternate 4.9s; }
.icon-flow-3 { animation: flowLeft 1.2s cubic-bezier(0.22,1,0.36,1) 3.9s forwards, pulseIcon 2.5s ease-in-out infinite alternate 5.1s; }
.ribbon-anim { animation: ribbonWave 3s ease-in-out infinite alternate 0.5s; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes cubeEnter { from { opacity: 0; transform: translateX(300px) scale(0.7); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes cubeFloat { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-16px) rotate(2deg); } }
@keyframes nodeLeftIn { from { opacity: 0; transform: translate(-100px, 50px) scale(0.5); } to { opacity: 1; transform: translate(0, 0) scale(1); } }
@keyframes nodeRightIn { from { opacity: 0; transform: translate(100px, 50px) scale(0.5); } to { opacity: 1; transform: translate(0, 0) scale(1); } }
@keyframes nodeBob { from { transform: translateY(0); } to { transform: translateY(-10px); } }
@keyframes nodeBobAlt { from { transform: translateY(0); } to { transform: translateY(12px); } }
@keyframes drawArc { from { stroke-dashoffset: 800; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
@keyframes textPop { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes flowLeft { 
  0% { opacity: 0; transform: translateX(200px) scale(0.8); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-400px) scale(0.8); }
}
@keyframes pulseIcon { from { transform: scale(1); } to { transform: scale(1.1); } }
@keyframes ribbonWave { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-6px) rotate(1.5deg); } }

@media (prefers-reduced-motion: reduce) { 
  .a { animation: none !important; opacity: 1 !important; transform: none !important; } 
}
</style>

<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B0F19" />
    <stop offset="100%" stop-color="#161E2E" />
  </linearGradient>

  <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#60A5FA" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>
  <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2563EB" />
    <stop offset="100%" stop-color="#1D4ED8" />
  </linearGradient>
  <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3B82F6" />
    <stop offset="100%" stop-color="#1E40AF" />
  </linearGradient>

  <linearGradient id="nodeSG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#34D399" />
    <stop offset="100%" stop-color="#059669" />
  </linearGradient>
  <linearGradient id="nodeIN" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FBBF24" />
    <stop offset="100%" stop-color="#D97706" />
  </linearGradient>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="24" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>


<rect width="1080" height="1920" fill="url(#bgGrad)" class="a bg-in" />


<text x="72" y="100" font-size="32" font-weight="700" fill="#94A3B8" font-family="'Poppins', Arial, sans-serif">IncuBrix</text>


<g opacity="0.08">
  <path d="M 0 300 L 1080 300 M 0 600 L 1080 600 M 0 900 L 1080 900 M 0 1200 L 1080 1200 M 0 1500 L 1080 1500" stroke="#FFFFFF" stroke-width="2" />
  <path d="M 270 0 L 270 1920 M 540 0 L 540 1920 M 810 0 L 810 1920" stroke="#FFFFFF" stroke-width="2" />
</g>


<g transform="translate(540, 240)"><g class="a text-h1">
  <text x="0" y="0" text-anchor="middle" font-size="76" font-weight="800" fill="#FFFFFF" font-family="'Poppins', Arial, sans-serif">Global Team, Big Vision</text>
</g>
</g><g transform="translate(540, 330)"><g class="a text-sub">
  <text x="0" y="0" text-anchor="middle" font-size="36" font-weight="600" fill="#3B82F6" font-family="'Inter', Arial, sans-serif">Singapore meets India in CreatorOps</text>
</g>


</g><g transform="translate(540, 780)">

  
  <path class="a bridge-arc" d="M -280 120 Q 0 -60 280 120" fill="none" stroke="#3B82F6" stroke-width="6" stroke-dasharray="8 12" filter="url(#softGlow)" />

  
  <circle class="a icon-flow-1" cx="0" cy="0" r="8" fill="#F59E0B" />
  <circle class="a icon-flow-2" cx="0" cy="0" r="6" fill="#10B981" />
  <circle class="a icon-flow-3" cx="0" cy="0" r="10" fill="#3B82F6" />

  
  <g transform="translate(-280, 120)"><g class="a node-left">
    <circle cx="0" cy="0" r="70" fill="#1E293B" stroke="url(#nodeSG)" stroke-width="4" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="50" fill="#0B0F19" opacity="0.8" />
    
    <path d="M -15 15 L -15 -15 L 0 -30 L 15 -15 L 15 15 Z" fill="none" stroke="#34D399" stroke-width="4" stroke-linejoin="round" />
    <circle cx="0" cy="-5" r="8" fill="#34D399" />
    <text x="0" y="110" text-anchor="middle" font-size="28" font-weight="600" fill="#34D399" font-family="'Inter', Arial, sans-serif">Singapore</text>
  </g>

  
  </g><g transform="translate(280, 120)"><g class="a node-right">
    <circle cx="0" cy="0" r="70" fill="#1E293B" stroke="url(#nodeIN)" stroke-width="4" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="50" fill="#0B0F19" opacity="0.8" />
    
    <path d="M -20 -10 C -20 15, 20 15, 20 -10 M 0 -25 L 0 10" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-5" r="8" fill="#FBBF24" />
    <text x="0" y="110" text-anchor="middle" font-size="28" font-weight="600" fill="#FBBF24" font-family="'Inter', Arial, sans-serif">India</text>
  </g>

  
  </g><g transform="translate(0, -60)"><g class="a cube-enter">
    
    <ellipse cx="0" cy="140" rx="90" ry="30" fill="#3B82F6" opacity="0.4" filter="url(#glow)" />

    
    
    <path d="M 0 -90 L 90 -45 L 0 0 L -90 -45 Z" fill="url(#cubeTop)" stroke="#93C5FD" stroke-width="2" />
    
    <path d="M -90 -45 L 0 0 L 0 110 L -90 65 Z" fill="url(#cubeLeft)" stroke="#60A5FA" stroke-width="2" />
    
    <path d="M 0 0 L 90 -45 L 90 65 L 0 110 Z" fill="url(#cubeRight)" stroke="#93C5FD" stroke-width="2" />

    
    <path d="M -45 -22 L 0 0 L 45 -22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
    <path d="M 0 0 L 0 55" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" filter="url(#softGlow)" />
    
    
    <rect x="-110" y="130" width="220" height="56" rx="28" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#softGlow)" />
    <text x="0" y="168" text-anchor="middle" font-size="24" font-weight="600" fill="#FFFFFF" font-family="'Inter', Arial, sans-serif">CreatorOps Core</text>
  </g>

</g></g>


<g transform="translate(800, 1150)"><g class="a icon-flow-1">
  <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="3" filter="url(#softGlow)" />
  
  <path d="M -15 -8 L -25 2 L -15 12 M 15 -8 L 25 2 L 15 12 M 5 -15 L -5 15" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</g>

</g><g transform="translate(680, 1300)"><g class="a icon-flow-2">
  <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="3" filter="url(#softGlow)" />
  
  <circle cx="0" cy="0" r="6" fill="#10B981" />
  <circle cx="-18" cy="-14" r="4" fill="#10B981" />
  <circle cx="18" cy="14" r="4" fill="#10B981" />
  <path d="M -18 -14 L 0 0 L 18 14" fill="none" stroke="#10B981" stroke-width="2" />
</g>

</g><g transform="translate(900, 1250)"><g class="a icon-flow-3">
  <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1E293B" stroke="#3B82F6" stroke-width="3" filter="url(#softGlow)" />
  
  <rect x="-16" y="-12" width="32" height="24" rx="4" fill="none" stroke="#3B82F6" stroke-width="3" />
  <path d="M -6 -4 L 8 4 L -6 12 Z" fill="#3B82F6" />
</g>


</g><g transform="translate(540, 1420)"><g class="a ribbon-anim">
  <path d="M -100 0 Q 0 -25 100 0" fill="none" stroke="#3B82F6" stroke-width="32" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)" />
  <path d="M -70 0 Q 0 -15 70 0" fill="none" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" opacity="0.9" />
</g>


</g><rect x="0" y="1760" width="1080" height="160" fill="#0B0F19" opacity="0.9" />

</svg>