  <line x1="-150" y1="65" x2="150" y2="65" stroke="#334155" stroke-width="2" />
  <text x="-140" y="100" font-size="18" font-weight="600" fill="#E2E8F0" font-family="'Inter', Arial, sans-serif">Auto Repurpose Engine</text>
  
