<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&amp;family=Inter:wght@400;600&amp;display=swap');

.a { opacity: 0; transform-box: fill-box; transform-origin: center; animation-fill-mode: forwards; }

.bg-in { animation: fadeIn 0.6s ease-out 0s forwards; }
.text-h1 { animation: textPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards; }
.text-sub { animation: textPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards; }

.cube-core { animation: cubeEnter 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards, cubeFloat 4s ease-in-out 1.1s infinite alternate; }

.panel-left { animation: panelFlipLeft 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards; }
.panel-right { animation: panelFlipRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards; }
.panel-bottom { animation: panelFlipDown 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards; }

.chk-1 { animation: checkPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards; }
.chk-2 { animation: checkPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.2s forwards; }
.chk-3 { animation: checkPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.9s forwards; }

.channel-1 { animation: chanPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.5s forwards, chanFloat 3s ease-in-out 4.2s infinite alternate; }
.channel-2 { animation: chanPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.8s forwards, chanFloat 3.5s ease-in-out 4.5s infinite alternate; }
.channel-3 { animation: chanPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 4.1s forwards, chanFloat 3.2s ease-in-out 4.8s infinite alternate; }

.ribbon-anim { animation: ribbonWave 3s ease-in-out infinite alternate 0.5s; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes textPop { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes cubeEnter { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
@keyframes cubeFloat { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-12px) rotate(1.5deg); } }

@keyframes panelFlipLeft { from { opacity: 0; transform: perspective(1000px) rotateY(60deg) translateX(100px); } to { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateX(0); } }
@keyframes panelFlipRight { from { opacity: 0; transform: perspective(1000px) rotateY(-60deg) translateX(-100px); } to { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateX(0); } }
@keyframes panelFlipDown { from { opacity: 0; transform: perspective(1000px) rotateX(-60deg) translateY(-50px); } to { opacity: 1; transform: perspective(1000px) rotateX(0deg) translateY(0); } }

@keyframes checkPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@keyframes chanPop { from { opacity: 0; transform: scale(0.5) translateY(40px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes chanFloat { from { transform: translateY(0); } to { transform: translateY(-8px); } }
@keyframes ribbonWave { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-6px) rotate(1.5deg); } }

@media (prefers-reduced-motion: reduce) { 
  .a { animation: none !important; opacity: 1 !important; transform: none !important; } 
}
</style>

<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B0F19" />
    <stop offset="100%" stop-color="#161E2E" />
  </linearGradient>

  <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#60A5FA" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>
  <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2563EB" />
    <stop offset="100%" stop-color="#1D4ED8" />
  </linearGradient>
  <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3B82F6" />
    <stop offset="100%" stop-color="#1E40AF" />
  </linearGradient>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="24" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

<rect width="1080" height="1920" fill="url(#bgGrad)" class="a bg-in" />

<text x="72" y="100" font-size="32" font-weight="700" fill="#94A3B8" font-family="'Poppins', Arial, sans-serif">IncuBrix</text>

