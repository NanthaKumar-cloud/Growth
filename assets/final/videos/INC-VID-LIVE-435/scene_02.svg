<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .bg-fade { animation: fadeIn 0.6s ease-out 0s forwards; }
      .brand-fade { animation: fadeIn 0.8s ease-out 0.2s forwards; }
      
      .text-in-1 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
      .text-in-2 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards; }
      
      .tab-shuffle-1 { animation: tabMove1 5s ease-in-out 0.8s infinite alternate; }
      .tab-shuffle-2 { animation: tabMove2 4.5s ease-in-out 0.9s infinite alternate; }
      .tab-shuffle-3 { animation: tabMove3 5.2s ease-in-out 1.0s infinite alternate; }
      .tab-shuffle-4 { animation: tabMove4 4.8s ease-in-out 1.1s infinite alternate; }

      .chaos-lines { animation: chaosFlash 2s ease-in-out 3.5s infinite alternate; }
      .orb-core { animation: scaleUpOvershoot 0.8s cubic-bezier(0.34,1.56,0.64,1) 3.8s forwards, floatIdle 4s ease-in-out 4.6s infinite alternate; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleUpOvershoot {
        from { opacity: 0; transform: scale(0.2); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes floatIdle {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1deg); }
      }

      @keyframes tabMove1 {
        0% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { opacity: 0.9; transform: translate(-80px, 40px) rotate(-6deg) scale(0.95); }
        66% { opacity: 1; transform: translate(40px, -20px) rotate(3deg) scale(1.02); }
        100% { opacity: 0.85; transform: translate(-30px, 60px) rotate(-3deg) scale(0.98); }
      }

      @keyframes tabMove2 {
        0% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { opacity: 1; transform: translate(70px, -50px) rotate(5deg) scale(1.03); }
        66% { opacity: 0.9; transform: translate(-50px, 30px) rotate(-4deg) scale(0.96); }
        100% { opacity: 1; transform: translate(50px, -30px) rotate(4deg) scale(1.01); }
      }

      @keyframes tabMove3 {
        0% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { opacity: 0.85; transform: translate(-60px, -40px) rotate(-4deg) scale(0.97); }
        66% { opacity: 1; transform: translate(60px, 50px) rotate(6deg) scale(1.02); }
        100% { opacity: 0.9; transform: translate(-40px, -20px) rotate(-2deg) scale(0.99); }
      }

      @keyframes tabMove4 {
        0% { opacity: 1; transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { opacity: 1; transform: translate(50px, 60px) rotate(4deg) scale(1.02); }
        66% { opacity: 0.85; transform: translate(-70px, -30px) rotate(-5deg) scale(0.95); }
        100% { opacity: 1; transform: translate(30px, 40px) rotate(2deg) scale(1.0); }
      }

      @keyframes chaosFlash {
        0% { filter: drop-shadow(0 0 5px #F59E0B); }
        50% { filter: drop-shadow(0 0 20px #EF4444); }
        100% { filter: drop-shadow(0 0 8px #F59E0B); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="orb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <g class="a bg-fade">
    <rect width="1080" height="1920" fill="url(#bg-grad)" />
  </g>

  <g class="a bg-fade">
    <g opacity="0.15">
      <path d="M 0,400 L 1080,400 M 0,800 L 1080,800 M 0,1200 L 1080,1200 M 0,1600 L 1080,1600" stroke="#06B6D4" stroke-width="2" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#7C3AED" stroke-width="2" />
    </g>
  </g>

  <g transform="translate(72, 100)">
    <g class="a brand-fade">
      <circle cx="24" cy="24" r="24" fill="#7C3AED" />
      <path d="M 16 24 L 22 30 L 34 18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="32" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="1">Studiowave</text>
    </g>
  </g>
  
  <rect x="0" y="1228" width="173" height="40" fill="#7C3AED" />
  <rect x="907" y="1228" width="173" height="40" fill="#7C3AED" />
  
  <g class="a brand-fade">
    <path d="M 0,1248 Q 270,1190 540,1248 T 1080,1248" fill="none" stroke="#7C3AED" stroke-width="40" opacity="0.8" />
  </g>

  <g transform="translate(72, 280)">
    <g class="a text-in-1">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="88" letter-spacing="-1">Constant Context</text>
      <text x="0" y="96" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="88" letter-spacing="-1">Switching</text>
    </g>
  </g>

  <g transform="translate(72, 490)">
    <g class="a text-in-2">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="44">Kills creative momentum instantly.</text>
    </g>
  </g>

  <!-- Chaos Tangled Yellow/Red Data Lines converging toward center -->
  <g class="a chaos-lines">
    <g opacity="0.8">
      <path d="M 80 750 Q 300 650 540 850 Q 800 1050 1000 750" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
      <path d="M 100 1050 Q 350 950 540 850 Q 750 750 980 1100" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 12" />
      <path d="M 150 900 Q 400 1100 540 850 Q 680 600 950 950" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
      <path d="M 200 680 Q 400 800 540 850 Q 700 900 880 720" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" />
      <!-- Warning symbols in chaos -->
      <g transform="translate(320, 720)">
        <polygon points="0,-20 20,15 -20,15" fill="#EF4444" />
        <text x="0" y="10" fill="#FFFFFF" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="22" text-anchor="middle">!</text>
      </g>
      <g transform="translate(760, 920)">
        <polygon points="0,-20 20,15 -20,15" fill="#F59E0B" />
        <text x="0" y="10" fill="#FFFFFF" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="22" text-anchor="middle">!</text>
      </g>
    </g>
  </g>

  <!-- Floating Browser Tabs / UI Cards frantically shuffling -->
  <g transform="translate(120, 680)">
    <g class="a tab-shuffle-1" filter="url(#card-shadow)">
      <rect x="0" y="0" width="380" height="110" rx="20" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="45" cy="55" r="20" fill="#EF4444" opacity="0.2" />
      <path d="M 38 55 L 52 55" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="85" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Tab 01: FinalCut_v2</text>
      <text x="85" y="82" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="22">CPU 98% • Lagging</text>
    </g>
  </g>

  <g transform="translate(580, 640)">
    <g class="a tab-shuffle-2" filter="url(#card-shadow)">
      <rect x="0" y="0" width="380" height="110" rx="20" fill="#161E2E" stroke="#F59E0B" stroke-width="2" />
      <circle cx="45" cy="55" r="20" fill="#F59E0B" opacity="0.2" />
      <path d="M 38 48 L 52 62 M 52 48 L 38 62" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
      <text x="85" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Tab 02: Analytics</text>
      <text x="85" y="82" fill="#F59E0B" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="22">Sync Error 404</text>
    </g>
  </g>

  <g transform="translate(180, 960)">
    <g class="a tab-shuffle-3" filter="url(#card-shadow)">
      <rect x="0" y="0" width="380" height="110" rx="20" fill="#161E2E" stroke="#06B6D4" stroke-width="2" />
      <circle cx="45" cy="55" r="20" fill="#06B6D4" opacity="0.2" />
      <path d="M 38 55 L 52 55 M 45 48 L 45 62" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
      <text x="85" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Tab 03: Newsletter</text>
      <text x="85" y="82" fill="#06B6D4" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="22">Draft Unsaved</text>
    </g>
  </g>

  <g transform="translate(540, 980)">
    <g class="a tab-shuffle-4" filter="url(#card-shadow)">
      <rect x="0" y="0" width="380" height="110" rx="20" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="45" cy="55" r="20" fill="#EF4444" opacity="0.2" />
      <path d="M 38 55 L 52 55" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="85" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Tab 04: HostBilling</text>
      <text x="85" y="82" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="22">Payment Failed</text>
    </g>
  </g>

  <!-- Glowing Studio Orb emerging at center as setup for next scene -->
  <g transform="translate(540, 850)">
    <g class="a orb-core">
      <circle cx="0" cy="0" r="160" fill="#7C3AED" opacity="0.3" filter="url(#glow)" />
      <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="#06B6D4" stroke-width="3.5" transform="rotate(-25 0 0)" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="210" ry="80" fill="none" stroke="#7C3AED" stroke-width="2.5" transform="rotate(35 0 0)" opacity="0.6" />
      <circle cx="0" cy="0" r="105" fill="url(#orb-grad)" filter="url(#card-shadow)" />
      <circle cx="-35" cy="-25" r="16" fill="#F8FAFC" opacity="0.9" />
      <rect x="-12" y="6" width="48" height="32" rx="8" fill="#F59E0B" />
    </g>
  </g>
</svg>