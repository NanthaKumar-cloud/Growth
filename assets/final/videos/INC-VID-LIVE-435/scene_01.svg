<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .bg-fade { animation: fadeIn 0.6s ease-out 0s forwards; }
      .brand-fade { animation: fadeIn 0.8s ease-out 0.2s forwards; }
      
      .hero-in { animation: scaleUpOvershoot 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards, floatIdle 4s ease-in-out 1.1s infinite alternate; }
      
      .text-in-1 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
      .text-in-2 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.7s forwards; }
      
      .inv-1 { animation: invPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.2s forwards, floatIdleSlow 5s ease-in-out 1.9s infinite alternate; }
      .inv-2 { animation: invPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.6s forwards, floatIdle 4.5s ease-in-out 2.3s infinite alternate; }
      .inv-3 { animation: invPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 2.0s forwards, floatIdleSlow 5.5s ease-in-out 2.7s infinite alternate; }
      .inv-4 { animation: invPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 2.4s forwards, floatIdle 4.8s ease-in-out 3.1s infinite alternate; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleUpOvershoot {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes invPop {
        0% { opacity: 0; transform: scale(0.5) translateY(50px) rotate(5deg); }
        100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
      }

      @keyframes floatIdle {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1deg); }
      }

      @keyframes floatIdleSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(-1deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="orb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <g class="a bg-fade">
    <rect width="1080" height="1920" fill="url(#bg-grad)" />
  </g>

  <g class="a bg-fade">
    <g opacity="0.15">
      <path d="M 0,400 L 1080,400 M 0,800 L 1080,800 M 0,1200 L 1080,1200 M 0,1600 L 1080,1600" stroke="#06B6D4" stroke-width="2" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#7C3AED" stroke-width="2" />
    </g>
  </g>

  <g transform="translate(72, 100)">
    <g class="a brand-fade">
      <circle cx="24" cy="24" r="24" fill="#7C3AED" />
      <path d="M 16 24 L 22 30 L 34 18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="32" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="1">Studiowave</text>
    </g>
  </g>
  
  <rect x="907" y="1228" width="173" height="40" fill="#7C3AED" />
  
  <g class="a brand-fade">
    <path d="M 0,1248 Q 270,1200 540,1248 T 907,1248" fill="none" stroke="#7C3AED" stroke-width="40" opacity="0.8" />
  </g>

  <g transform="translate(320, 950)">
    <g class="a hero-in">
      <circle cx="0" cy="0" r="140" fill="#7C3AED" opacity="0.25" filter="url(#glow)" />
      <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#06B6D4" stroke-width="3" transform="rotate(-25 0 0)" opacity="0.7" />
      <ellipse cx="0" cy="0" rx="180" ry="70" fill="none" stroke="#7C3AED" stroke-width="2" transform="rotate(35 0 0)" opacity="0.5" />
      <circle cx="0" cy="0" r="90" fill="url(#orb-grad)" filter="url(#card-shadow)" />
      <circle cx="-30" cy="-20" r="14" fill="#F8FAFC" opacity="0.9" />
      <rect x="-10" y="5" width="40" height="28" rx="6" fill="#F59E0B" />
    </g>
  </g>

  <g transform="translate(72, 320)">
    <g class="a text-in-1">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-1">Stop Tool</text>
      <text x="0" y="100" fill="#06B6D4" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-1">Fatigue</text>
    </g>
  </g>

  <g transform="translate(72, 500)">
    <g class="a text-in-2">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="44">Four apps is three too many.</text>
    </g>
  </g>

  <g transform="translate(620, 640)">
    <g class="a inv-1" filter="url(#card-shadow)">
      <rect x="0" y="0" width="388" height="120" rx="24" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="50" cy="60" r="24" fill="#EF4444" opacity="0.2" />
      <path d="M 42 60 L 58 60 M 50 52 L 50 68" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="96" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="28">Video Suite</text>
      <text x="96" y="88" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="32">-$29.00 / mo</text>
    </g>
  </g>

  <g transform="translate(620, 790)">
    <g class="a inv-2" filter="url(#card-shadow)">
      <rect x="0" y="0" width="388" height="120" rx="24" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="50" cy="60" r="24" fill="#EF4444" opacity="0.2" />
      <path d="M 42 60 L 58 60" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="96" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="28">Email Hub</text>
      <text x="96" y="88" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="32">-$24.00 / mo</text>
    </g>
  </g>

  <g transform="translate(620, 940)">
    <g class="a inv-3" filter="url(#card-shadow)">
      <rect x="0" y="0" width="388" height="120" rx="24" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="50" cy="60" r="24" fill="#EF4444" opacity="0.2" />
      <path d="M 42 52 L 58 68 M 58 52 L 42 68" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="96" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="28">Hosting Pro</text>
      <text x="96" y="88" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="32">-$19.00 / mo</text>
    </g>
  </g>

  <g transform="translate(620, 1090)">
    <g class="a inv-4" filter="url(#card-shadow)">
      <rect x="0" y="0" width="388" height="120" rx="24" fill="#161E2E" stroke="#EF4444" stroke-width="2" />
      <circle cx="50" cy="60" r="24" fill="#EF4444" opacity="0.2" />
      <path d="M 42 60 L 58 60 M 50 52 L 50 68" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
      <text x="96" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="28">Analytics Plus</text>
      <text x="96" y="88" fill="#EF4444" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="32">-$28.00 / mo</text>
    </g>
  </g>
</svg>