<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');

      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }

      .bg-fade { animation: fadeIn 0.6s ease-out 0s forwards; }
      .brand-fade { animation: fadeIn 0.8s ease-out 0.2s forwards; }
      
      .text-in-1 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
      .text-in-2 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards; }

      .widget-1 { animation: slideInLeft 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, floatWidget1 4s ease-in-out 1.5s infinite alternate; }
      .widget-2 { animation: slideInRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards, floatWidget2 4.5s ease-in-out 1.7s infinite alternate; }
      .widget-3 { animation: scaleUpOvershoot 0.9s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards, floatWidget3 5s ease-in-out 2.0s infinite alternate; }

      .gear-rot { animation: spinSlow 12s linear infinite; }
      .gear-rot-rev { animation: spinReverse 15s linear infinite; }
      .pulse-ring { animation: pulseGlow 3s ease-in-out infinite alternate; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideInLeft {
        from { opacity: 0; transform: translate(-100px, 0px) scale(0.85); }
        to { opacity: 1; transform: translate(0px, 0px) scale(1); }
      }

      @keyframes slideInRight {
        from { opacity: 0; transform: translate(100px, 0px) scale(0.85); }
        to { opacity: 1; transform: translate(0px, 0px) scale(1); }
      }

      @keyframes scaleUpOvershoot {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes floatWidget1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      @keyframes floatWidget2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }

      @keyframes floatWidget3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }

      @media (prefers-reduced-motion: reduce) {
        .a { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="graph-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g class="a bg-fade">
    <rect width="1080" height="1920" fill="url(#bg-grad)" />
  </g>

  <!-- Subtle Isometric Grid & Background Glows -->
  <g class="a bg-fade">
    <g opacity="0.12">
      <path d="M 0,300 L 1080,300 M 0,600 L 1080,600 M 0,900 L 1080,900 M 0,1200 L 1080,1200 M 0,1500 L 1080,1500" stroke="#06B6D4" stroke-width="2" />
      <path d="M 270,0 L 270,1920 M 540,0 L 540,1920 M 810,0 L 810,1920" stroke="#7C3AED" stroke-width="2" />
      <circle cx="540" cy="1150" r="450" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="10 10" />
    </g>
    <!-- Ambient glow behind center graph -->
    <circle cx="540" cy="1150" r="300" fill="#06B6D4" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Persistent Brand Mark (Top Left) -->
  <g transform="translate(72, 100)">
    <g class="a brand-fade">
      <circle cx="24" cy="24" r="24" fill="#7C3AED" />
      <path d="M 16 24 L 22 30 L 34 18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="32" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="1">Studiowave</text>
    </g>
  </g>
  
  <!-- Ribbon Seam Links -->
  <rect x="0" y="1228" width="173" height="40" fill="#7C3AED" />
  <rect x="907" y="1228" width="173" height="40" fill="#7C3AED" />
  
  <g class="a brand-fade">
    <path d="M 0,1248 Q 270,1190 540,1248 T 1080,1248" fill="none" stroke="#7C3AED" stroke-width="40" opacity="0.9" />
  </g>

  <!-- Headline Text -->
  <g transform="translate(72, 240)">
    <g class="a text-in-1">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-1">All-In-One Power</text>
    </g>
  </g>

  <g transform="translate(72, 350)">
    <g class="a text-in-2">
      <text x="0" y="0" fill="#06B6D4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="44">Automate workflows and track revenue.</text>
    </g>
  </g>

  <!-- WIDGET 1: Automation & Workflow Gears (Top Left) -->
  <g transform="translate(80, 480)">
    <g class="a widget-1" filter="url(#card-shadow)">
      <rect x="0" y="0" width="430" height="260" rx="24" fill="#161E2E" stroke="#7C3AED" stroke-width="2.5" />
      
      <!-- Widget Header -->
      <circle cx="40" cy="40" r="18" fill="#7C3AED" opacity="0.3" />
      <path d="M 32 40 L 38 46 L 48 34" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="75" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Workflow Automation</text>

      <!-- Interlocking Gears Graphic -->
      <g transform="translate(120, 150)">
        <g class="gear-rot">
          <circle cx="0" cy="0" r="45" fill="none" stroke="#7C3AED" stroke-width="8" stroke-dasharray="14 8" />
          <circle cx="0" cy="0" r="20" fill="#161E2E" stroke="#7C3AED" stroke-width="3" />
        </g>
      </g>
      <g transform="translate(240, 130)">
        <g class="gear-rot-rev">
          <circle cx="0" cy="0" r="32" fill="none" stroke="#06B6D4" stroke-width="6" stroke-dasharray="10 6" />
          <circle cx="0" cy="0" r="14" fill="#161E2E" stroke="#06B6D4" stroke-width="2.5" />
        </g>
      </g>

      <!-- Active Status Indicator -->
      <rect x="35" y="210" width="360" height="12" rx="6" fill="#0B0F19" />
      <rect x="35" y="210" width="280" height="12" rx="6" fill="url(#cyan-grad)" />
      <text x="35" y="195" fill="#06B6D4" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="16">SYNCING 6 APPS SEAMLESSLY</text>
    </g>
  </g>

  <!-- WIDGET 2: Brand Deal Scheduler (Top Right) -->
  <g transform="translate(570, 480)">
    <g class="a widget-2" filter="url(#card-shadow)">
      <rect x="0" y="0" width="430" height="260" rx="24" fill="#161E2E" stroke="#06B6D4" stroke-width="2.5" />
      
      <!-- Widget Header -->
      <circle cx="40" cy="40" r="18" fill="#06B6D4" opacity="0.3" />
      <rect x="30" y="30" width="20" height="20" rx="4" fill="none" stroke="#06B6D4" stroke-width="3" />
      <path d="M 35 40 L 40 45 L 50 33" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="75" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="24">Brand Deals Manager</text>

      <!-- Contract Checklist Items -->
      <g transform="translate(35, 80)">
        <rect x="0" y="0" width="360" height="45" rx="12" fill="#0B0F19" />
        <circle cx="25" cy="22" r="8" fill="#06B6D4" />
        <path d="M 22 22 L 24 24 L 28 19" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <text x="50" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="18">Sponsorship #1 - Confirmed</text>
      </g>

      <g transform="translate(35, 140)">
        <rect x="0" y="0" width="360" height="45" rx="12" fill="#0B0F19" />
        <circle cx="25" cy="22" r="8" fill="#06B6D4" />
        <path d="M 22 22 L 24 24 L 28 19" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <text x="50" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="18">Exclusive Drop - Scheduled</text>
      </g>

      <g transform="translate(35, 200)">
        <rect x="0" y="0" width="360" height="40" rx="12" fill="#0B0F19" opacity="0.6" />
        <circle cx="25" cy="20" r="8" fill="#7C3AED" />
        <text x="50" y="26" fill="#A78BFA" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16">Auto-Invoice Generated</text>
      </g>
    </g>
  </g>

  <!-- WIDGET 3 (HERO CLOSING): Cyan Rising Revenue Graph (Centered Prominently) -->
  <g transform="translate(140, 800)">
    <g class="a widget-3" filter="url(#card-shadow)">
      <rect x="0" y="0" width="800" height="380" rx="32" fill="#161E2E" stroke="#06B6D4" stroke-width="4" />
      
      <!-- Outer Pulsing Glow Border -->
      <rect x="-6" y="-6" width="812" height="392" rx="38" fill="none" stroke="#06B6D4" stroke-width="2" class="pulse-ring" />

      <!-- Header Info inside Graph Card -->
      <circle cx="50" cy="55" r="24" fill="#06B6D4" opacity="0.25" />
      <path d="M 38 62 L 48 48 L 56 55 L 68 40" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="90" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="30">Real-Time Revenue Stream</text>
      <text x="90" y="82" fill="#06B6D4" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="24">$128,450.00 Total Earnings • Zero Tabs Opened</text>

      <!-- Background Grid lines for Graph -->
      <g opacity="0.2">
        <line x1="60" y1="140" x2="740" y2="140" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 6" />
        <line x1="60" y1="210" x2="740" y2="210" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 6" />
        <line x1="60" y1="280" x2="740" y2="280" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 6" />
      </g>

      <!-- Graph Area Fill & Rising Line -->
      <path d="M 60,310 L 60,260 Q 200,240 340,190 T 620,120 L 740,90 L 740,310 Z" fill="url(#graph-fill)" />
      
      <!-- Glowing Smooth Line -->
      <path d="M 60,260 Q 200,240 340,190 T 620,120 L 740,90" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />

      <!-- Data Points on Graph -->
      <circle cx="60" cy="260" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
      <circle cx="200" cy="223" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
      <circle cx="340" cy="190" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
      <circle cx="480" cy="155" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
      <circle cx="620" cy="120" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="740" cy="90" r="12" fill="#06B6D4" stroke="#FFFFFF" stroke-width="4" />

      <!-- Floating Callout Badge on Graph Peak -->
      <g transform="translate(620, 20)">
        <rect x="-70" y="0" width="140" height="45" rx="12" fill="#0B0F19" stroke="#06B6D4" stroke-width="2" />
        <text x="0" y="28" fill="#06B6D4" font-family="'Outfit', Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle">+340% MoM</text>
      </g>
    </g>
  </g>

</svg>