<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    70% { opacity: 1; transform: scale(1.08) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes scaleUp {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }

  @keyframes floatIdleAlt {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(14px) rotate(-1deg); }
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .a-bg { animation: fadeIn 0.6s ease-out 0s forwards; }
  .a-brand { animation: fadeUp 0.6s ease-out 0.1s forwards; }
  .a-head { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards; }
  .a-supp { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.35s forwards; }
  .a-halo { animation: fadeIn 0.8s ease-out 0.3s forwards, pulseGlow 4s ease-in-out 1.1s infinite; }
  
  .a-cube { animation: popIn 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards, floatIdle 5s ease-in-out 1.3s infinite; }
  .a-badge1 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, floatIdleAlt 4.5s ease-in-out 1.5s infinite; }
  .a-badge2 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards, floatIdle 4.8s ease-in-out 1.7s infinite; }
  
  .a-cta-btn { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.2s forwards, floatIdleAlt 5.2s ease-in-out 2s infinite; }
  .a-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16192B" />
    <stop offset="100%" stop-color="#0D0F18" />
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#242945" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#191D32" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#A855F7" />
  </linearGradient>

  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#06B6D4" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>

  <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#818CF8" />
    <stop offset="100%" stop-color="#6366F1" />
  </linearGradient>

  <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#4338CA" />
  </linearGradient>

  <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A855F7" />
    <stop offset="100%" stop-color="#7E22CE" />
  </linearGradient>

  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="30" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>
</defs>


<g class="a a-bg">
  <rect width="1080" height="1920" fill="url(#bgGrad)" />
</g>


<g transform="translate(540, 680)">
  <circle cx="0" cy="0" r="350" fill="#06B6D4" fill-opacity="0.12" filter="url(#glow)" class="a a-halo" />
</g>


<g transform="translate(72, 100)">
  <g class="a a-brand">
    <circle cx="20" cy="20" r="20" fill="#6366F1" />
    <text x="20" y="27" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="56" y="28" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="0.5">CreatorOps</text>
  </g>
</g>


<g transform="translate(540, 210)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">Build Smarter Today</text>
  <text x="0" y="85" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="40" fill="#06B6D4" text-anchor="middle" class="a a-supp">creatorops.in | @creatorops</text>
</g>


<g transform="translate(540, 680)">
  <g class="a a-cube" filter="url(#shadow)">
    
    <path d="M 0 -130 L 130 -65 L 0 0 L -130 -65 Z" fill="url(#cubeTop)" stroke="#A5B4FC" stroke-width="3" />
    
    <path d="M -130 -65 L 0 0 L 0 130 L -130 65 Z" fill="url(#cubeLeft)" stroke="#818CF8" stroke-width="3" />
    
    <path d="M 0 0 L 130 -65 L 130 65 L 0 130 Z" fill="url(#cubeRight)" stroke="#C084FC" stroke-width="3" />
    
    <path d="M 0 -50 L 50 -25 L 0 0 L -50 -25 Z" fill="#FFFFFF" fill-opacity="0.25" />
    
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="0" cy="0" r="8" fill="#06B6D4" />
  </g>
</g>


<g transform="translate(240, 520)">
  <g class="a a-badge1" filter="url(#shadow)">
    <rect x="-120" y="-40" width="240" height="80" rx="40" fill="url(#panelGrad)" stroke="#6366F1" stroke-width="2" />
    <circle cx="-75" cy="0" r="16" fill="#6366F1" fill-opacity="0.3" />
    <path d="M -81 -3 L -76 3 L -67 -6" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="15" y="8" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">Unified Studio</text>
  </g>
</g>


<g transform="translate(840, 520)">
  <g class="a a-badge2" filter="url(#shadow)">
    <rect x="-120" y="-40" width="240" height="80" rx="40" fill="url(#panelGrad)" stroke="#A855F7" stroke-width="2" />
    <circle cx="-75" cy="0" r="16" fill="#A855F7" fill-opacity="0.3" />
    <path d="M -75 -8 L -75 8 M -83 0 L -67 0" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <text x="15" y="8" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">Zero Burnout</text>
  </g>
</g>


<g transform="translate(540, 1020)">
  <g class="a a-cta-btn" filter="url(#shadow)">
    <rect x="-270" y="-50" width="540" height="100" rx="50" fill="url(#accentGrad)" />
    <rect x="-270" y="-50" width="540" height="100" rx="50" fill="#06B6D4" fill-opacity="0.3" filter="url(#glow)" />
    <text x="0" y="12" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="36" fill="#0D0F18" text-anchor="middle" letter-spacing="1">Claim Your Studio</text>
  </g>
</g>


<g class="a a-ribbon">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>


<rect x="0" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>