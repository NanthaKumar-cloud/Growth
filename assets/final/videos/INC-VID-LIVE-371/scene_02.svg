<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  /* Keyframe Animations */
  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes scaleIn {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes scatterLeft {
    0% { opacity: 0; transform: translate(150px, -50px) scale(0.6) rotate(15deg); }
    60% { opacity: 1; transform: translate(-20px, 10px) scale(1.05) rotate(-5deg); }
    100% { opacity: 1; transform: translate(-220px, -120px) scale(1) rotate(-12deg); }
  }

  @keyframes scatterRight {
    0% { opacity: 0; transform: translate(-150px, -50px) scale(0.6) rotate(-15deg); }
    60% { opacity: 1; transform: translate(20px, 10px) scale(1.05) rotate(5deg); }
    100% { opacity: 1; transform: translate(240px, -80px) scale(1) rotate(14deg); }
  }

  @keyframes scatterBottomLeft {
    0% { opacity: 0; transform: translate(100px, -100px) scale(0.6) rotate(-10deg); }
    60% { opacity: 1; transform: translate(-10px, 10px) scale(1.05) rotate(4deg); }
    100% { opacity: 1; transform: translate(-190px, 160px) scale(1) rotate(-8deg); }
  }

  @keyframes scatterBottomRight {
    0% { opacity: 0; transform: translate(-100px, -100px) scale(0.6) rotate(10deg); }
    60% { opacity: 1; transform: translate(10px, 10px) scale(1.05) rotate(-4deg); }
    100% { opacity: 1; transform: translate(210px, 180px) scale(1) rotate(10deg); }
  }

  @keyframes countDrain {
    0% { opacity: 0; transform: scale(0.8) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(1.5deg); }
  }

  @keyframes floatIdleAlt {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(-1.5deg); }
  }

  @keyframes pulseAlert {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* Specific Animation Classes */
  .a-bg { animation: fadeIn 0.6s ease-out 0s forwards; }
  .a-brand { animation: fadeUp 0.6s ease-out 0.1s forwards; }
  .a-head { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards; }
  .a-supp { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards; }

  .a-counter { animation: countDrain 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, pulseAlert 3s ease-in-out 1.5s infinite; }

  .a-app1 { animation: scatterLeft 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, floatIdle 5.2s ease-in-out 1.6s infinite; }
  .a-app2 { animation: scatterRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.85s forwards, floatIdleAlt 5.8s ease-in-out 1.7s infinite; }
  .a-app3 { animation: scatterBottomLeft 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.0s forwards, floatIdleAlt 4.9s ease-in-out 1.8s infinite; }
  .a-app4 { animation: scatterBottomRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.15s forwards, floatIdle 5.5s ease-in-out 1.9s infinite; }

  .a-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16192B" />
    <stop offset="100%" stop-color="#0D0F18" />
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E2238" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#16192B" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EF4444" />
    <stop offset="100%" stop-color="#7F1D1D" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
  </filter>

  <filter id="redShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EF4444" flood-opacity="0.3" />
  </filter>
</defs>

<!-- Background -->
<g class="a a-bg">
  <rect width="1080" height="1920" fill="url(#bgAltGrad)" />
</g>

<!-- Ambient Grid Lines -->
<g class="a a-bg" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
  <line x1="0" y1="300" x2="1080" y2="300" />
  <line x1="0" y1="600" x2="1080" y2="600" />
  <line x1="0" y1="900" x2="1080" y2="900" />
  <line x1="0" y1="1200" x2="1080" y2="1200" />
  <line x1="0" y1="1500" x2="1080" y2="1500" />
  <line x1="270" y1="0" x2="270" y2="1920" />
  <line x1="540" y1="0" x2="540" y2="1920" />
  <line x1="810" y1="0" x2="810" y2="1920" />
</g>

<!-- Persistent Brand Mark (Static top-left) -->
<g transform="translate(72, 100)">
  <g class="a a-brand">
    <circle cx="20" cy="20" r="20" fill="#6366F1" />
    <text x="20" y="27" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="56" y="28" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="0.5">CreatorOps</text>
  </g>
</g>

<!-- Scene Headline & Support -->
<g transform="translate(540, 260)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">Hundred Dollars Gone</text>
  <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="44" fill="#EF4444" text-anchor="middle" class="a a-supp">Across four fragmented tools</text>
</g>

<!-- Central Coin Drain Wallet & Counter -->
<g transform="translate(540, 680)">
  <g class="a a-counter" filter="url(#redShadow)">
    <circle cx="0" cy="0" r="140" fill="#EF4444" fill-opacity="0.1" filter="url(#glow)" />
    <rect x="-190" y="-70" width="380" height="140" rx="35" fill="url(#panelGrad)" stroke="#EF4444" stroke-width="3" />
    
    <!-- Wallet Icon inside counter -->
    <path d="M -120 -15 L -90 -15 C -82 -15 -80 -20 -80 -25 C -80 -30 -82 -35 -90 -35 L -120 -35 Z" fill="#EF4444" />
    <rect x="-135" y="-35" width="45" height="45" rx="8" fill="none" stroke="#EF4444" stroke-width="4" />
    <circle cx="-113" cy="-12" r="5" fill="#EF4444" />

    <!-- Drain Counter Text -->
    <text x="20" y="10" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="64" fill="#EF4444" text-anchor="middle">-$100/mo</text>
  </g>
</g>

<!-- App Window 1: Cloud Storage (Scattering Top-Left) -->
<g transform="translate(540, 960)">
  <g class="a a-app1" filter="url(#shadow)">
    <rect x="-150" y="-100" width="300" height="200" rx="24" fill="url(#panelGrad)" stroke="#EF4444" stroke-width="2" />
    <circle cx="-95" cy="-45" r="28" fill="#EF4444" fill-opacity="0.15" />
    <!-- Cloud icon -->
    <path d="M -105 -35 C -105 -45 -90 -45 -85 -35 C -80 -45 -65 -45 -65 -35 C -55 -35 -55 -20 -65 -20 L -105 -20 C -115 -20 -115 -35 -105 -35 Z" fill="#EF4444" />
    <text x="-40" y="-37" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="28" fill="#FFFFFF">Cloud Host</text>
    <text x="-40" y="2" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#9CA3AF">$29.00 / mo</text>
    <rect x="-120" y="45" width="240" height="8" rx="4" fill="#EF4444" fill-opacity="0.4" />
    <rect x="-120" y="45" width="180" height="8" rx="4" fill="#EF4444" />
  </g>
</g>

<!-- App Window 2: Video Suite (Scattering Top-Right) -->
<g transform="translate(540, 960)">
  <g class="a a-app2" filter="url(#shadow)">
    <rect x="-150" y="-100" width="300" height="200" rx="24" fill="url(#panelGrad)" stroke="#EF4444" stroke-width="2" />
    <circle cx="-95" cy="-45" r="28" fill="#EF4444" fill-opacity="0.15" />
    <!-- Play/Video icon -->
    <path d="M -105 -60 L -80 -45 L -105 -30 Z" fill="#EF4444" />
    <text x="-40" y="-37" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="28" fill="#FFFFFF">Video Suite</text>
    <text x="-40" y="2" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#9CA3AF">$39.00 / mo</text>
    <rect x="-120" y="45" width="240" height="8" rx="4" fill="#EF4444" fill-opacity="0.4" />
    <rect x="-120" y="45" width="210" height="8" rx="4" fill="#EF4444" />
  </g>
</g>

<!-- App Window 3: CRM Pro (Scattering Bottom-Left) -->
<g transform="translate(540, 960)">
  <g class="a a-app3" filter="url(#shadow)">
    <rect x="-150" y="-100" width="300" height="200" rx="24" fill="url(#panelGrad)" stroke="#EF4444" stroke-width="2" />
    <circle cx="-95" cy="-45" r="28" fill="#EF4444" fill-opacity="0.15" />
    <!-- Users icon -->
    <circle cx="-95" cy="-52" r="10" fill="#EF4444" />
    <path d="M -115 -30 C -115 -38 -95 -38 -95 -30 Z" fill="#EF4444" />
    <text x="-40" y="-37" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="28" fill="#FFFFFF">CRM Pro</text>
    <text x="-40" y="2" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#9CA3AF">$19.00 / mo</text>
    <rect x="-120" y="45" width="240" height="8" rx="4" fill="#EF4444" fill-opacity="0.4" />
    <rect x="-120" y="45" width="120" height="8" rx="4" fill="#EF4444" />
  </g>
</g>

<!-- App Window 4: Automation (Scattering Bottom-Right) -->
<g transform="translate(540, 960)">
  <g class="a a-app4" filter="url(#shadow)">
    <rect x="-150" y="-100" width="300" height="200" rx="24" fill="url(#panelGrad)" stroke="#EF4444" stroke-width="2" />
    <circle cx="-95" cy="-45" r="28" fill="#EF4444" fill-opacity="0.15" />
    <!-- Cog/Settings icon -->
    <circle cx="-95" cy="-45" r="12" fill="none" stroke="#EF4444" stroke-width="5" />
    <text x="-40" y="-37" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="28" fill="#FFFFFF">Automation</text>
    <text x="-40" y="2" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="20" fill="#9CA3AF">$13.00 / mo</text>
    <rect x="-120" y="45" width="240" height="8" rx="4" fill="#EF4444" fill-opacity="0.4" />
    <rect x="-120" y="45" width="90" height="8" rx="4" fill="#EF4444" />
  </g>
</g>

<!-- Ribbon Seam Links -->
<!-- Animated Middle Ribbon -->
<g class="a a-ribbon">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>

<!-- Left Stub (Static alignment connector) -->
<rect x="0" y="1232" width="173" height="32" fill="#06B6D4" />

<!-- Right Stub (Static alignment connector) -->
<rect x="907" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>