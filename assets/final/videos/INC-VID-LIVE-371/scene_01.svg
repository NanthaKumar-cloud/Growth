    <text x="-35" y="12" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="16" fill="#9CA3AF">Automation</text>
    <rect x="-85" y="32" width="170" height="6" rx="3" fill="#EF4444" />
  </g>
</g>

<g transform="translate(540, 280)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">The Creator Burnout Trap</text>
  <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="44" fill="#A855F7" text-anchor="middle" class="a a-supp">Why do solo creators burn out?</text>
</g>

<g transform="translate(540, 520)">
  <g class="a a-stamp" filter="url(#glow)">
    <rect x="-240" y="-45" width="480" height="90" rx="45" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="3" />
    <text x="0" y="13" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="46" fill="#EF4444" text-anchor="middle" letter-spacing="4">2026 REALITY CHECK</text>
  </g>
</g>

<g class="a a-bg">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>

<rect x="907" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>