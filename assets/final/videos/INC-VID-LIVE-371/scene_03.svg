<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes snapInCenter {
    0% { opacity: 0; transform: scale(0.2) rotate(30deg); }
    70% { opacity: 1; transform: scale(1.08) rotate(-4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes cubePulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(99,102,241,0.5)); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 45px rgba(168,85,247,0.8)); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.2deg); }
  }

  @keyframes floatIdleAlt {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(14px) rotate(-1.5deg); }
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .a-bg { animation: fadeIn 0.6s ease-out 0s forwards; }
  .a-brand { animation: fadeUp 0.6s ease-out 0.1s forwards; }
  .a-head { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards; }
  .a-supp { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.45s forwards; }

  .a-cube { animation: snapInCenter 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, cubePulse 4s ease-in-out 1.3s infinite; }
  .a-halo { animation: fadeIn 0.8s ease-out 0.4s forwards, pulseGlow 3.5s ease-in-out 1.2s infinite; }

  .a-badge1 { animation: fadeUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards, floatIdle 5.2s ease-in-out 1.5s infinite; }
  .a-badge2 { animation: fadeUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.0s forwards, floatIdleAlt 5.8s ease-in-out 1.7s infinite; }

  .a-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16192B" />
    <stop offset="100%" stop-color="#0D0F18" />
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E2238" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#16192B" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A855F7" />
    <stop offset="100%" stop-color="#6366F1" />
  </linearGradient>

  <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>

  <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06B6D4" />
    <stop offset="100%" stop-color="#6366F1" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
  </filter>

  <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="35" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

<!-- Background -->
<g class="a a-bg">
  <rect width="1080" height="1920" fill="url(#bgGrad)" />
</g>

<!-- Ambient Grid Lines -->
<g class="a a-bg" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
  <line x1="0" y1="300" x2="1080" y2="300" />
  <line x1="0" y1="600" x2="1080" y2="600" />
  <line x1="0" y1="900" x2="1080" y2="900" />
  <line x1="0" y1="1200" x2="1080" y2="1200" />
  <line x1="0" y1="1500" x2="1080" y2="1500" />
  <line x1="270" y1="0" x2="270" y2="1920" />
  <line x1="540" y1="0" x2="540" y2="1920" />
  <line x1="810" y1="0" x2="810" y2="1920" />
</g>

<!-- Persistent Brand Mark (Static top-left) -->
<g transform="translate(72, 100)">
  <g class="a a-brand">
    <circle cx="20" cy="20" r="20" fill="#6366F1" />
    <text x="20" y="27" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="56" y="28" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="0.5">CreatorOps</text>
  </g>
</g>

<!-- Scene Headline & Support -->
<g transform="translate(540, 260)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">Meet CreatorOps</text>
  <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="44" fill="#06B6D4" text-anchor="middle" class="a a-supp">One unified studio for everything</text>
</g>

<!-- Ambient Halo behind Hero Cube -->
<g transform="translate(540, 880)">
  <circle cx="0" cy="0" r="220" fill="#6366F1" fill-opacity="0.2" filter="url(#accentGlow)" class="a a-halo" />
</g>

<!-- HERO ELEMENT: Floating Modular 3D Cube -->
<g transform="translate(540, 880)">
  <g class="a a-cube" filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="0,-130 150,-50 0,30 -150,-50" fill="url(#cubeTop)" stroke="#A855F7" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="-150,-50 0,30 0,190 -150,110" fill="url(#cubeLeft)" stroke="#6366F1" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="0,30 150,-50 150,110 0,190" fill="url(#cubeRight)" stroke="#06B6D4" stroke-width="2" />

    <!-- Inner Glowing Accents / Wireframe details -->
    <path d="M 0,-80 L 90,-30 L 0,20 L -90,-30 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />
    <circle cx="0" cy="-30" r="16" fill="#FFFFFF" fill-opacity="0.9" filter="url(#glow)" />
    
    <!-- Central studio core icon -->
    <path d="M -6 35 L 6 35 L 6 55 L 20 55 L 0 75 L -20 55 L -6 55 Z" fill="#FFFFFF" />
  </g>
</g>

<!-- Floating Notification Badge Left -->
<g transform="translate(250, 780)">
  <g class="a a-badge1" filter="url(#shadow)">
    <rect x="-130" y="-35" width="260" height="70" rx="35" fill="url(#panelGrad)" stroke="#6366F1" stroke-width="2" />
    <circle cx="-90" cy="0" r="18" fill="#6366F1" fill-opacity="0.2" />
    <path d="M -97 -5 L -92 2 L -83 -8" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="25" y="9" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="26" fill="#FFFFFF" text-anchor="middle">All-in-One</text>
  </g>
</g>

<!-- Floating Notification Badge Right -->
<g transform="translate(830, 980)">
  <g class="a a-badge2" filter="url(#shadow)">
    <rect x="-140" y="-35" width="280" height="70" rx="35" fill="url(#panelGrad)" stroke="#06B6D4" stroke-width="2" />
    <circle cx="-100" cy="0" r="18" fill="#06B6D4" fill-opacity="0.2" />
    <circle cx="-100" cy="0" r="8" fill="#06B6D4" />
    <text x="20" y="9" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="26" fill="#FFFFFF" text-anchor="middle">Zero Friction</text>
  </g>
</g>

<!-- Ribbon Seam Links -->
<!-- Animated Middle Ribbon -->
<g class="a a-ribbon">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>

<!-- Left Stub (Static alignment connector) -->
<rect x="0" y="1232" width="173" height="32" fill="#06B6D4" />

<!-- Right Stub (Static alignment connector) -->
<rect x="907" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>