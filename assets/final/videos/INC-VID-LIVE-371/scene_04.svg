<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes slideInRight {
    0% { opacity: 0; transform: translateX(-80px) scale(0.95); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes slideInLeft {
    0% { opacity: 0; transform: translateX(80px) scale(0.95); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    70% { opacity: 1; transform: scale(1.1) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  @keyframes floatIdleAlt {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(10px); }
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.1); }
  }

  .a-bg { animation: fadeIn 0.6s ease-out 0s forwards; }
  .a-brand { animation: fadeUp 0.6s ease-out 0.1s forwards; }
  .a-head { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.25s forwards; }
  .a-supp { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards; }

  .a-mod1 { animation: slideInRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards, floatIdle 5s ease-in-out 1.4s infinite; }
  .a-mod2 { animation: slideInLeft 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.2s forwards, floatIdleAlt 5.5s ease-in-out 2.0s infinite; }
  .a-mod3 { animation: slideInRight 0.8s cubic-bezier(0.34,1.56,0.64,1) 2.5s forwards, floatIdle 4.8s ease-in-out 3.3s infinite; }
  
  .a-badge { animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.0s forwards, floatIdleAlt 4.5s ease-in-out 3.7s infinite; }
  .a-halo { animation: fadeIn 0.8s ease-out 0.3s forwards, pulseGlow 4s ease-in-out 1.1s infinite; }
  .a-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16192B" />
    <stop offset="100%" stop-color="#1E2238" />
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#242945" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#191D32" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#A855F7" />
  </linearGradient>

  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#06B6D4" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>

  <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="30" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

<!-- Background -->
<g class="a a-bg">
  <rect width="1080" height="1920" fill="url(#bgGrad)" />
</g>

<!-- Ambient Background Glows -->
<g transform="translate(540, 960)">
  <circle cx="0" cy="0" r="350" fill="#6366F1" fill-opacity="0.1" filter="url(#accentGlow)" class="a a-halo" />
</g>

<!-- Persistent Brand Mark (Static top-left) -->
<g transform="translate(72, 100)">
  <g class="a a-brand">
    <circle cx="20" cy="20" r="20" fill="#6366F1" />
    <text x="20" y="27" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="56" y="28" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="0.5">CreatorOps</text>
  </g>
</g>

<!-- Scene Headline & Support -->
<g transform="translate(540, 240)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="88" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">All-In-One Power</text>
  <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="44" fill="#06B6D4" text-anchor="middle" class="a a-supp">Schedule, track, and monetize seamlessly</text>
</g>

<!-- DASHBOARD MODULE 1: Schedule Content (Calendar Module) -->
<g transform="translate(540, 520)">
  <g class="a a-mod1" filter="url(#shadow)">
    <rect x="-432" y="0" width="864" height="180" rx="24" fill="url(#panelGrad)" stroke="#6366F1" stroke-width="2" />
    
    <!-- Module Icon / Left Graphic -->
    <g transform="translate(-360, 90)">
      <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#6366F1" fill-opacity="0.2" />
      <path d="M -18 -12 L 18 -12 M -18 4 L 18 4 M -18 20 L 6 20 M -12 -28 L -12 -16 M 12 -28 L 12 -16" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Module Header & Text -->
    <text x="-270" y="65" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="start">Content Calendar</text>
    <text x="-270" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="26" fill="#94A3B8" text-anchor="start">Auto-schedule across YouTube &amp; Reels</text>

    <!-- Visual Preview Pill / Button -->
    <g transform="translate(290, 90)">
      <rect x="-90" y="-30" width="180" height="60" rx="30" fill="url(#primaryGrad)" />
      <text x="0" y="8" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="24" fill="#FFFFFF" text-anchor="middle">Synced</text>
    </g>
  </g>
</g>

<!-- DASHBOARD MODULE 2: Track Analytics (Chart Module) -->
<g transform="translate(540, 740)">
  <g class="a a-mod2" filter="url(#shadow)">
    <rect x="-432" y="0" width="864" height="180" rx="24" fill="url(#panelGrad)" stroke="#A855F7" stroke-width="2" />
    
    <!-- Module Icon / Left Graphic -->
    <g transform="translate(-360, 90)">
      <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#A855F7" fill-opacity="0.2" />
      <path d="M -22 15 L -10 -2 L 4 10 L 22 -20" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Module Header & Text -->
    <text x="-270" y="65" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="start">Live Analytics</text>
    <text x="-270" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="26" fill="#94A3B8" text-anchor="start">Real-time engagement &amp; reach tracking</text>

    <!-- Visual Mini Bar Graph -->
    <g transform="translate(290, 90)">
      <rect x="-90" y="-30" width="180" height="60" rx="30" fill="#16192B" stroke="#A855F7" stroke-width="1" />
      <!-- Tiny bars inside preview -->
      <rect x="-55" y="-5" width="12" height="25" rx="6" fill="#A855F7" />
      <rect x="-30" y="-15" width="12" height="35" rx="6" fill="#6366F1" />
      <rect x="-5" y="-22" width="12" height="42" rx="6" fill="#06B6D4" />
      <rect x="20" y="-10" width="12" height="30" rx="6" fill="#A855F7" />
      <text x="50" y="7" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="20" fill="#34D399" text-anchor="middle">+14%</text>
    </g>
  </g>
</g>

<!-- DASHBOARD MODULE 3: Manage Brand Deals (Invoice / Deal Module) -->
<g transform="translate(540, 960)">
  <g class="a a-mod3" filter="url(#shadow)">
    <rect x="-432" y="0" width="864" height="180" rx="24" fill="url(#panelGrad)" stroke="#06B6D4" stroke-width="2" />
    
    <!-- Module Icon / Left Graphic -->
    <g transform="translate(-360, 90)">
      <rect x="-35" y="-35" width="70" height="70" rx="16" fill="#06B6D4" fill-opacity="0.2" />
      <path d="M -15 -18 L 15 -18 M -15 -4 L 15 -4 M -15 10 L 5 10 M -20 -18 L -18 -18 M -20 -4 L -18 -4 M -20 10 L -18 10" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Module Header & Text -->
    <text x="-270" y="65" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="start">Brand Deal Hub</text>
    <text x="-270" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="26" fill="#94A3B8" text-anchor="start">Invoices, contracts &amp; sponsorship tracker</text>

    <!-- Visual Preview Pill / Button -->
    <g transform="translate(290, 90)">
      <rect x="-90" y="-30" width="180" height="60" rx="30" fill="url(#accentGrad)" />
      <text x="0" y="8" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="24" fill="#FFFFFF" text-anchor="middle">Secured</text>
    </g>
  </g>
</g>

<!-- POP-UP BADGE: Handshake Deal with Green Checkmark (Beats integration) -->
<g transform="translate(810, 1100)">
  <g class="a a-badge" filter="url(#shadow)">
    <circle cx="0" cy="0" r="50" fill="#1E2238" stroke="#34D399" stroke-width="3" />
    <!-- Handshake / Check icon -->
    <path d="M -16 2 L -4 14 L 18 -8" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</g>

<!-- Ribbon Seam Links -->
<!-- Animated Middle Ribbon -->
<g class="a a-ribbon">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>

<!-- Left Stub (Static alignment connector) -->
<rect x="0" y="1232" width="173" height="32" fill="#06B6D4" />

<!-- Right Stub (Static alignment connector) -->
<rect x="907" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>