<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    70% { opacity: 1; transform: scale(1.1) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes scaleUp {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  @keyframes floatIdleAlt {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(12px); }
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }

  .a-bg { animation: fadeIn 0.6s ease-out 0s forwards; }
  .a-brand { animation: fadeUp 0.6s ease-out 0.1s forwards; }
  .a-head { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards; }
  .a-supp { animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.35s forwards; }

  .a-bubble1 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards, floatIdle 4.5s ease-in-out 1.3s infinite; }
  .a-bubble2 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s forwards, floatIdleAlt 5s ease-in-out 1.5s infinite; }
  .a-bubble3 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards, floatIdle 4.8s ease-in-out 1.7s infinite; }
  .a-bubble4 { animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards, floatIdleAlt 5.2s ease-in-out 1.9s infinite; }

  .a-star1 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards, floatIdle 4s ease-in-out 2.1s infinite; }
  .a-star2 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.7s forwards, floatIdleAlt 4.2s ease-in-out 2.3s infinite; }
  .a-star3 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.9s forwards, floatIdle 4.5s ease-in-out 2.5s infinite; }
  .a-star4 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.1s forwards, floatIdleAlt 4.3s ease-in-out 2.7s infinite; }
  .a-star5 { animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.3s forwards, floatIdle 4.6s ease-in-out 2.9s infinite; }

  .a-badge { animation: scaleUp 0.8s cubic-bezier(0.34,1.56,0.64,1) 2.6s forwards, floatIdleAlt 5s ease-in-out 3.4s infinite; }
  .a-halo { animation: fadeIn 0.8s ease-out 0.3s forwards, pulseGlow 4s ease-in-out 1.1s infinite; }
  .a-ribbon { animation: fadeUp 0.8s ease-out 0.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16192B" />
    <stop offset="100%" stop-color="#0D0F18" />
  </linearGradient>

  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#242945" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#191D32" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#A855F7" />
  </linearGradient>

  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#06B6D4" />
    <stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>

  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBBF24" />
    <stop offset="100%" stop-color="#F59E0B" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>

  <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="35" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>


<g class="a a-bg">
  <rect width="1080" height="1920" fill="url(#bgAltGrad)" />
</g>


<g transform="translate(540, 850)">
  <circle cx="0" cy="0" r="400" fill="#A855F7" fill-opacity="0.1" filter="url(#accentGlow)" class="a a-halo" />
</g>


<g transform="translate(72, 100)">
  <g class="a a-brand">
    <circle cx="20" cy="20" r="20" fill="#6366F1" />
    <text x="20" y="27" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="56" y="28" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="0.5">CreatorOps</text>
  </g>
</g>


<g transform="translate(540, 220)">
  <text x="0" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="96" fill="#FFFFFF" text-anchor="middle" class="a a-head" filter="url(#shadow)">Loved by Creators</text>
  <text x="0" y="85" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="44" fill="#06B6D4" text-anchor="middle" class="a a-supp">Ten thousand active users worldwide</text>
</g>



<g transform="translate(260, 520)">
  <g class="a a-bubble1" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="url(#panelGrad)" stroke="#6366F1" stroke-width="3" />
    
    <circle cx="0" cy="-12" r="22" fill="#6366F1" fill-opacity="0.3" />
    <path d="M -16 18 C -16 10, -8 6, 0 6 C 8 6, 16 10, 16 18" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="-4" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">AK</text>
    <text x="0" y="85" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#A855F7" text-anchor="middle">@aarav.vlogs</text>
  </g>
</g>


<g transform="translate(820, 460)">
  <g class="a a-bubble2" filter="url(#shadow)">
    <circle cx="0" cy="0" r="68" fill="url(#panelGrad)" stroke="#A855F7" stroke-width="3" />
    <circle cx="0" cy="-12" r="24" fill="#A855F7" fill-opacity="0.3" />
    <path d="M -18 20 C -18 11, -9 8, 0 8 C 9 8, 18 11, 18 20" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="-3" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" text-anchor="middle">PS</text>
    <text x="0" y="92" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="22" fill="#A855F7" text-anchor="middle">@priya.creates</text>
  </g>
</g>


<g transform="translate(200, 780)">
  <g class="a a-bubble3" filter="url(#shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#panelGrad)" stroke="#06B6D4" stroke-width="3" />
    <circle cx="0" cy="-10" r="20" fill="#06B6D4" fill-opacity="0.3" />
    <path d="M -14 16 C -14 9, -7 5, 0 5 C 7 5, 14 9, 14 16" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="-3" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">RK</text>
    <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#06B6D4" text-anchor="middle">@rahul_edit</text>
  </g>
</g>


<g transform="translate(880, 740)">
  <g class="a a-bubble4" filter="url(#shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#panelGrad)" stroke="#34D399" stroke-width="3" />
    <circle cx="0" cy="-10" r="20" fill="#34D399" fill-opacity="0.3" />
    <path d="M -14 16 C -14 9, -7 5, 0 5 C 7 5, 14 9, 14 16" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="-3" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">NM</text>
    <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#34D399" text-anchor="middle">@neha.media</text>
  </g>
</g>


<g transform="translate(540, 640)">
  <g class="a a-badge" filter="url(#shadow)">
    
    <rect x="-240" y="-120" width="480" height="240" rx="40" fill="url(#panelGrad)" stroke="url(#goldGrad)" stroke-width="4" />

    
    <rect x="-240" y="-120" width="480" height="240" rx="40" fill="#FBBF24" fill-opacity="0.05" filter="url(#glow)" />

    
    <g transform="translate(0, -45)">
      
      <g transform="translate(-130, 0)"><g class="a a-star1">
        <path d="M 0 -24 L 7 -7 L 25 -7 L 11 4 L 17 21 L 0 11 L -17 21 L -11 4 L -25 -7 L -7 -7 Z" fill="url(#goldGrad)" />
      </g>
      
      </g><g transform="translate(-65, 0)"><g class="a a-star2">
        <path d="M 0 -24 L 7 -7 L 25 -7 L 11 4 L 17 21 L 0 11 L -17 21 L -11 4 L -25 -7 L -7 -7 Z" fill="url(#goldGrad)" />
      </g>
      
      </g><g transform="translate(0, 0)"><g class="a a-star3">
        <path d="M 0 -24 L 7 -7 L 25 -7 L 11 4 L 17 21 L 0 11 L -17 21 L -11 4 L -25 -7 L -7 -7 Z" fill="url(#goldGrad)" />
      </g>
      
      </g><g transform="translate(65, 0)"><g class="a a-star4">
        <path d="M 0 -24 L 7 -7 L 25 -7 L 11 4 L 17 21 L 0 11 L -17 21 L -11 4 L -25 -7 L -7 -7 Z" fill="url(#goldGrad)" />
      </g>
      
      </g><g transform="translate(130, 0)"><g class="a a-star5">
        <path d="M 0 -24 L 7 -7 L 25 -7 L 11 4 L 17 21 L 0 11 L -17 21 L -11 4 L -25 -7 L -7 -7 Z" fill="url(#goldGrad)" />
      </g>
    </g></g>

    
    <text x="0" y="25" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle">4.9 / 5.0 RATING</text>
    <text x="0" y="72" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="24" fill="#94A3B8" text-anchor="middle">Verified Creator Reviews</text>
  </g>
</g>



<g class="a a-ribbon">
  <g opacity="0.95">
    <path d="M 0 1248 C 200 1200, 400 1300, 540 1248 C 680 1196, 880 1296, 1080 1248" fill="none" stroke="#06B6D4" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  </g>
</g>


<rect x="0" y="1232" width="173" height="32" fill="#06B6D4" />


<rect x="907" y="1232" width="173" height="32" fill="#06B6D4" />

</svg>