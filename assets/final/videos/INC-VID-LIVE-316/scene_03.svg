<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  .brand-mark { opacity: 1 !important; }
  .bg-base { opacity: 1 !important; }

  .fadeInUp {
    animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popIn {
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .collapseMerge {
    animation: collapseMerge 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .dashboardSlide {
    animation: dashboardSlide 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .checkPop {
    animation: checkPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .tabletIdle {
    animation: tabletFloat 4s ease-in-out infinite alternate;
  }
  .ribbonWave {
    animation: ribbonMove 4s ease-in-out infinite alternate;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes collapseMerge {
    0% { opacity: 0; transform: scale(0.2) rotate(45deg); }
    60% { opacity: 1; transform: scale(1.05) rotate(-5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes dashboardSlide {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes checkPop {
    0% { opacity: 0; transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes tabletFloat {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-12px); }
  }

  @keyframes ribbonMove {
    0% { transform: translateY(0px) scaleX(1); }
    100% { transform: translateY(-8px) scaleX(1.05); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E293B" />
    <stop offset="100%" stop-color="#0F172A" />
  </linearGradient>

  <linearGradient id="tabletGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
  </linearGradient>

  <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1" />
  </linearGradient>

  <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
  </linearGradient>

  <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EC4899" stop-opacity="0" />
    <stop offset="50%" stop-color="#EC4899" stop-opacity="1" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>
</defs>

<rect class="bg-base" width="1080" height="1920" fill="url(#bgAltGrad)" />

<circle cx="340" cy="900" r="400" fill="#6366F1" opacity="0.08" filter="url(#glow)" />
<circle cx="740" cy="1100" r="400" fill="#10B981" opacity="0.08" filter="url(#glow)" />

<g class="brand-mark" transform="translate(80, 80)">
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
  <path d="M16 24H32M24 16V32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">CreatorOps</text>
</g>

<g transform="translate(390, 1280)"><g class="ribbonWave">
  <path d="M 0 15 Q 150 -15 300 15" stroke="url(#ribbonGrad)" stroke-width="4" fill="none" />
</g></g>

<g transform="translate(540, 240)">
  <g class="a popIn" style="animation-delay: 0.2s;">
    <rect x="-135" y="-45" width="270" height="50" rx="25" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
    <text x="0" y="-13" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#6366F1" text-anchor="middle">SOLUTION</text>
  </g>

  <text class="a fadeInUp" style="animation-delay: 0.3s;" x="0" y="70" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="76" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">One Unified Studio</text>
  
  <text class="a fadeInUp" style="animation-delay: 0.4s;" x="0" y="140" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="32" fill="#94A3B8" text-anchor="middle">CreatorOps replaces them all</text>
</g>

<g transform="translate(540, 1000)">
  <g class="tabletIdle">
    <g class="a collapseMerge" style="animation-delay: 0.5s;">
      
      <rect x="-420" y="-460" width="840" height="920" rx="36" fill="url(#tabletGrad)" stroke="#6366F1" stroke-width="3" filter="url(#shadow)" />
      
      <rect x="-420" y="-460" width="840" height="920" rx="36" fill="url(#glassGrad)" />

      
      <g transform="translate(-360, -390)">
        <rect x="0" y="0" width="720" height="70" rx="16" fill="#0F172A" opacity="0.8" />
        <circle cx="35" cy="35" r="14" fill="#6366F1" />
        <path d="M28 35 L33 40 L44 28" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="70" y="44" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC">CreatorOps Studio</text>
        <rect x="530" y="18" width="160" height="34" rx="10" fill="#10B981" opacity="0.2" />
        <text x="610" y="41" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="16" fill="#10B981" text-anchor="middle">All Systems Normal</text>
      </g>

      
      <g transform="translate(-360, -290)"><g class="a dashboardSlide" style="animation-delay: 0.8s;">
        
        <rect x="0" y="0" width="340" height="190" rx="20" fill="#0F172A" opacity="0.7" stroke="#334155" stroke-width="1.5" />
        <text x="30" y="45" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Monthly Revenue</text>
        <text x="30" y="90" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="38" fill="#10B981">$48,250</text>
        
        <path d="M 30 150 L 90 130 L 150 140 L 210 100 L 270 70 L 310 50" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round" />
        <path d="M 30 150 L 90 130 L 150 140 L 210 100 L 270 70 L 310 50 L 310 170 L 30 170 Z" fill="url(#emeraldGrad)" />

        
        <rect x="380" y="0" width="340" height="190" rx="20" fill="#0F172A" opacity="0.7" stroke="#334155" stroke-width="1.5" />
        <text x="410" y="45" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Audience Growth</text>
        <text x="410" y="90" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="38" fill="#6366F1">+24.8%</text>
        <path d="M410 140 L480 125 L550 135 L620 95 L690 75" stroke="#6366F1" stroke-width="4" fill="none" stroke-linecap="round" />

        
        <rect x="0" y="210" width="720" height="230" rx="20" fill="#0F172A" opacity="0.7" stroke="#334155" stroke-width="1.5" />
        <text x="30" y="255" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">Active Projects &amp; Deliverables</text>
        
        <rect x="30" y="285" width="660" height="40" rx="10" fill="#1E293B" />
        <text x="60" y="312" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="16" fill="#F8FAFC">YouTube Sponsor Video (Drafting)</text>
        <circle cx="650" cy="305" r="12" fill="#10B981" />
        <path d="M644 305 L648 309 L656 301" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />

        <rect x="30" y="340" width="660" height="40" rx="10" fill="#1E293B" />
        <text x="60" y="367" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="16" fill="#F8FAFC">Newsletter Sponsorship Drop</text>
        <circle cx="650" cy="360" r="12" fill="#10B981" />
        <path d="M644 360 L648 364 L656 356" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      
      </g><g transform="translate(350, -350)"><g class="a checkPop" style="animation-delay: 1.1s;">
        <circle cx="0" cy="0" r="30" fill="#10B981" filter="url(#shadow)" />
        <path d="M-10 -2 L-3 6 L12 -8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g></g>
  </g>
</g>

</svg>