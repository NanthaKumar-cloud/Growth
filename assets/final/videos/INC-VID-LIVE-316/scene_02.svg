<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  .brand-mark { opacity: 1 !important; }
  .bg-base { opacity: 1 !important; }

  .fadeInUp {
    animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popIn {
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  /* Scene 2 specific chaotic to center-collapse animations */
  .spinIn1 {
    animation: spinIn1 7.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .spinIn2 {
    animation: spinIn2 7.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .spinIn3 {
    animation: spinIn3 7.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .spinIn4 {
    animation: spinIn4 7.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .timerDrain {
    animation: timerDrain 4.5s linear forwards;
  }
  .ribbonWave {
    animation: ribbonMove 4s ease-in-out infinite alternate;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes spinIn1 {
    0% { opacity: 0; transform: translate(-300px, -250px) rotate(-45deg) scale(0.7); }
    20% { opacity: 1; transform: translate(-220px, -180px) rotate(-15deg) scale(1); }
    60% { opacity: 1; transform: translate(-180px, -140px) rotate(180deg) scale(1); }
    85% { opacity: 1; transform: translate(-40px, -20px) rotate(360deg) scale(0.6); }
    100% { opacity: 0; transform: translate(0px, 0px) rotate(420deg) scale(0.1); }
  }

  @keyframes spinIn2 {
    0% { opacity: 0; transform: translate(300px, -250px) rotate(45deg) scale(0.7); }
    20% { opacity: 1; transform: translate(220px, -160px) rotate(20deg) scale(1); }
    60% { opacity: 1; transform: translate(160px, -120px) rotate(-160deg) scale(1); }
    85% { opacity: 1; transform: translate(30px, -10px) rotate(-340deg) scale(0.6); }
    100% { opacity: 0; transform: translate(0px, 0px) rotate(-400deg) scale(0.1); }
  }

  @keyframes spinIn3 {
    0% { opacity: 0; transform: translate(-300px, 250px) rotate(30deg) scale(0.7); }
    20% { opacity: 1; transform: translate(-200px, 160px) rotate(-25deg) scale(1); }
    60% { opacity: 1; transform: translate(-140px, 120px) rotate(140deg) scale(1); }
    85% { opacity: 1; transform: translate(-20px, 10px) rotate(300deg) scale(0.6); }
    100% { opacity: 0; transform: translate(0px, 0px) rotate(360deg) scale(0.1); }
  }

  @keyframes spinIn4 {
    0% { opacity: 0; transform: translate(300px, 250px) rotate(-30deg) scale(0.7); }
    20% { opacity: 1; transform: translate(210px, 180px) rotate(35deg) scale(1); }
    60% { opacity: 1; transform: translate(150px, 130px) rotate(-200deg) scale(1); }
    85% { opacity: 1; transform: translate(20px, 20px) rotate(-380deg) scale(0.6); }
    100% { opacity: 0; transform: translate(0px, 0px) rotate(-450deg) scale(0.1); }
  }

  @keyframes timerDrain {
    0% { stroke-dashoffset: 0; }
    50% { stroke-dashoffset: 120; }
    100% { stroke-dashoffset: 251.2; }
  }

  @keyframes ribbonMove {
    0% { transform: translateY(0px) scaleX(1); }
    100% { transform: translateY(-8px) scaleX(1.05); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E293B" />
    <stop offset="100%" stop-color="#0F172A" />
  </linearGradient>

  <linearGradient id="windowGrad1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
    <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="windowGrad2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
    <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EC4899" stop-opacity="0" />
    <stop offset="50%" stop-color="#EC4899" stop-opacity="1" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
  </filter>
</defs>


<rect class="bg-base" width="1080" height="1920" fill="url(#bgAltGrad)" />


<circle cx="340" cy="700" r="350" fill="#6366F1" opacity="0.07" filter="url(#glow)" />
<circle cx="740" cy="850" r="350" fill="#EC4899" opacity="0.07" filter="url(#glow)" />


<g class="brand-mark" transform="translate(80, 80)">
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
  <path d="M16 24H32M24 16V32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">CreatorOps</text>
</g>


<g transform="translate(390, 1280)"><g class="ribbonWave">
  <path d="M 0 15 Q 150 -15 300 15" stroke="url(#ribbonGrad)" stroke-width="4" fill="none" />
</g>


</g><g transform="translate(540, 240)">
  <g class="a popIn" style="animation-delay: 0.2s;">
    <rect x="-145" y="-45" width="290" height="50" rx="25" fill="#1E293B" stroke="#EC4899" stroke-width="2" />
    <text x="0" y="-13" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#EC4899" text-anchor="middle">OVERWHELMED</text>
  </g>

  <text class="a fadeInUp" style="animation-delay: 0.3s;" x="0" y="70" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="76" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">Too Many Apps</text>
  
  <text class="a fadeInUp" style="animation-delay: 0.4s;" x="0" y="140" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="32" fill="#94A3B8" text-anchor="middle">Scattered workflows kill creativity</text>
</g>


<g transform="translate(540, 820)">

  
  <g class="a spinIn1" style="animation-delay: 0.5s;">
    <rect x="-380" y="-220" width="340" height="220" rx="24" fill="url(#windowGrad1)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)" />
    
    <rect x="-350" y="-190" width="280" height="24" rx="6" fill="#0F172A" opacity="0.6" />
    <circle cx="-334" cy="-178" r="6" fill="#EF4444" />
    <circle cx="-314" cy="-178" r="6" fill="#F59E0B" />
    <circle cx="-294" cy="-178" r="6" fill="#10B981" />
    <text x="-350" y="-120" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Calendar &amp; Schedule</text>
    <text x="-350" y="-80" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">3 meetings pending</text>
  </g>

  
  <g class="a spinIn2" style="animation-delay: 0.6s;">
    <rect x="40" y="-220" width="340" height="220" rx="24" fill="url(#windowGrad2)" stroke="#EC4899" stroke-width="2" filter="url(#shadow)" />
    
    <rect x="70" y="-190" width="280" height="24" rx="6" fill="#0F172A" opacity="0.6" />
    <circle cx="86" cy="-178" r="6" fill="#EF4444" />
    <circle cx="106" cy="-178" r="6" fill="#F59E0B" />
    <circle cx="126" cy="-178" r="6" fill="#10B981" />
    <text x="70" y="-120" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Live Analytics</text>
    <path d="M70 -80 L120 -105 L170 -90 L220 -130 L270 -95" stroke="#EC4899" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  
  <g class="a spinIn3" style="animation-delay: 0.7s;">
    <rect x="-380" y="20" width="340" height="220" rx="24" fill="url(#windowGrad2)" stroke="#EC4899" stroke-width="2" filter="url(#shadow)" />
    
    <rect x="-350" y="50" width="280" height="24" rx="6" fill="#0F172A" opacity="0.6" />
    <circle cx="-334" cy="62" r="6" fill="#EF4444" />
    <circle cx="-314" cy="62" r="6" fill="#F59E0B" />
    <circle cx="-294" cy="62" r="6" fill="#10B981" />
    <text x="-350" y="120" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Client Inbox &amp; Notes</text>
    <text x="-350" y="160" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">99+ unread messages</text>
  </g>

  
  <g class="a spinIn4" style="animation-delay: 0.8s;">
    <rect x="40" y="20" width="340" height="220" rx="24" fill="url(#windowGrad1)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)" />
    
    <rect x="70" y="50" width="280" height="24" rx="6" fill="#0F172A" opacity="0.6" />
    <circle cx="86" cy="62" r="6" fill="#EF4444" />
    <circle cx="106" cy="62" r="6" fill="#F59E0B" />
    <circle cx="126" cy="62" r="6" fill="#10B981" />
    <text x="70" y="120" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Cloud Storage &amp; Sync</text>
    <text x="70" y="160" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Storage limit reached</text>
  </g>

  
  <g class="a popIn" style="animation-delay: 0.9s;">
    <circle cx="0" cy="0" r="50" fill="#1E293B" stroke="#EF4444" stroke-width="4" filter="url(#shadow)" />
    
    <g transform="rotate(-90)"><circle cx="0" cy="0" r="40" fill="none" stroke="#EF4444" stroke-width="6" stroke-dasharray="251.2" class="timerDrain" />
    </g><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>
</g>

</svg>