<svg viewBox="0 0 1080 1920" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  .brand-mark { opacity: 1 !important; }
  .bg-base { opacity: 1 !important; }

  .fadeInUp {
    animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popIn {
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .scaleIn {
    animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .tabletIdleCTA {
    animation: tabletFloatCTA 4s ease-in-out infinite alternate;
  }
  .ribbonWaveCTA {
    animation: ribbonMoveCTA 4s ease-in-out infinite alternate;
  }
  .pulseAura {
    animation: pulseAura 2.5s ease-in-out infinite;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes scaleIn {
    0% { opacity: 0; transform: scale(0.9) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes tabletFloatCTA {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-10px); }
  }

  @keyframes ribbonMoveCTA {
    0% { transform: translateY(0px) scaleX(1); }
    100% { transform: translateY(-6px) scaleX(1.03); }
  }

  @keyframes pulseAura {
    0% { transform: scale(1); opacity: 0.25; }
    50% { transform: scale(1.04); opacity: 0.45; }
    100% { transform: scale(1); opacity: 0.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgAltGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E293B" />
    <stop offset="100%" stop-color="#0F172A" />
  </linearGradient>

  <linearGradient id="tabletGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
  </linearGradient>

  <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1" />
  </linearGradient>

  <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
  </linearGradient>

  <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EC4899" stop-opacity="0" />
    <stop offset="50%" stop-color="#EC4899" stop-opacity="1" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
  </linearGradient>

  <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1" />
    <stop offset="100%" stop-color="#EC4899" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="20" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
  </filter>
  
  <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="30" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

<rect class="bg-base" width="1080" height="1920" fill="url(#bgAltGrad)" />

<!-- Background ambient glows -->
<circle cx="340" cy="800" r="450" fill="#6366F1" opacity="0.08" filter="url(#glow)" />
<circle cx="740" cy="1100" r="450" fill="#10B981" opacity="0.08" filter="url(#glow)" />

<!-- Persistent Mini Brand Mark (Top Left) -->
<g class="brand-mark" transform="translate(80, 80)">
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
  <path d="M16 24H32M24 16V32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">CreatorOps</text>
</g>

<!-- Top Section: Headline & Badge (Continuity & CTA Header) -->
<g transform="translate(540, 240)">
  <g class="a popIn" style="animation-delay: 0.2s;">
    <rect x="-135" y="-45" width="270" height="50" rx="25" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
    <text x="0" y="-13" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#6366F1" text-anchor="middle">CLAIM STUDIO</text>
  </g>

  <text class="a fadeInUp" style="animation-delay: 0.3s;" x="0" y="70" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="76" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">Claim Your Studio</text>
  
  <text class="a fadeInUp" style="animation-delay: 0.4s;" x="0" y="140" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="32" fill="#94A3B8" text-anchor="middle">creatorops.in | @creatorops</text>
</g>

<!-- Localized Ribbon Accent near Hero -->
<g transform="translate(390, 435)"><g class="ribbonWaveCTA">
  <path d="M 0 15 Q 150 -15 300 15" stroke="url(#ribbonGrad)" stroke-width="4" fill="none" />
</g></g>

<!-- Hero Element: Glowing Frosted-Glass Tablet with Emerald Aura -->
<g transform="translate(540, 860)">
  <!-- Emerald success aura behind tablet -->
  <circle cx="0" cy="0" r="320" fill="#10B981" class="pulseAura" filter="url(#emeraldGlow)" />

  <g class="tabletIdleCTA">
    <g class="a scaleIn" style="animation-delay: 0.4s;">
      
      <!-- Tablet Frame & Glass -->
      <rect x="-340" y="-300" width="680" height="600" rx="36" fill="url(#tabletGrad)" stroke="#10B981" stroke-width="3" filter="url(#shadow)" />
      <rect x="-340" y="-300" width="680" height="600" rx="36" fill="url(#glassGrad)" />

      <!-- App Header Bar -->
      <g transform="translate(-290, -250)">
        <rect x="0" y="0" width="580" height="60" rx="14" fill="#0F172A" opacity="0.8" />
        <circle cx="30" cy="30" r="12" fill="#10B981" />
        <path d="M24 30 L28 34 L36 26" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="60" y="37" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC">CreatorOps Pro Studio</text>
        <rect x="420" y="15" width="140" height="30" rx="8" fill="#10B981" opacity="0.25" />
        <text x="490" y="35" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="14" fill="#10B981" text-anchor="middle">Ready to Launch</text>
      </g>

      <!-- Dashboard Mini Summary Inside Tablet -->
      <g transform="translate(-290, -170)">
        <rect x="0" y="0" width="280" height="130" rx="16" fill="#0F172A" opacity="0.75" stroke="#334155" stroke-width="1.5" />
        <text x="24" y="38" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="16" fill="#F8FAFC">Time Saved</text>
        <text x="24" y="78" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="32" fill="#10B981">40 hrs / mo</text>
        <text x="24" y="106" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Automated workflows active</text>

        <rect x="300" y="0" width="280" height="130" rx="16" fill="#0F172A" opacity="0.75" stroke="#334155" stroke-width="1.5" />
        <text x="324" y="38" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="16" fill="#F8FAFC">Cost Reduction</text>
        <text x="324" y="78" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="32" fill="#6366F1">3.5x ROI</text>
        <text x="324" y="106" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">All subscriptions unified</text>
      </g>

      <!-- Prominent Success Badge on Tablet -->
      <g transform="translate(0, 30)">
        <circle cx="0" cy="0" r="42" fill="#10B981" filter="url(#shadow)" />
        <path d="M-14 -3 L-4 8 L18 -12" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>

    </g>
  </g>
</g>

<!-- Bottom Section: Call to Action Button & Final Brand Lockup -->
<g transform="translate(540, 1340)">
  <!-- Start Free Trial Button -->
  <g class="a fadeInUp" style="animation-delay: 0.6s;">
    <rect x="-290" y="0" width="580" height="100" rx="30" fill="url(#btnGrad)" filter="url(#shadow)" />
    <text x="0" y="60" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" text-anchor="middle">Start Free Trial Today</text>
  </g>

  <!-- Final Clean Domain & Handle Subtext -->
  <text class="a fadeInUp" style="animation-delay: 0.8s;" x="0" y="150" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="24" fill="#94A3B8" text-anchor="middle">creatorops.in  •  @creatorops</text>
</g>

</svg>