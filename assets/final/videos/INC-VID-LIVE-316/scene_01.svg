<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@700;800&amp;display=swap');

  .a {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
  }

  .brand-mark { opacity: 1 !important; }
  .bg-base { opacity: 1 !important; }

  .fadeInUp {
    animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popIn {
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .floatDrift {
    animation: floatDrift 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, idleFloat 4s ease-in-out infinite alternate 0.8s;
  }
  .scatterGroup {
    animation: scatterMove 5.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes floatDrift {
    0% { opacity: 0; transform: translateY(30px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes idleFloat {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-12px); }
  }

  @keyframes scatterMove {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    40% { transform: translate(0px, 0px) rotate(0deg); }
    100% { transform: translate(0px, 40px) scale(0.96); }
  }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0F172A" />
    <stop offset="100%" stop-color="#1E293B" />
  </linearGradient>

  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
  </linearGradient>

  <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF4B72" />
    <stop offset="100%" stop-color="#C51D3A" />
  </linearGradient>

  <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EC4899" stop-opacity="0" />
    <stop offset="50%" stop-color="#EC4899" stop-opacity="1" />
    <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
  </linearGradient>

  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
  </filter>
</defs>


<rect class="bg-base" width="1080" height="1920" fill="url(#bgGrad)" />


<circle cx="540" cy="800" r="400" fill="#6366F1" opacity="0.08" filter="url(#glow)" />
<circle cx="540" cy="1100" r="300" fill="#EC4899" opacity="0.06" filter="url(#glow)" />


<g class="brand-mark" transform="translate(80, 80)">
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#6366F1" />
  <path d="M16 24H32M24 16V32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="64" y="32" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#F8FAFC">CreatorOps</text>
</g>


<g transform="translate(390, 1248)">
  <path d="M 0 20 Q 150 -10 300 20" stroke="url(#ribbonGrad)" stroke-width="4" fill="none" />
</g>


<g transform="translate(140, 1400)"><g class="a fadeInUp" style="animation-delay: 0.2s;">
  <rect x="0" y="0" width="800" height="16" rx="8" fill="#1E293B" filter="url(#shadow)" />
  <rect x="350" y="16" width="100" height="120" fill="#0B1120" opacity="0.5" />
  <path d="M 300 136 L 500 136 L 540 180 L 260 180 Z" fill="#1E293B" opacity="0.7" />
</g>


</g><g transform="translate(540, 320)">
  
  <g transform="translate(0, 0)"><g class="a popIn" style="animation-delay: 0.3s;">
    <rect x="-135" y="-35" width="270" height="50" rx="25" fill="#1E293B" stroke="#FF4B72" stroke-width="2" />
    <text x="0" y="-3" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="20" fill="#FF4B72" text-anchor="middle">URGENT EXPENSE</text>
  </g>

  
  </g><text class="a fadeInUp" style="animation-delay: 0.4s;" x="0" y="100" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="76" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">Stop Tool Burnout</text>

  
  <text class="a fadeInUp" style="animation-delay: 0.5s;" x="0" y="170" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="32" fill="#94A3B8" text-anchor="middle">Paying $100/mo across 4 apps?</text>
</g>


<g transform="translate(0, 680)"><g class="scatterGroup">

  
  <g transform="translate(180, 0)"><g class="a floatDrift" style="animation-delay: 0.6s;">
    <rect x="0" y="0" width="330" height="210" rx="24" fill="url(#cardGrad)" stroke="#FF4B72" stroke-width="2" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="22" fill="#FF4B72" opacity="0.2" />
    <path d="M42 42 L58 58 M58 42 L42 58" stroke="#FF4B72" stroke-width="3" stroke-linecap="round" />
    <text x="90" y="58" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC">Video Suite</text>
    <text x="40" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Monthly Subscription</text>
    <text x="40" y="160" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="40" fill="#FF4B72">$29.00</text>
  </g>

  
  </g><g transform="translate(570, -20)"><g class="a floatDrift" style="animation-delay: 0.7s;">
    <rect x="0" y="0" width="330" height="210" rx="24" fill="url(#cardGrad)" stroke="#FF4B72" stroke-width="2" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="22" fill="#FF4B72" opacity="0.2" />
    <rect x="38" y="38" width="24" height="24" rx="6" stroke="#FF4B72" stroke-width="3" fill="none" />
    <text x="90" y="58" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC">Scheduler</text>
    <text x="40" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Monthly Subscription</text>
    <text x="40" y="160" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="40" fill="#FF4B72">$24.00</text>
  </g>

  
  </g><g transform="translate(180, 260)"><g class="a floatDrift" style="animation-delay: 0.8s;">
    <rect x="0" y="0" width="330" height="210" rx="24" fill="url(#cardGrad)" stroke="#FF4B72" stroke-width="2" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="22" fill="#FF4B72" opacity="0.2" />
    <path d="M38 60 L46 45 L54 52 L62 38" stroke="#FF4B72" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="90" y="58" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC">Metrics Pro</text>
    <text x="40" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Monthly Subscription</text>
    <text x="40" y="160" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="40" fill="#FF4B72">$22.00</text>
  </g>

  
  </g><g transform="translate(570, 240)"><g class="a floatDrift" style="animation-delay: 0.9s;">
    <rect x="0" y="0" width="330" height="210" rx="24" fill="url(#cardGrad)" stroke="#FF4B72" stroke-width="2" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="22" fill="#FF4B72" opacity="0.2" />
    <path d="M50 36 L50 64 M36 50 L64 50" stroke="#FF4B72" stroke-width="3" stroke-linecap="round" />
    <text x="90" y="58" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC">Cloud Host</text>
    <text x="40" y="110" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Monthly Subscription</text>
    <text x="40" y="160" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="40" fill="#FF4B72">$25.00</text>
  </g>

  
  </g><g transform="translate(540, 160)"><g class="a popIn" style="animation-delay: 1.1s;">
    <rect x="-110" y="-30" width="220" height="60" rx="30" fill="url(#redGlow)" filter="url(#glow)" />
    <text x="0" y="8" font-family="'Poppins', Arial, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" text-anchor="middle">Total: $100/mo</text>
  </g>

</g></g>

</g></svg>